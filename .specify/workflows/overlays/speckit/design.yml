id: geckit-design
extends: speckit
priority: 10
enabled: true
edits:
  - insert_before: plan
    step:
      id: design
      command: speckit.design
      integration: "{{ inputs.integration }}"
      input:
        args: "{{ inputs.spec }}"
  - insert_before: plan
    step:
      id: review-design
      type: gate
      message: "Review the design handoff, UX document, and layout prototype before planning."
      options: [approve, reject]
      on_reject: abort
