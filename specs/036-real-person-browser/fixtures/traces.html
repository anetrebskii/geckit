<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trace check</title>
<script>
  window.traces = { added: [], attributes: [], wheel: 0, clicks: [], keys: 0 }
  new MutationObserver((records) => {
    for (const one of records) {
      if (one.type === 'attributes') window.traces.attributes.push(`${one.target.tagName.toLowerCase()} ${one.attributeName}`)
      for (const node of one.addedNodes) if (node.nodeType === 1) window.traces.added.push(node.tagName.toLowerCase())
    }
  }).observe(document, { subtree: true, childList: true, attributes: true })
  addEventListener('wheel', () => { window.traces.wheel++ }, true)
  addEventListener('click', (event) => { window.traces.clicks.push(event.isTrusted) }, true)
  addEventListener('keydown', (event) => { if (event.isTrusted) window.traces.keys++ }, true)
</script>
<style>
  body { font: 16px system-ui; margin: 24px; }
  .tall { height: 1600px; }
  #report { white-space: pre; background: #eee; padding: 8px; }
</style>
</head>
<body>
<h1>Trace check</h1>
<label>Name <input id="name"></label>
<label>Password <input id="password" type="password"></label>
<label>Token <input id="token"></label>
<button id="show" onclick="document.getElementById('report').textContent = JSON.stringify(window.traces, null, 1)">Show traces</button>
<div class="tall"></div>
<button id="far">Far button</button>
<div id="report"></div>
</body>
</html>
