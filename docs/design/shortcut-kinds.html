<!doctype html>
<html lang="en" data-theme="light">
<head>

<title>GeckIt - Repeating, Scheduled, Shortcuts</title>
<!-- The UX is docs/ux/shortcut-kinds.md. The app's own styles.css supplies every token and the shortcut, views, menu and switch rules. -->
<link rel="stylesheet" href="../../client/src/renderer/src/styles.css">
<style>
  html, body { margin: 0; min-height: 100vh; background: var(--bg-sunken); color: var(--text); }
  body { font: 13px/1.4 var(--font, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .proto-bar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; background: var(--bg-raised); border-bottom: 1px solid var(--border); }

  .stage { display: flex; justify-content: center; padding: 24px 16px 60px; }

  /* The Chat window, reduced to its sidebar and the Shortcuts place. */
  .desk { display: grid; grid-template-columns: 196px 1fr; width: min(1080px, 100%); height: 720px; overflow: hidden; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  .desk-side { display: flex; flex-direction: column; gap: 1px; padding: 38px 8px 12px; background: var(--bg-sunken); border-right: 1px solid var(--border); }
  .desk-side .group { margin: 12px 8px 4px; color: var(--text-faint); font-size: 11px; font-weight: 600; }
  .desk-side span.item { display: flex; gap: 8px; align-items: center; padding: 5px 8px; color: var(--text-dim); border-radius: 6px; }
  .desk-side span.item.on, .desk-side button.item.on { color: var(--text); background: var(--bg-active); }
  .desk-side button.item { display: flex; gap: 8px; align-items: center; width: 100%; padding: 5px 8px; color: var(--text-dim); text-align: left; border-radius: 6px; }

  .badge { margin-inline-start: auto; min-width: 18px; padding: 0 6px; color: var(--danger-text); font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; background: var(--danger-solid); border-radius: 9px; }

  .desk-main { position: relative; min-width: 0; overflow-y: auto; padding: 0 0 40px; }

  .shortcut-when .trouble { color: var(--danger); }

  .who-mark { display: grid; flex: none; place-items: center; inline-size: var(--size); block-size: var(--size); color: var(--text-dim); font-size: calc(var(--size) * 0.39); font-weight: 600; letter-spacing: 0.02em; background: var(--bg-sunken); border-radius: 50%; }
  .who-mark.person { color: var(--text); background: color-mix(in srgb, var(--text) 9%, var(--bg-raised)); }
  .shortcut-when .who { color: var(--text); }
  .shortcut-mark.problem { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .lead { display: flex; flex: 0 0 132px; flex-direction: column; gap: 1px; min-width: 0; }

  .lead.problem b { color: var(--danger); }
  .lead small { color: var(--text-faint); font-size: 11px; }
  .row-note { display: flex; gap: 8px; align-items: center; padding: 0 12px 8px 50px; color: var(--text-dim); font-size: 12px; }
  .row-note button { color: var(--accent); }
  .row-note + .shortcut-row, .shortcut-row + .undo-row, .row-note + .undo-row { border-top: 1px solid var(--border); }
  .undo-row { display: flex; gap: 8px; align-items: center; padding: 10px 12px; color: var(--text-dim); font-size: 12px; }
  .undo-row button { color: var(--accent); font-weight: 600; }
  .shortcut-actions .team-switch { margin-inline: 4px; }

  .pop { position: absolute; z-index: 80; min-width: 210px; padding: 4px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-lg, 10px); box-shadow: var(--shadow); }

  .pop hr { margin: 4px 6px; border: 0; border-top: 1px solid var(--border); }
  .pop .choose { display: grid; gap: 8px; padding: 8px 9px; }
  .pop .choose div { display: flex; gap: 6px; }
  .pop input { min-width: 0; padding: 5px 7px; color: var(--text); background: var(--field); border: 1px solid var(--border-strong); border-radius: var(--radius, 6px); font: inherit; }
  .pop .wrong { color: var(--danger); font-size: 12px; }

  /* The editor, as today, with When in place of "By hand / On a schedule". */
  .editor-scrim { position: absolute; inset: 0; z-index: 70; display: grid; place-items: center; background: var(--scrim); }
  .editor-scrim .dialog.shortcut-list { width: min(820px, 94%); height: min(600px, 92%); }
  .once { display: grid; grid-template-columns: 1fr 92px; gap: 6px; }
  .once input { min-width: 0; padding: 5px 7px; color: var(--text); background: var(--field); border: 1px solid var(--border-strong); border-radius: var(--radius, 6px); font: inherit; }

  /* The phone: iOS grouped list in the product's phone tokens. */
  .phone { position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--ground); border: 1px solid var(--border); border-radius: 44px; box-shadow: var(--shadow); }
  .phone-in { position: absolute; inset: 0; overflow-y: auto; padding: 54px 0 40px; }
  .p-top { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; }
  .p-top button { min-width: 44px; min-height: 44px; color: var(--accent); font-size: 17px; }
  .p-title { margin: 2px 16px 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  .p-top .badge { margin-inline-start: 6px; vertical-align: 2px; }
  .p-title { margin-bottom: 12px; }
  .p-head { margin: 18px 32px 6px; color: var(--text-faint); font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em; }
  .p-group { margin: 0 16px; overflow: hidden; background: var(--bg-raised); border-radius: 10px; }
  .p-swipe { position: relative; overflow: hidden; }
  .p-swipe + .p-swipe .p-row::before { position: absolute; top: 0; right: 0; left: 52px; border-top: 0.5px solid var(--separator); content: ''; }
  .p-acts { position: absolute; inset: 0 0 0 auto; display: flex; }
  .p-acts button { width: 84px; font-size: 15px; }
  .p-acts .later { color: var(--accent-text); background: var(--accent); }
  .p-acts .del { color: var(--danger-text); background: var(--danger-solid); }
  .p-acts .pause { color: var(--bg); background: var(--text-dim); }
  .p-row { position: relative; display: flex; gap: 12px; align-items: center; min-height: 60px; padding: 10px 16px; background: var(--bg-raised); transition: transform 220ms var(--ease); touch-action: pan-y; }
  .p-row .shortcut-mark { inline-size: 30px; block-size: 30px; }
  .p-txt { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; }
  .p-txt b { overflow: hidden; font-size: 17px; font-weight: 400; text-overflow: ellipsis; white-space: nowrap; }
  .p-txt span { overflow: hidden; color: var(--text-dim); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
  .p-txt .trouble { color: var(--danger); }
  .p-when { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .p-when b { font-size: 15px; font-weight: 500; }
  .p-when small { color: var(--text-faint); font-size: 12px; }
  .p-run { min-width: 44px; min-height: 44px; color: var(--accent); font-size: 15px; font-weight: 600; }
  .p-empty { margin: 40px 32px; color: var(--text-dim); text-align: center; }
  .p-empty strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 17px; }
  .p-empty button { margin-top: 14px; min-height: 44px; color: var(--accent); font-size: 17px; }
  .p-sheet-scrim { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 0 8px 30px; background: var(--scrim); }
  .p-sheet { overflow: hidden; background: var(--bg-raised); border-radius: 14px; }

  .p-sheet button { display: block; width: 100%; min-height: 56px; color: var(--accent); font-size: 19px; border-top: 0.5px solid var(--separator); }
  .p-sheet button:first-of-type { border-top: 0; }
  .p-sheet.cancel button { font-weight: 600; }
  .p-sheet button.danger { color: var(--danger); }
  .phone .shortcut-chip { font-size: 12px; }


  /* Scheduled as a month. */
  .desk-main.cal-mode { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  .desk-main .page.cal-page { display: flex; flex: 1; flex-direction: column; min-height: 0; max-width: none; margin: 0; padding: 14px 20px 10px; }
  .cal-head { display: flex; gap: 2px; align-items: center; margin: 0 0 10px; }
  .cal-head h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .cal-head h2 span { color: var(--text-faint); font-weight: 400; }
  .cal-head .quiet { padding-inline: 10px; }
  .cal { display: grid; flex: 1; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto; grid-auto-rows: minmax(0, 1fr); min-height: 0; }
  .cal-wd { padding: 0 8px 6px; color: var(--text-faint); font-size: 11px; font-weight: 600; text-align: end; }
  .cal-day { position: relative; display: flex; flex-direction: column; gap: 1px; min-width: 0; min-height: 0; padding: 4px 4px 2px; overflow: hidden; border-top: 1px solid var(--border); border-inline-start: 1px solid var(--border); outline: none; }
  .cal-day:nth-child(7n + 1) { border-inline-start: 0; }
  .cal-day.weekend { background: color-mix(in srgb, var(--text) 2.5%, transparent); }
  .cal-day.on { background: var(--bg-hover); }
  .cal-day:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-day.drop { background: var(--bg-active); }
  .cal-day .n { display: grid; place-items: center; align-self: flex-end; min-inline-size: 22px; block-size: 22px; padding: 0 4px; margin-bottom: 1px; color: var(--text); font-size: 12px; font-variant-numeric: tabular-nums; border-radius: 11px; }
  .cal-day.other .n { color: var(--text-faint); }
  .cal-day.today .n { color: var(--accent-text); font-weight: 600; background: var(--accent); }
  .cal-chip { display: flex; flex: none; gap: 5px; align-items: center; width: 100%; min-width: 0; padding: 1px 4px; color: var(--text); font-size: 11.5px; line-height: 16px; text-align: left; white-space: nowrap; border-radius: 4px; cursor: default; }
  .cal-chip:hover { background: var(--bg-hover); }
  .cal-chip i { flex: none; inline-size: 7px; block-size: 7px; background: var(--tint); border-radius: 50%; }
  .cal-chip span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .cal-chip time { flex: none; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .cal-chip.problem, .cal-chip.problem time { color: var(--danger); }
  .cal-chip.problem i { background: var(--danger); }
  .cal-chip[aria-expanded="true"] { color: var(--accent-text); background: var(--accent); }
  .cal-chip[aria-expanded="true"] time { color: inherit; opacity: 0.85; }
  .cal-chip[aria-expanded="true"] i { background: var(--accent-text); }
  .cal-chip.dragging { opacity: 0.4; }
  .cal-day { container-type: inline-size; }
  .cal.wk { position: relative; grid-template-rows: auto minmax(0, 1fr); }
  .wk-head { display: flex; gap: 6px; align-items: center; padding: 0 8px 8px; color: var(--text-faint); font-size: 12px; }
  .wk-head .n { display: grid; place-items: center; min-inline-size: 24px; block-size: 24px; padding: 0 4px; color: var(--text); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; border-radius: 12px; }
  .wk-head.today { color: var(--accent); font-weight: 600; }
  .wk-head.today .n { color: var(--accent-text); background: var(--accent); }
  .wk-col { gap: 4px; padding: 6px 5px; overflow-y: auto; }
  .wk-card { display: flex; flex: none; flex-direction: column; gap: 2px; min-width: 0; padding: 5px 7px 6px 9px; color: var(--text); font-size: 12px; line-height: 16px; text-align: left; background: color-mix(in srgb, var(--tint) 12%, var(--bg)); border-radius: 6px; box-shadow: inset 3px 0 0 var(--tint); cursor: default; }
  .wk-card:hover { background: color-mix(in srgb, var(--tint) 18%, var(--bg)); }
  .wk-card time { color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .wk-card .t { display: -webkit-box; overflow: hidden; font-weight: 600; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 4; }
  .wk-card .who { display: flex; gap: 5px; align-items: center; min-width: 0; margin-top: 2px; color: var(--text-dim); font-size: 11.5px; }
  .wk-card .who > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wk-card small { color: var(--text-faint); font-size: 11px; }
  .wk-card small.trouble { color: var(--danger); font-weight: 600; }
  .wk-card.problem { background: color-mix(in srgb, var(--danger) 10%, var(--bg)); box-shadow: inset 3px 0 0 var(--danger); }
  .wk-card.problem:hover { background: color-mix(in srgb, var(--danger) 16%, var(--bg)); }
  .wk-card.problem time { color: var(--danger); }
  .wk-card[aria-expanded="true"] { color: var(--accent-text); background: var(--accent); box-shadow: none; }
  .wk-card[aria-expanded="true"] :is(time, .who, small, small.trouble) { color: inherit; }
  .wk-card[aria-expanded="true"] .who-mark { color: var(--accent); background: var(--accent-text); }
  .wk-card.dragging { opacity: 0.4; }
  .wk-empty { position: absolute; inset: 40% 0 auto; margin: 0; color: var(--text-dim); font-size: 13px; text-align: center; pointer-events: none; }
  @container (max-width: 96px) { .cal-chip time { display: none; } }
  .cal-more { flex: none; align-self: flex-start; padding: 0 4px; color: var(--text-faint); font-size: 11.5px; line-height: 16px; border-radius: 4px; }
  .cal-more:hover { color: var(--text); background: var(--bg-hover); }

  .menu-head b { overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }

  .day-pop { min-width: 240px; }
  .day-pop .menu-head b { white-space: normal; }

  .cal-note { display: flex; flex: none; gap: 8px; align-items: center; min-height: 20px; margin: 6px 2px 0; color: var(--text-dim); font-size: 12px; }
  .cal-note.wrong { color: var(--danger); }
  .cal-note button { color: var(--accent); font-weight: 600; }
  .shortcut-row.hit { background: var(--bg-active); }
  .p-cal { margin: 0 16px; padding: 8px 6px 10px; background: var(--bg-raised); border-radius: 10px; }
  .p-cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 6px; }
  .p-cal-head b { font-size: 17px; font-weight: 600; }
  .p-cal-head button { min-width: 44px; min-height: 44px; color: var(--accent); }
  .p-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .p-cal-grid .wd { padding-bottom: 4px; color: var(--text-faint); font-size: 11px; font-weight: 600; }
  .p-cal-grid button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; padding-top: 4px; font-size: 16px; font-variant-numeric: tabular-nums; }
  .p-cal-grid button > span { display: grid; place-items: center; inline-size: 30px; block-size: 30px; border-radius: 50%; }
  .p-cal-grid button.other { color: var(--text-faint); }
  .p-cal-grid button.today > span { color: var(--accent); font-weight: 600; }
  .p-cal-grid button.on > span { color: var(--accent-text); background: var(--accent); }
  .p-cal-grid i { inline-size: 5px; block-size: 5px; background: var(--text-faint); border-radius: 50%; }
  .p-cal-grid i.problem { background: var(--danger); }
  .p-cal-grid i.none { visibility: hidden; }
  .p-views { margin: 0 16px 12px; }
  @media (prefers-reduced-motion: reduce) { .p-row { transition: none; } }
  @media (max-width: 760px) { .desk { grid-template-columns: 1fr; } .desk-side { display: none; } .desk-main .page { padding: 16px; } .page-bar { flex-wrap: wrap; } .shortcut-list-head { flex-wrap: wrap; } .shortcut-row { flex-wrap: wrap; } .shortcut-actions { margin-inline-start: auto; } }
</style>

<div class="proto-bar">
  <strong>Repeating, Scheduled, Shortcuts</strong>
  <span class="views" role="radiogroup" aria-label="Surface">

  <div class="phone"><div class="phone-in" id="phone"></div></div>
</div>

function placeMenu() {

function bindSwipes() {

    rowEl.addEventListener('contextmenu', (e) => { e.preventDefault(); longPress() })
    rowEl.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; hold = setTimeout(() => { x0 = null; longPress() }, 500); x0 = e.clientX; dx = 0; rowEl.style.transition = 'none'; rowEl.setPointerCapture(e.pointerId) })
    rowEl.addEventListener('pointermove', (e) => { if (x0 === null) return; if (Math.abs(e.clientX - x0) > 6) clearTimeout(hold); dx = Math.min(0, Math.max(-width - 20, e.clientX - x0 + (rowEl.classList.contains('open') ? -width : 0))); rowEl.style.transform = `translateX(${dx}px)` })
    rowEl.addEventListener('pointerup', () => { clearTimeout(hold); if (x0 === null) return; x0 = null; rowEl.style.transition = ''; const open = dx < -width / 2; rowEl.classList.toggle('open', open); rowEl.style.transform = open ? `translateX(${-width}px)` : '' })
  })
}

function phoneCalendar() {
  const m = new Date(cal.month)
  const today = dayStart(NOW)
  const cells = gridDays(cal.month).map((day) => {
    const runs = onDay(day)
    const dot = runs.length === 0 ? 'none' : runs.some(problem) ? 'problem' : ''
    const cls = [new Date(day).getMonth() !== m.getMonth() ? 'other' : '', day === today ? 'today' : '', day === cal.day ? 'on' : ''].filter(Boolean).join(' ')
    return `<button type="button" class="${cls}" data-day="${day}" aria-label="${dayLabel(day)}${runs.length ? `, ${runs.length} scheduled` : ''}" aria-pressed="${day === cal.day}"><span>${new Date(day).getDate()}</span><i class="${dot}"></i></button>`
  }).join('')
  return `<div class="p-cal"><div class="p-cal-head"><button type="button" aria-label="Previous month" data-cal-month="-1">${icon('left', 18)}</button><b>${MONTH_NAMES[m.getMonth()]} ${m.getFullYear()}</b><button type="button" aria-label="Next month" data-cal-month="1">${icon('right', 18)}</button></div><div class="p-cal-grid">${WEEKDAYS_MON.map((w) => `<span class="wd">${w.slice(0, 1)}</span>`).join('')}${cells}</div></div>`
}
function bindCalendar() {

  grid.addEventListener('dragstart', (e) => { const chip = e.target.closest('[data-chip]'); if (!chip) return; cal.drag = chip.dataset.chip; chip.classList.add('dragging'); e.dataTransfer.effectAllowed = 'copyMove'; e.dataTransfer.setData('text/plain', cal.drag) })
  grid.addEventListener('dragend', () => { cal.drag = null; grid.querySelectorAll('.drop, .dragging').forEach((el) => el.classList.remove('drop', 'dragging')) })

    else if (e.key === 'PageUp' || e.key === 'PageDown') { e.preventDefault(); const d = new Date(cal.month); d.setMonth(d.getMonth() + (e.key === 'PageUp' ? -1 : 1)); cal.month = d.getTime(); cal.day = cal.month; ui.focus = `#desk .cal-day[data-day="${cal.day}"]`; render() }

  })
}
function render() { renderDesk(); renderPhone() }
const find = (id) => state.items.find((one) => one.id === id)

  delete one.failed; delete one.missed

}
function runLater(id, t) {

  state.items.push(copy)

document.addEventListener('click', (e) => {

    const day = Number(cell.dataset.day)
    if (e.detail >= 2) { if (day >= dayStart(NOW)) { newOn(day); render() } return }
    cal.day = day
    if (ui.menu || cal.note?.wrong) { ui.menu = null; if (cal.note?.wrong) cal.note = null; ui.focus = `#desk .cal-day[data-day="${day}"]`; render(); return }

  else if (d.calToday !== undefined) { cal.month = monthOf(NOW); cal.day = dayStart(NOW); cal.note = null }
  else if (d.calUndo !== undefined) { const { id, before } = cal.note.undo; const one = find(id); Object.assign(one, before); for (const k of ['from', 'failed', 'missed']) if (before[k] === undefined) delete one[k]; cal.day = dayStart(one.at); cal.note = null }
  else if (d.chip) { const one = find(d.chip); cal.day = dayStart(one.at); ui.menu = ui.menu?.id === one.id && ui.menu.anchor === 'chip' ? null : { id: one.id, mode: 'chip', anchor: 'chip' } }
  else if (d.chipPostpone) ui.menu = { ...ui.menu, mode: 'postpone' }
  else if (d.popChip) ui.menu = { id: d.popChip, mode: 'chip', anchor: 'day', day: ui.menu.day }
  else if (d.dayPop) { cal.day = Number(d.dayPop); ui.menu = { mode: 'day', anchor: 'day', day: cal.day } }
  else if (d.day && !t.closest('.cal-day')) { cal.day = Number(d.day) }
  else if (d.newOn) newOn(Number(d.newOn))
  else if (d.kind) { state.kind = d.kind; ui.search = ''; ui.menu = null; ui.drawer = false }
  else if (d.drawer !== undefined) ui.drawer = true
  else if (d.drawerClose !== undefined) { if (e.target !== t) return; ui.drawer = false }
  else if (d.toggle) { const one = find(d.toggle); one.on = !one.on; ui.focus = t.closest('#desk') ? `#desk [data-toggle="${one.id}"]` : null }
  else if (d.postpone) ui.menu = ui.menu?.id === d.postpone ? null : { id: d.postpone, mode: 'postpone' }
  else if (d.more) ui.menu = ui.menu?.id === d.more ? null : { id: d.more, mode: 'more' }
  else if (d.laterOpen !== undefined) ui.menu = { id: ui.menu.id, mode: 'later' }
  else if (d.dup) duplicate(d.dup)
  else if (d.pick) { const at_ = Number(d.pick); ui.menu.mode === 'later' ? runLater(ui.menu.id, at_) : postpone(ui.menu.id, at_) }
  else if (d.choose !== undefined) { ui.menu.choose = true }
  else if (d.chooseOk !== undefined) {
    const v = new Date(`${document.getElementById('cd').value}T${document.getElementById('ct').value}`).getTime()
    if (!(v > NOW + 60e3)) { ui.menu.error = true } else { ui.menu.mode === 'later' ? runLater(ui.menu.id, v) : postpone(ui.menu.id, v) }
  }
  else if (d.delete) { ui.menu = null; ui.sheet = null; const one = find(d.delete); state.items = state.items.filter((x) => x !== one); ui.undo = one; clearTimeout(ui.undoTimer); ui.undoTimer = setTimeout(() => { ui.undo = null; render() }, 6000); ui.focus = '[data-undo]' }
  else if (d.undo !== undefined) { const one = ui.undo; if (one.at < NOW && !one.failed) one.missed = true; state.items.push(one); ui.undo = null }
  else if (d.run) { ui.menu = null; const one = find(d.run); if (kindOf(one) === 'scheduled') { state.items = state.items.filter((x) => x !== one); state.ran.unshift({ ...one, ranAt: NOW, late: 0 }) } t.textContent = 'Starting...'; setTimeout(render, 700); return }
  else if (d.show !== undefined) { state.kind = 'scheduled'; ui.note = null }
  else if (d.again) { const one = state.ran.find((x) => x.id === d.again); ui.editor = { kind: 'scheduled', when: 'once', name: one.name, folder: one.folder, prompt: '', at: one.ranAt + D } }
  else if (d.new) { ui.editor = { kind: d.new, when: d.new === 'scheduled' ? 'once' : d.new, at: at(1, 9) } }
  else if (d.edit) { ui.menu = null; const one = find(d.edit); ui.editor = { ...one, kind: kindOf(one), when: kindOf(one) === 'scheduled' ? 'once' : kindOf(one) } }
  else if (d.cancel !== undefined || d.closeEditor !== undefined) { ui.editor = null }
  else if (d.save !== undefined) { saveEditor() }
  else if (d.psheet) ui.sheet = { id: d.psheet, mode: 'postpone' }
  else if (d.plater) ui.sheet = { id: d.plater, mode: 'later' }
  else if (d.ppick) { ui.sheet.mode === 'later' ? runLater(ui.sheet.id, Number(d.ppick)) : postpone(ui.sheet.id, Number(d.ppick)) }
  else if (d.sheetClose !== undefined) ui.sheet = null
  else return
  render()
})

function duplicate(id) {
  const one = find(id)
  const kind = kindOf(one)
  const { id: _id, from: _from, failed: _failed, missed: _missed, ...rest } = one
  ui.menu = null; ui.sheet = null
  ui.editor = { ...rest, kind, when: kind === 'scheduled' ? 'once' : kind, name: `${one.name} copy`, at: kind === 'scheduled' ? (one.at > NOW + 60e3 ? one.at : one.at + Math.ceil((NOW - one.at) / D) * D) : undefined }
}
function copyOn(id, day) {
  const one = find(id)
  const t = new Date(one.at), d = new Date(day)
  d.setHours(t.getHours(), t.getMinutes(), 0, 0)
  duplicate(id)
  ui.editor.at = d.getTime()
}
function readEditor() {
  const ed = ui.editor
  const box = document.querySelector('.editor-scrim')
  if (!box) return
  ed.name = box.querySelector('.shortcut-title').value
  ed.prompt = box.querySelector('textarea').value
  const date = box.querySelector('#ed'), time = box.querySelector('#et')
  if (date && time) ed.at = new Date(`${date.value}T${time.value}`).getTime()
  const v = box.querySelector('#ev')
  if (v) ed.vary = v.checked
}
function saveEditor() {
  readEditor()
  const ed = ui.editor
  if (ed.when === 'once' && !(ed.at > NOW + 60e3)) { ed.error = true; return }
  const base = ed.id ? find(ed.id) : { id: `n${Date.now()}`, folder: ed.folder ?? 'geckit', tint: ed.tint ?? '#1f8031', who: ed.who ?? 'Claude', repeat: ed.repeat, next: ed.next, on: ed.on }
  const one = { ...base, name: ed.name || 'Untitled', prompt: ed.prompt || '', vary: ed.vary !== false }
  delete one.at; delete one.repeat; delete one.from; delete one.failed; delete one.missed
  if (ed.when === 'once') one.at = ed.at
  if (ed.when === 'repeating') { one.repeat = base.repeat ?? 'Every weekday at 09:00'; one.next = base.next ?? at(1, 9); one.on = base.on ?? true }
  state.items = state.items.filter((x) => x.id !== one.id).concat(one)
  state.kind = kindOf(one)
  ui.editor = null; ui.focus = `[data-edit="${one.id}"]`
}

document.getElementById('desk').addEventListener('contextmenu', (e) => {
  const chip = e.target.closest('[data-chip]')
  if (chip && !ui.editor) { e.preventDefault(); cal.day = dayStart(find(chip.dataset.chip).at); ui.menu = { id: chip.dataset.chip, mode: 'chip', anchor: 'chip' }; render(); return }
  const rowEl = e.target.closest('.shortcut-row[data-id]')
  if (!rowEl || ui.editor) return
  e.preventDefault(); ui.menu = { id: rowEl.dataset.id, mode: 'more' }; render()
})
document.addEventListener('change', (e) => { if (e.target.id === 'ev') { readEditor(); render(); document.getElementById('ev')?.focus() } })
document.addEventListener('input', (e) => { if (e.target.id === 'find') { ui.search = e.target.value; renderDesk(); const f = document.getElementById('find'); f.focus(); f.setSelectionRange(f.value.length, f.value.length) } })
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'd' && !ui.editor) {
    const id = document.activeElement?.closest?.('#desk .shortcut-row[data-id]')?.dataset.id ?? document.activeElement?.closest?.('#desk [data-chip]')?.dataset.chip ?? ui.menu?.id
    if (id && find(id)) { e.preventDefault(); duplicate(id); render() }
    return
  }
  if (e.key !== 'Escape') return
  if (ui.menu) { const back = menuAnchor(); ui.menu = null; ui.focus = back }
  else if (ui.editor) ui.editor = null
  else if (ui.sheet) ui.sheet = null
  else if (ui.drawer) ui.drawer = false
  else return
  render()
})
document.getElementById('scenario').addEventListener('change', (e) => { state = SCENARIOS[e.target.value](); ui = { search: '', menu: null, note: null, undo: null, editor: null, sheet: null }; render() })
const themeButton = document.getElementById('theme')
const params = new URLSearchParams(location.search)
function setTheme(dark) { document.documentElement.dataset.theme = dark ? 'dark' : 'light'; themeButton.textContent = dark ? 'Light' : 'Dark' }
themeButton.addEventListener('click', () => setTheme(document.documentElement.dataset.theme !== 'dark'))
setTheme(params.get('theme') === 'dark')
if (params.get('view')) document.querySelector(`.proto-bar [data-view="${params.get('view')}"]`)?.click()
if (params.get('data')) { document.getElementById('scenario').value = params.get('data'); state = SCENARIOS[params.get('data')]() }
render()
</script>
</body>
</html>
