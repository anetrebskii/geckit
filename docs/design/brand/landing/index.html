<style>
/* Centered product hero: name, one claim, one action, then the real board */
:root {
  --bg: #FFFFFF; --fg: #16191D; --muted: #5C636B; --line: #E7E9EC; --stage: #F3F4F2;
  --btn-bg: #16191D; --btn-fg: #FFFFFF; --focus: #1F8031;
  --font-ui: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1114; --fg: #F2F4F5; --muted: #9BA3AB; --line: #24282E; --stage: #181B1F;
  --btn-bg: #F2F4F5; --btn-fg: #16191D; --focus: #4AC85C; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1114; --fg: #F2F4F5; --muted: #9BA3AB; --line: #24282E; --stage: #181B1F;
  --btn-bg: #F2F4F5; --btn-fg: #16191D; --focus: #4AC85C; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; -webkit-font-smoothing: antialiased }
a { color: inherit; text-decoration: none }
a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 8px }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { border-bottom: 1px solid var(--line) }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 22px; letter-spacing: -0.01em }
.brand svg { width: 36px; height: 36px; flex: none }
nav { display: flex; align-items: center; gap: 28px; font-size: 15px; font-weight: 500 }
nav .link { color: var(--fg); opacity: .85 }
nav .link:hover { opacity: 1 }
.btn { display: inline-flex; align-items: center; background: var(--btn-bg); color: var(--btn-fg); font-weight: 600; border-radius: 10px; padding: 10px 18px }
.btn:hover { opacity: .9 }
.hero { text-align: center; padding-block: 88px 44px }
h1 { font-size: clamp(34px, 5.4vw, 64px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 800; margin: 0 auto; max-width: 16ch; text-wrap: balance }
.lede { color: var(--muted); font-size: clamp(17px, 1.7vw, 21px); line-height: 1.5; margin: 22px auto 0; max-width: 56ch; text-wrap: balance }
.cta { margin-top: 34px; display: flex; flex-direction: column; align-items: center; gap: 12px }
.cta .btn { font-size: 18px; padding: 15px 30px; border-radius: 12px }
.note { color: var(--muted); font-size: 14px }
.others { color: var(--muted); font-size: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center }
.others a { text-decoration: underline; text-underline-offset: 3px }
.stage { background: var(--stage); border-radius: 22px; padding: clamp(14px, 3.5vw, 48px) clamp(14px, 3.5vw, 48px) 0; overflow: hidden; margin-bottom: 64px }
.stage img { display: block; width: 100%; height: auto; border-radius: 12px 12px 0 0; box-shadow: 0 18px 50px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.06) }
footer { border-top: 1px solid var(--line) }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 24px; color: var(--muted); font-size: 14px }
@media (max-width: 640px) { nav .link { display: none } .hero { padding-block: 56px 32px } }
</style>
