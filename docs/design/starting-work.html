  overscroll-behavior: contain;
}

.phone-alert {
  margin: 0 16px 14px;
  padding: 12px 14px;
  font-size: 15px;
  color: var(--warning-text);
  background: var(--warning-bg);
  border-radius: 12px;
}

.phone-empty {
  margin: 90px 32px;
  font-size: 17px;
  color: var(--text-faint);
  text-align: center;
}

.phone-head {
  margin: 18px 32px 7px;
  font-size: 13px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.phone-head:first-child {
  margin-top: 4px;
}

.phone-group {
  margin: 0 16px;
  overflow: hidden;
  background: var(--bg-raised);
  border-radius: 12px;
}

.phone-question {
  width: 100%;
  color: inherit;
  text-align: left;
  border: 0;
}

.phone-question + .phone-question {
  box-shadow: inset 0 0.5px 0 var(--border);
}

.phone-note {
  margin: 7px 32px 0;
  font-size: 13px;
  color: var(--text-faint);
}

.phone-foot {
  margin: 18px 32px 0;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--text-faint);
}

/* The asks past the third, folded into one line at the foot of the group. */
.phone-fold {
  position: relative;
  width: 100%;
  height: 44px;
  font-size: 17px;
  color: var(--accent);
  box-shadow: inset 0 0.5px 0 var(--separator);
}

/* A row, and what its swipe uncovers on either side. */
.phone-swipe {
  position: relative;
  overflow: hidden;
}

.phone-swipe + .phone-swipe .phone-row::before {
  position: absolute;
  top: 0;
  inset-inline: 36px 0;
  height: 0.5px;
  content: '';
  background: var(--separator);
}

.phone-actions {
  position: absolute;
  inset-block: 0;
  display: flex;
  overflow: hidden;
}

.phone-actions.lead {
  left: 0;
}

.phone-actions.trail {
  right: 0;
  justify-content: flex-end;
}

.phone-action {
  display: flex;
  flex: none;
  flex-direction: column;
  gap: 4px;
  align-items: center;
  justify-content: center;
  width: 84px;
  font-size: 13px;
  font-weight: 600;
  color: var(--on-solid);
  transition: width var(--settle) var(--ease);
}

.phone-action.review {
  background: var(--review-solid);
}

.phone-action.done {
  background: var(--done-solid);
}

.phone-action.more,
.phone-action.back {
  background: var(--more-solid);
}

.phone-row {
  position: relative;
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr);
  column-gap: 10px;
  padding: 11px 16px;
  cursor: default;
  background: var(--bg-raised);
  touch-action: pan-y;
  user-select: none;
  -webkit-touch-callout: none;
  transition: transform 260ms var(--ease);
}

.phone-row.moving {
  transition: none;
}

.phone-dot {
  width: 10px;
  height: 10px;
  margin-top: 6px;
  border-radius: 50%;
}

.phone-dot.working {
  background: var(--accent);
  animation: breathe 1.6s ease-in-out infinite;
}

.phone-dot.asks {
  background: var(--review-solid);
}

.phone-dot.failed {
  background: var(--danger);
}

.phone-dot.unread {
  background: var(--accent);
}

.phone-dot.read {
  box-shadow: inset 0 0 0 1.5px var(--text-faint);
}

@keyframes breathe {
  50% {
    opacity: 0.35;
  }
}

.phone-row-line {
  display: flex;
  gap: 8px;
  align-items: baseline;
}

.phone-row-title {
  display: -webkit-box;
  flex: 1;
  overflow: hidden;
  font-size: 17px;
  font-weight: 600;
  line-height: 22px;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.phone-row-time {
  flex: none;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  color: var(--text-faint);
}

.phone-row-said {
  display: -webkit-box;
  margin-top: 3px;
  overflow: hidden;
  font-size: 15px;
  line-height: 20px;
  color: var(--text-dim);
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.phone-row-said.doing {
  color: var(--accent);
}

.phone-row-asks {
  margin-top: 3px;
  font-size: 15px;
  font-weight: 600;
  color: var(--warning-text);
}

.phone-row-cmd {
  margin-top: 6px;
  padding: 7px 10px;
  overflow: hidden;
  font-family: var(--font-code);
  font-size: 14px;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: var(--bg-sunken);
  border-radius: 8px;
}

.phone-row-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-items: center;
  margin-top: 5px;
  font-size: 13px;
  color: var(--text-faint);
}

.phone-row-tag {
  padding: 1px 6px;
  font-size: 12px;
  background: var(--fill);
  border-radius: 4px;
}

.phone-row-tag.blocked {
  color: var(--danger);
  background: none;
  box-shadow: inset 0 0 0 1px currentColor;
}

.phone-row-answer {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.phone-button {
  flex: 1;
  height: 44px;
  padding: 0 16px;
  font-size: 17px;
  font-weight: 600;
  border-radius: 10px;
}

.phone-button.fill {
  color: var(--accent-text);
  background: var(--accent);
}

.phone-button.grey {
  color: var(--text);
  background: var(--fill);
}

/* A long press lifts the row over a blurred board and opens its menu beside it. */
.phone-veil {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--scrim);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  animation: fade 200ms var(--ease) both;
}

.phone-lifted {
  position: fixed;
  z-index: 61;
  overflow: hidden;
  pointer-events: none;
  border-radius: 12px;
  box-shadow: var(--lift);
  animation: press 260ms var(--ease) both;
}

@keyframes press {
  from {
    transform: scale(0.96);
  }
  60% {
    transform: scale(1.03);
  }
}

.phone-menu {
  position: fixed;
  z-index: 61;
  width: 250px;
  overflow: hidden;
  transform-origin: top left;
  background: var(--menu);
  backdrop-filter: saturate(180%) blur(30px);
  -webkit-backdrop-filter: saturate(180%) blur(30px);
  border-radius: 14px;
  box-shadow: var(--lift);
  animation: grow 260ms var(--ease) both;
}

@keyframes grow {
  from {
    opacity: 0;
    transform: scale(0.6);
  }
}

.phone-menu button {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 44px;
  padding: 0 16px;
  font-size: 17px;
  text-align: start;
}

.phone-menu button + button::before {
  position: absolute;
  inset: 0 0 auto;
  height: 0.5px;
  content: '';
  background: var(--separator);
}

.phone-menu button.accent {
  font-weight: 600;
  color: var(--accent);
}

.phone-menu .gap {
  height: 8px;
  background: var(--fill);
}

/* Sheets: every menu on the phone, rising from the bottom under the thumb. They share one layer, so one opened from another lands on top of it. */
.sheet-scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--scrim);
  animation: fade 240ms var(--ease) both;
}

.sheet {
  position: fixed;
  inset: auto 0 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  max-height: calc(100% - var(--top) - 10px);
  padding: 0 16px calc(var(--bottom) + 12px);
  background: var(--sheet);
  border-radius: 14px 14px 0 0;
  transition: transform 280ms var(--ease);
  animation: sheet 360ms var(--ease) both;
}

.sheet.dragging {
  transition: none;
}

@keyframes sheet {
  from {
    transform: translateY(100%);
  }
}

.sheet-grab {
  display: flex;
  flex: none;
  flex-direction: column;
  align-items: center;
  padding-top: 6px;
  cursor: grab;
  touch-action: none;
}

.sheet-handle {
  width: 36px;
  height: 5px;
  margin-bottom: 10px;
  background: var(--fill-strong);
  border-radius: 3px;
}

.sheet-title {
  padding: 0 16px 12px;
  font-size: 13px;
  color: var(--text-faint);
  text-align: center;
}

.sheet-body {
  min-height: 0;
  overflow-y: auto;
}

.sheet-list {
  overflow: hidden;
  background: var(--bg-raised);
  border-radius: 12px;
}

.sheet-body + .sheet-list,
.sheet-field + .sheet-list {
  margin-top: 10px;
}

.sheet-option {
  position: relative;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 50px;
  padding: 9px 16px;
  font-size: 17px;
  text-align: start;
}

.sheet-option + .sheet-option::before {
  position: absolute;
  top: 0;
  inset-inline: 16px 0;
  height: 0.5px;
  content: '';
  background: var(--separator);
}

.sheet-option > svg {
  flex: none;
  color: var(--accent);
}

.sheet-words {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.sheet-words .says {
  margin-top: 1px;
  font-size: 13px;
  color: var(--text-faint);
}

.sheet-option.danger {
  color: var(--danger);
}

.sheet-option.sheet-cancel {
  justify-content: center;
  font-weight: 600;
  color: var(--accent);
}

.sheet-note {
  margin: 7px 16px 0;
  font-size: 13px;
  color: var(--text-faint);
}

.sheet-field {
  width: 100%;
  padding: 11px 16px;
  color: var(--text);
  background: var(--bg-raised);
  border: 0;
  border-radius: 12px;
  outline: none;
}

/* New task: a sheet almost the height of the screen, the way Mail's new message is. */
.phone-task {
  position: fixed;
  inset: calc(var(--top) + 10px) 0 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  background: var(--sheet);
  border-radius: 14px 14px 0 0;
  transition: transform 280ms var(--ease);
  animation: sheet 360ms var(--ease) both;
}

.phone-task.dragging {
  transition: none;
}

.phone-task-bar {
  display: grid;
  flex: none;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  height: 52px;
  padding: 0 8px;
  touch-action: none;
}

.phone-task-bar b {
  font-size: 17px;
  font-weight: 600;
}

.phone-task-bar button {
  height: 44px;
  padding: 0 8px;
  font-size: 17px;
  color: var(--accent);
  justify-self: start;
}

.phone-task-bar button.strong {
  font-weight: 600;
  justify-self: end;
}

.phone-task-bar button:disabled {
  color: var(--text-faint);
}

.phone-task-form {
  flex: 1;
  min-height: 0;
  padding: 8px 16px calc(var(--bottom) + 16px);
  overflow-y: auto;
}

.phone-task-label {
  margin: 16px 16px 6px;
  font-size: 13px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.phone-task-label:first-child {
  margin-top: 4px;
}

.phone-task-cell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 44px;
  padding: 0 16px;
  font-size: 17px;
  background: var(--bg-raised);
  border-radius: 12px;
}

.phone-task-cell span {
  display: flex;
  gap: 4px;
  align-items: center;
  color: var(--text-faint);
}

.phone-task-text,
.phone-task-goal {
  width: 100%;
  padding: 11px 16px;
  line-height: 22px;
  color: var(--text);
  resize: none;
  background: var(--bg-raised);
  border: 0;
  border-radius: 12px;
  outline: none;
}

.phone-task-text {
  min-height: 132px;
}

.phone-task-photo {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  height: 44px;
  margin-top: 6px;
  padding: 0 16px;
  font-size: 17px;
  color: var(--accent);
}

.phone-task-note {
  margin: 7px 16px 0;
  font-size: 13px;
  color: var(--text-faint);
}

.phone-task .pending {
  padding: 10px 0 0;
}

/* The conversation, pushed in from the right over the board. */
html.phone .talk.over {
  inset: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  border: 0;
  border-radius: 0;
  box-shadow: -8px 0 30px var(--fill-strong);
  transition: transform 280ms var(--ease);
  animation: push 320ms var(--ease) both;
}

@keyframes push {
  from {
    transform: translateX(100%);
  }
}

.phone-edge {
  position: absolute;
  inset-block: 0;
  left: 0;
  z-index: 4;
  width: 20px;
  touch-action: none;
}

.phone-nav {
  position: relative;
  z-index: 2;
  display: grid;
  flex: none;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  min-height: calc(var(--top) + 52px);
  padding: var(--top) 4px 0;
  background: var(--glass);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 0.5px 0 var(--separator);
}

.phone-back {
  display: flex;
  gap: 2px;
  align-items: center;
  height: 44px;
  padding: 0 10px 0 4px;
  font-size: 17px;
  color: var(--accent);
  justify-self: start;
}

.phone-nav-title {
  min-width: 0;
  max-width: 220px;
  text-align: center;
}

.phone-nav-title b {
  display: block;
  overflow: hidden;
  font-size: 17px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.phone-nav-title span {
  font-size: 12px;
  color: var(--text-faint);
}

.phone-nav .phone-icon {
  justify-self: end;
}

html.phone .transcript {
  padding: 16px 0 24px;
  overscroll-behavior: contain;
}

html.phone .turn {
  padding: 0 16px;
}

html.phone .mine {
  width: fit-content;
  max-width: 82%;
  margin-inline-start: auto;
  padding: 9px 14px;
  border-radius: 20px;
}

html.phone .prose {
  font-size: 17px;
  line-height: 1.45;
}

/* A question waiting for an answer stays in reach at the foot of the conversation while the rest scrolls under it. */
html.phone .talk.asks .turn:has(> .card:not(.answered)) {
  position: sticky;
  bottom: 8px;
  z-index: 2;
}

/* The composer under a docked card waits: the card is what needs answering first. */
html.phone .talk.asks .composer {
  pointer-events: none;
  opacity: 0.45;
}

html.phone .card:not(.answered) {
  padding: 16px;
  border: 0;
  border-radius: 18px;
  box-shadow: var(--lift);
}

html.phone .card .card-title {
  font-size: 17px;
  font-weight: 600;
}

html.phone .card .where {
  font-size: 13px;
}

html.phone .card .card-actions {
  display: grid;
  gap: 8px;
}

html.phone .card .card-actions button {
  height: 50px;
  font-size: 17px;
  font-weight: 600;
  border-radius: 12px;
}

html.phone .card .card-actions input {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 12px;
}

html.phone .composer {

  menu.className = 'floating menu explained'
  menu.id = 'menu'
  menu.setAttribute('role', 'menu')
  const ways = [
    ['write', 'pencil', 'Write it', 'The form: project, what to do, a goal. Cmd+N'],
    ['record', 'display', 'Record the screen', 'Show it and talk. The recording becomes the task. Cmd+Alt+R'],
    ['say', 'mic', 'Say it', 'Tell GeckIt what to start, answer or mark. Cmd+Alt+G'],
  ]
  menu.innerHTML = ways
    .map(
      ([value, glyph, label, says]) => `
    <button type="button" role="menuitem" class="menu-item" data-way="${value}">
      <span style="width: 14px; flex-shrink: 0">${icon(glyph, 13)}</span>
      <span class="label">${label}</span>
      <span class="says">${says}</span>
    </button>`,
    )
    .join('')
  document.body.append(scrim, menu)
  const width = menu.getBoundingClientRect().width
  menu.style.left = `${Math.max(8, anchor.right - width)}px`
  menu.style.top = `${anchor.bottom + 4}px`
  const items = [...menu.querySelectorAll('[role=menuitem]')]
  let at = 0
  const mark = () => items.forEach((one, i) => one.classList.toggle('at', i === at))
  mark()
  items.forEach((one, i) => {
    one.addEventListener('mousemove', () => ((at = i), mark()))
    one.addEventListener('click', () => pick(one.dataset.way))
  })
  menu.tabIndex = -1
  menu.focus()
  menu.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowDown') (event.preventDefault(), (at = Math.min(at + 1, items.length - 1)), mark())
    if (event.key === 'ArrowUp') (event.preventDefault(), (at = Math.max(at - 1, 0)), mark())
    if (event.key === 'Enter') (event.preventDefault(), pick(items[at].dataset.way))
    if (event.key === 'Escape') (event.preventDefault(), closeMenu(), more.focus())
  })
}
function closeMenu() {
  document.getElementById('menu')?.remove()
  document.getElementById('menu-scrim')?.remove()
  document.getElementById('more')?.classList.remove('on')
}
function pick(way) {
  closeMenu()
  if (way === 'write') openForm(false)
  if (way === 'record') record('capsule')
  if (way === 'say') sayCapsule()
}

// The form, with the row of other ways under the field.

function openForm(question) {
  form = { question, root: 'trailmap', text: '', goal: '', frames: [], seconds: 0 }
  drawForm()
  document.querySelector('.new-task-text').focus()
}

function drawForm() {
  const spot = document.getElementById('form-spot')
  if (form === undefined) {
    spot.innerHTML = ''
    return
  }
  const q = form.question
  const ready = form.text.trim() !== '' || form.frames.length > 0
  spot.innerHTML = `
    <div class="talk-scrim" id="form-scrim"></div>
    <div class="new-task" role="dialog" aria-label="${q ? 'Ask a question' : 'New task'}">
      <div class="new-task-head">${q ? 'Ask a question' : 'New task'}</div>
      ${q ? '' : `<label class="new-task-label">Project<select class="new-task-where">${PROJECTS.map(([p]) => `<option${p === form.root ? ' selected' : ''}>${p}</option>`).join('')}</select></label>`}
      <label class="new-task-label">${q ? 'Question' : 'What to do'}
        <textarea class="new-task-text" rows="5" placeholder="${q ? 'Anything, not about a project. Paste a picture, drop a file, or record the screen' : 'Ask Claude Code. Paste a picture, drop a file, or record the screen'}">${esc(form.text)}</textarea>
      </label>
      <div class="new-task-ways">
        <button type="button" class="quiet" id="form-record" title="Show what you mean and talk; the words and frames come back into this form (Cmd+Alt+R)">${icon('display', 13)}Record the screen</button>
        <button type="button" class="quiet" id="form-dictate" title="Say it instead of typing it (Cmd+Alt+V)">${icon('mic', 13)}Dictate</button>
      </div>
      ${
        form.frames.length === 0
          ? ''
          : `<div class="pending">${form.frames
              .map((rects, i) => `<span class="pending-one">${shot(rects)}<button type="button" class="icon-button" data-drop="${i}" aria-label="Take this picture off" title="Take this picture off">${icon('close', 11)}</button></span>`)
              .join('')}</div>
        <div class="new-task-recorded">${icon('display', 12)}<span>From a ${time(form.seconds)} recording. Claude gets the video too.</span><button type="button" class="icon-button" id="drop-recording" aria-label="Take the recording off" title="Take the recording off">${icon('close', 11)}</button></div>`
      }
      ${q ? '' : `<label class="new-task-label">Goal<input class="new-task-goal" value="${esc(form.goal)}" placeholder="When it is done, as a condition. Leave empty for none" /></label>`}
      <div class="new-task-foot">
        <span class="new-task-why">${q ? 'Not on the board. It is forgotten 5 minutes after the last answer. Cmd+Enter asks' : form.goal.trim() === '' ? 'No goal: it stops when Claude is done. Cmd+Enter starts it' : 'Claude keeps working until this holds, then the card goes to In review'}</span>
        <span class="spacer"></span>
        <button type="button" class="quiet" id="form-cancel">Cancel</button>
        <button type="button" class="primary" id="form-start"${ready ? '' : ' disabled'}>${q ? 'Ask' : 'Start'}</button>
      </div>
    </div>`
  const text = spot.querySelector('.new-task-text')
  text.addEventListener('input', () => {
    form.text = text.value
    spot.querySelector('#form-start').disabled = form.text.trim() === '' && form.frames.length === 0
  })
  spot.querySelector('.new-task-goal')?.addEventListener('input', (e) => (form.goal = e.target.value))
  spot.querySelector('.new-task-where')?.addEventListener('change', (e) => (form.root = e.target.value))
  spot.querySelector('#form-scrim').addEventListener('mousedown', closeForm)
  spot.querySelector('#form-cancel').addEventListener('click', closeForm)
  spot.querySelector('#form-start').addEventListener('click', start)
  spot.querySelector('#form-record').addEventListener('click', () => record('form'))
  spot.querySelector('#form-dictate').addEventListener('click', () => {
    text.focus()
    text.setRangeText((text.value && !text.value.endsWith(' ') ? ' ' : '') + 'Also check the same menu on the route page.', text.selectionStart, text.selectionEnd, 'end')
    form.text = text.value
    spot.querySelector('#form-start').disabled = false
  })
  spot.querySelectorAll('[data-drop]').forEach((b) =>
    b.addEventListener('click', () => {
      form.frames.splice(Number(b.dataset.drop), 1)
      if (form.frames.length === 0) form.seconds = 0
      drawForm()
    }),
  )
  spot.querySelector('#drop-recording')?.addEventListener('click', () => {
    form.frames = []
    form.seconds = 0
    drawForm()
  })
  spot.querySelector('.new-task').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) (event.preventDefault(), start())
    if (event.key === 'Escape') (event.preventDefault(), closeForm())
  })
}

function closeForm() {
  form = undefined
  drawForm()
  document.getElementById('new').focus()
}

function start() {
  if (form.text.trim() === '' && form.frames.length === 0) return
  const color = PROJECTS.find(([p]) => p === form.root)?.[1] ?? 0
  const card = { title: form.text.trim().split(/[.\n]/)[0].slice(0, 44) || 'From a recording', project: form.root, color, at: 'now', column: 0, working: true }
  cards.unshift(card)
  closeForm()
  drawBoard(card)
}

// Recording: GeckIt goes behind, the capsule records, and the words and frames come back to where it was started.

let tick, elapsed
function record(into) {
  const keep = form
  document.getElementById('desk').classList.add('on')
  elapsed = 0
  const spot = document.getElementById('spot')
  const draw = () => {
    spot.innerHTML = `<div class="capsule">
      <span class="recording-what"><span class="rec-dot" aria-hidden="true"></span>${icon('display', 15)}<span>Recording the screen</span></span>
      <span class="time">${time(elapsed)}</span>
      <span class="rule" aria-hidden="true"></span>
      <span class="mic">${icon('mic', 15)}</span>
      <span class="bars">${[6, 12, 18, 9, 5].map((h) => `<span style="height:${h}px"></span>`).join('')}</span>
      <button type="button" class="icon-button" id="rec-stop" aria-label="Stop" title="Stop (Enter)" style="color: var(--danger)">${icon('stop', 13)}</button>
      <button type="button" class="icon-button" id="rec-cancel" aria-label="Throw away" title="Throw away (Esc)">${icon('close')}</button>
    </div>`
    spot.querySelector('#rec-stop').addEventListener('click', stop)
    spot.querySelector('#rec-cancel').addEventListener('click', cancel)
  }
  const back = () => {
    clearInterval(tick)
    document.removeEventListener('keydown', keys)
    spot.innerHTML = ''
    document.getElementById('desk').classList.remove('on')
  }
  const stop = () => {
    clearInterval(tick)
    document.removeEventListener('keydown', keys)
    const seconds = Math.max(elapsed, 42)
    spot.innerHTML = `<div class="capsule">${icon('spinner', 14, 'glyph spinning')}<span>Writing it down</span></div>`
    setTimeout(() => {
      back()
      if (into === 'form' && keep !== undefined) {
        form = keep
        form.text = form.text.trim() === '' ? HEARD : `${form.text.trimEnd()}\n${HEARD}`
        form.frames = [...form.frames, ...FRAMES].slice(-8)
        form.seconds += seconds
        drawForm()
        const text = document.querySelector('.new-task-text')
        text.focus()
        text.setSelectionRange(text.value.length, text.value.length)
      } else {
        spot.innerHTML = `<div class="capsule"><span>The capsule asks "Ask" or "Make a task", as the shortcut does (see screen-recording.html)</span><button type="button" class="icon-button" id="x" aria-label="Close">${icon('close')}</button></div>`
        spot.querySelector('#x').addEventListener('click', () => (spot.innerHTML = ''))
      }
    }, 1100)
  }
  const cancel = () => {
    back()
    if (into === 'form' && keep !== undefined) {
      form = keep
      drawForm()
    }
  }
  const keys = (event) => {
    if (event.key === 'Enter') (event.preventDefault(), stop())
    if (event.key === 'Escape') (event.preventDefault(), cancel())
  }
  if (into === 'form') document.getElementById('form-spot').innerHTML = ''
  draw()
  tick = setInterval(() => {
    elapsed += 1
    const t = spot.querySelector('.time')
    if (t) t.textContent = time(elapsed)
  }, 1000)
  document.addEventListener('keydown', keys)
}

function sayCapsule() {
  const spot = document.getElementById('spot')
  spot.innerHTML = `<div class="capsule">${icon('mic', 15)}<span>The "Say what to do" capsule, as Cmd+Alt+G opens it today</span><button type="button" class="icon-button" id="x" aria-label="Close">${icon('close')}</button></div>`
  spot.querySelector('#x').addEventListener('click', () => (spot.innerHTML = ''))
}

// Wiring

document.getElementById('new').addEventListener('click', () => openForm(false))
document.getElementById('ask').addEventListener('click', () => openForm(true))
document.getElementById('more').addEventListener('click', openMenu)
document.addEventListener('keydown', (event) => {
  if (!(event.metaKey || event.ctrlKey) || document.getElementById('spot').innerHTML !== '') return
  if (event.altKey && event.code === 'KeyR') return (event.preventDefault(), form === undefined ? record('capsule') : record('form'))
  if (event.key.toLowerCase() === 'n' && form === undefined) (event.preventDefault(), openForm(event.shiftKey))
})
document.getElementById('proto-reset').addEventListener('click', reset)
document.getElementById('proto-theme').addEventListener('click', (event) => {
  const dark = document.documentElement.dataset.theme !== 'dark'
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'
  event.currentTarget.textContent = dark ? 'Light' : 'Dark'
})
drawIcons(document)
reset()
</script>
</body>
