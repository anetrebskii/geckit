@import '@fontsource-variable/inter';
@import '@fontsource-variable/jetbrains-mono';

/*
 * One stylesheet for three windows.
 *
 * Everything is a token. A literal colour in a rule below is a mistake: a
 * colour that exists in one theme only is a colour that is invisible in the
 * other, and there is no way to notice that while writing the rule.
 */

:root,
:root[data-theme='light'] {
  --bg: #ffffff;
  --bg-sunken: #f4f4f6;
  --bg-raised: #ffffff;
  /* The person's own message, and the field it was written in. */
  --bubble: #f4f4f6;
  --field: #ffffff;
  --bg-hover: rgb(0 0 0 / 5%);
  --bg-active: rgb(51 183 70 / 12%);
  --border: #e3e3e6;
  --border-strong: #cdcdd2;
  --text: #1d1d1f;
  --text-dim: #5c5c61;
  --text-faint: #737378;
  --accent: #1f8031;
  --accent-text: #ffffff;
  --accent-soft: #e6f4e8;
  --danger: #c0392b;
  --danger-solid: #c0392b;
  --danger-text: #ffffff;
  --warning-bg: #fdf3e0;
  --warning-text: #8a6116;
  --success-text: #2a7d3a;
  --highlight: #fbeeb6;
  --tooltip-bg: #2b2b2e;
  --tooltip-text: #f2f2f4;
  --code-bg: #f6f6f8;
  /* The phone's own: iOS grouped lists, their hairlines, and the coloured backs of a swiped row. */
  --ground: #f2f2f5;
  --fill: rgb(118 118 128 / 12%);
  --fill-strong: rgb(118 118 128 / 20%);
  --separator: rgb(60 60 67 / 18%);
  --scrim: rgb(0 0 0 / 28%);
  --glass: rgb(249 249 251 / 82%);
  --menu: rgb(246 246 248 / 96%);
  --lift: 0 0 0 0.5px rgb(0 0 0 / 8%), 0 18px 50px rgb(0 0 0 / 22%);
  --review-solid: #c08a1e;
  --unread: #007aff;
  --done-solid: #2e9a42;
  --more-solid: #8e8e93;
  --favorite: #ffcc00;
  --sheet: #f2f2f5;
  --on-solid: #ffffff;
  /* The Mac's screen is shown on black in either theme, as a photo or a video is. */
  --screen: #000000;
  --screen-bar: rgb(0 0 0 / 55%);
  --screen-text: #f2f2f4;
  --shadow: 0 0 0 0.5px rgb(0 0 0 / 6%), 0 8px 24px rgb(0 0 0 / 12%), 0 2px 6px rgb(0 0 0 / 6%);
  /* A project's name, in the colour it was given: sky, blue, indigo, violet, purple, magenta, pink, slate. */
  --project-0: hsl(196 80% 32%);
  --project-1: hsl(220 70% 45%);
  --project-2: hsl(258 55% 52%);
  --project-3: hsl(300 45% 40%);
  --project-4: hsl(338 65% 44%);
  --project-5: hsl(176 70% 26%);
  --project-6: hsl(30 40% 38%);
  --project-7: hsl(215 16% 42%);
}

:root[data-theme='dark'] {
  --bg: #1e1e20;
  --bg-sunken: #191919;
  --bg-raised: #262629;
  --bubble: #2a2a2d;
  --field: #2a2a2d;
  --bg-hover: rgb(255 255 255 / 7%);
  --bg-active: rgb(74 200 92 / 18%);
  --border: #35353a;
  --border-strong: #4a4a50;
  --text: #f2f2f4;
  --text-dim: #a2a2a8;
  --text-faint: #8e8e95;
  --accent: #4ac85c;
  --accent-text: #10210f;
  --accent-soft: rgb(74 200 92 / 16%);
  --danger: #e0796b;
  --danger-solid: #e5484d;
  --danger-text: #ffffff;
  --warning-bg: #3a2f18;
  --warning-text: #e0bb72;
  --success-text: #7fc98d;
  --highlight: #57481f;
  --tooltip-bg: #3a3a3f;
  --tooltip-text: #f2f2f4;
  --code-bg: #1a1a1c;
  --ground: #000000;
  --fill: rgb(118 118 128 / 24%);
  --fill-strong: rgb(118 118 128 / 36%);
  --separator: rgb(84 84 88 / 55%);
  --scrim: rgb(0 0 0 / 50%);
  --glass: rgb(30 30 32 / 82%);
  --menu: rgb(44 44 46 / 96%);
  --lift: 0 0 0 0.5px rgb(255 255 255 / 8%), 0 18px 50px rgb(0 0 0 / 60%);
  --review-solid: #a8781a;
  --unread: #0a84ff;
  --done-solid: #2b8a3c;
  --more-solid: #636366;
  --favorite: #ffd60a;
  --sheet: #1c1c1e;
  --on-solid: #ffffff;
  --screen: #000000;
  --screen-bar: rgb(0 0 0 / 55%);
  --screen-text: #f2f2f4;
  --shadow: 0 0 0 0.5px rgb(0 0 0 / 40%), 0 12px 32px rgb(0 0 0 / 46%), 0 2px 8px rgb(0 0 0 / 30%);
  --project-0: hsl(196 70% 64%);
  --project-1: hsl(220 85% 72%);
  --project-2: hsl(258 75% 78%);
  --project-3: hsl(300 50% 72%);
  --project-4: hsl(338 75% 75%);
  --project-5: hsl(172 50% 58%);
  --project-6: hsl(32 40% 66%);
  --project-7: hsl(215 18% 68%);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #1e1e20;
    --bg-sunken: #191919;
    --bg-raised: #262629;
  --bubble: #2a2a2d;
  --field: #2a2a2d;
    --bg-hover: rgb(255 255 255 / 7%);
    --bg-active: rgb(74 200 92 / 18%);
    --border: #35353a;

    --danger: #e0796b;

    --ground: #000000;
    --fill: rgb(118 118 128 / 24%);
    --fill-strong: rgb(118 118 128 / 36%);
    --separator: rgb(84 84 88 / 55%);
    --scrim: rgb(0 0 0 / 50%);
    --glass: rgb(30 30 32 / 82%);
    --menu: rgb(44 44 46 / 96%);
    --lift: 0 0 0 0.5px rgb(255 255 255 / 8%), 0 18px 50px rgb(0 0 0 / 60%);
    --review-solid: #a8781a;
    --unread: #0a84ff;
    --done-solid: #2b8a3c;
    --more-solid: #636366;

    --sheet: #1c1c1e;
    --on-solid: #ffffff;
    --screen: #000000;
    --screen-bar: rgb(0 0 0 / 55%);
    --screen-text: #f2f2f4;
    --shadow: 0 0 0 0.5px rgb(0 0 0 / 40%), 0 12px 32px rgb(0 0 0 / 46%), 0 2px 8px rgb(0 0 0 / 30%);
    --project-0: hsl(196 70% 64%);
    --project-1: hsl(220 85% 72%);
    --project-2: hsl(258 75% 78%);
    --project-3: hsl(300 50% 72%);
    --project-4: hsl(338 75% 75%);
    --project-5: hsl(172 50% 58%);
    --project-6: hsl(32 40% 66%);
    --project-7: hsl(215 18% 68%);
  }
}

:root {
  --font-ui: 'Inter Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-code: 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 6px;
  --radius-lg: 10px;
  --topbar: 38px;
  --ease: cubic-bezier(0.2, 0.8, 0.3, 1);
  --quick: 90ms;
  --settle: 180ms;
}

* {
  box-sizing: border-box;
}

html,
body,
#root {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  cursor: default;
  user-select: none;
}

/* The dictation capsule floats: its window is transparent, and so is its page. */
body.clear {
  background: transparent;
}

input,
textarea {
  user-select: text;
}

button {
  font: inherit;
  color: inherit;
  padding: 0;
  background: none;
  border: none;
  cursor: pointer;
}

button:disabled {
  cursor: default;
  opacity: 0.35;
}

/* A row as wide as its column would move by tens of pixels if scaled, so it sinks by a pixel instead. */
button:active:not(:disabled, .did, .menu-item, .group, .project, .new-session) {
  transform: scale(0.97);
}

:is(.did, .menu-item, .group, .project, .new-session):active:not(:disabled) {
  transform: translateY(1px);
}

button,
.row,
.tab,
.item,
.chip,
.menu-item {
  transition:
    background-color var(--quick) var(--ease),
    color var(--quick) var(--ease),
    border-color var(--quick) var(--ease),
    opacity var(--quick) var(--ease);
}

:is(.did, .menu-item, .group, .project, .new-session) {
  transition:
    background-color var(--quick) var(--ease),
    color var(--quick) var(--ease),
    border-color var(--quick) var(--ease),
    opacity var(--quick) var(--ease),
    transform var(--quick) var(--ease);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
  border-radius: 4px;
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-thumb {
  background-clip: padding-box;
  background-color: var(--border-strong);
  border: 3px solid transparent;
  border-radius: 6px;
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--text-faint);
}

::-webkit-scrollbar-track {
  background: transparent;
}

/* ------------------------------------------------------------------ */
/* Shared pieces                                                       */
/* ------------------------------------------------------------------ */

.drag {
  -webkit-app-region: drag;
}

.no-drag {
  -webkit-app-region: no-drag;
}

.spacer {
  flex: 1;
}

.floating {
  position: fixed;
  z-index: 50;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.primary {
  padding: 6px 14px;
  color: var(--accent-text);
  background: var(--accent);
  border-radius: var(--radius);
}

.quiet {
  padding: 6px 12px;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.quiet:hover:not(:disabled) {
  color: var(--text);
  background: var(--bg-hover);
}

.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  color: var(--text-faint);
  border-radius: 5px;
}

.icon-button:hover:not(:disabled) {
  color: var(--text);
  background: var(--bg-hover);
}

/* Board or list: both shown side by side, the one in use raised, so it reads as a choice of two. */
.views {
  display: inline-flex;
  flex-shrink: 0;
  gap: 2px;
  padding: 2px;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 7px;
}

.views button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 22px;
  padding: 0 9px 0 7px;
  color: var(--text-faint);
  font-size: 12px;
  border-radius: 5px;
}

.views button:hover:not(.on) {
  color: var(--text);
}

.views button.on {
  color: var(--text);
  background: var(--bg-raised);
  box-shadow: 0 0 0 1px var(--border-strong);
}

.empty {
  padding: 12px 16px;
  color: var(--text-dim);
}

.error {
  padding: 6px 2px;
  color: var(--danger);
}

input[type='text'],
input[type='url'],
input[type='password'],
input[type='time'],
input[type='number'],
textarea,
select {
  font: inherit;
  color: inherit;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 8px;
}

textarea {
  resize: none;
}

::placeholder {
  color: var(--text-faint);
}

/* Menus */

/* Over a dialog it is opened from. Both classes, because `.scrim` is written further down and would otherwise put this back under the dialog. */
.scrim.menu-scrim {
  z-index: 79;
}

.menu {
  z-index: 80;
  min-width: 170px;
  max-width: min(460px, calc(100vw - 16px));
  max-height: 60vh;
  overflow-y: auto;
  padding: 4px;
  animation: pop var(--settle) var(--ease) both;
}

.menu-title {
  padding: 6px 9px 3px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 9px;
  text-align: left;
  border-radius: 5px;
  white-space: nowrap;
}

.menu-item:hover,
.menu-item.open {
  background: var(--bg-hover);
}

/* Named and not choosable, such as a model this Claude Code is too old to run. */
.menu-item:disabled,
.sheet-option:disabled {
  color: var(--text-faint);
  cursor: default;
}

.menu-item:disabled:hover {
  background: none;
}

.menu-item.on {
  color: var(--accent);
}

.menu-item .label {
  flex-shrink: 0;
  max-width: calc(100% - 22px);
  overflow: hidden;
  text-overflow: ellipsis;
}

.menu-item .says {
  overflow: hidden;
  font-size: 12px;
  color: var(--text-faint);
  text-overflow: ellipsis;
}

/* Under the choices and in line with their names. As wide as the menu the choices make, never wider. A line of its own for each thing it says. */
.menu-note {
  width: 0;
  min-width: 100%;
  padding: 6px 9px 5px 31px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-faint);
  white-space: pre-line;
}

.menu.explained {
  width: min(320px, calc(100vw - 16px));
}

.menu.explained .menu-item {
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr);
  row-gap: 2px;
  column-gap: 8px;
  align-items: center;
  padding: 7px 9px;
  white-space: normal;
}

.menu.explained .menu-item .label {
  max-width: none;
}

.menu.explained .menu-item .says {
  grid-column: 2;
  line-height: 1.4;
}

.menu-item.danger:hover {
  color: var(--danger);
}

/* The arrow of a choice with its own list, which opens beside the menu. */
.menu-more {
  display: flex;
  margin-left: auto;
  padding-left: 12px;
  color: var(--text-faint);
}

.menu-side {
  z-index: 81;
  min-width: 170px;
}

/* The open questions: a title with the time left at its right, one line of the answer under it. */
.questions-menu {
  width: min(340px, calc(100vw - 16px));
}

.question-item {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 52px;
  border-radius: 5px;
}

.question-item:hover,
.question-item.confirming {
  background: var(--bg-hover);
}

.question-open {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  min-height: 52px;
  justify-content: center;
  padding: 7px 72px 7px 31px;
  text-align: left;
}

.question-title,
.question-says {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.question-says {
  font-size: 12px;
  color: var(--text-faint);
}

/* Where the board cards put their time. It makes way for the bin under the pointer. */
.question-left {
  position: absolute;
  top: 8px;
  right: 10px;
  font-size: 12px;
  color: var(--text-faint);
  pointer-events: none;
}

.question-pin,
.question-bin {
  position: absolute;
  top: 5px;
  right: 5px;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 5px;
  color: var(--text-faint);
  opacity: 0;
}

.question-item:hover .question-left {
  visibility: hidden;
}

.question-pin {
  right: 31px;
}

.question-item:hover .question-pin,
.question-item:hover .question-bin,
.question-pin:focus-visible,
.question-bin:focus-visible {
  opacity: 1;
}

.question-pin:hover {
  color: var(--text);
  background: var(--border);
}

.question-pin.on {
  color: var(--accent);
}

.question-bin:hover {
  color: var(--danger);
  background: var(--border);
}

/* The row asks in place, on one line and at the same height, so nothing under it moves. */
.question-item.confirming {
  flex-direction: row;
  align-items: center;
  gap: 12px;
  padding: 0 10px 0 31px;
}

.question-item.confirming .question-title {
  flex: 1;
  min-width: 0;
}

.question-confirm {
  display: flex;
  flex-shrink: 0;
  gap: 6px;
}

.question-cancel,
.question-delete {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 11px;
  font-size: 12px;
  border-radius: 5px;
}

.question-cancel {
  color: var(--text);
  background: var(--bg-raised);
  border: 1px solid var(--border);
}

.question-cancel:hover {
  color: var(--text);
}

.question-delete {
  color: var(--danger-text);
  background: var(--danger-solid);
  border: 1px solid transparent;
}

/* The project picker */

/* A project's colour, and the colours to choose from under it. */
.project-dot,
/* The check that says a project is listed, pressed on its own to add or drop it. */
.project-pick {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 18px;
  height: 18px;
  margin-left: -2px;
  color: var(--accent);
  border-radius: 5px;
}

.project-pick:hover {
  background: var(--bg-hover);
  box-shadow: inset 0 0 0 1px var(--border-strong);
}

.projects-hint {
  padding: 6px 12px 8px;
  font-size: 11px;
  line-height: 1.4;
  color: var(--text-faint);
}

.project-dot-space {
  flex-shrink: 0;
  width: 9px;
  height: 9px;
  margin-right: 2px;
  border-radius: 50%;
}

.project-dot:hover {
  box-shadow: 0 0 0 3px var(--bg-hover);
}

.project-palette {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  padding: 4px 9px 8px 31px;
}

.project-swatch {
  width: 18px;
  height: 18px;
  border-radius: 50%;
}

.project-swatch.on {
  box-shadow: 0 0 0 2px var(--bg-raised), 0 0 0 3.5px currentColor;
}

.menu.projects {
  width: min(420px, calc(100vw - 16px));
}

.projects-field {
  width: 100%;
  margin-bottom: 4px;
}

.projects.single .projects-field {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--bg-raised);
}

.project-row {
  cursor: default;
}

.project-row.at {
  background: var(--bg-hover);
}

.menu-item.project-row {
  padding-block: 4px;
}

/* One line per project: the name whole, the path after it cut first. */
.project-row .lines {
  display: flex;
  flex: 1;
  gap: 8px;
  align-items: baseline;
  min-width: 0;
}

.project-row .name {
  flex-shrink: 0;
  max-width: 70%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.project-row .says {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.project-row .forget {
  opacity: 0;
}

/* Keeps the count on the All projects row in line with the rows that can be taken off. */
.project-row .forget-space {
  flex-shrink: 0;
  width: 26px;
}

.project-row:hover .forget,
.project-row.at .forget,
.project-row .forget:focus-visible {
  opacity: 1;
}

/* A Chrome in the Chrome menu: the check, its name with the extension's own under it, and the pencil that names it. */
.menu.explained .menu-item.browser-row {
  grid-template-columns: 14px minmax(0, 1fr) auto;
  padding-block: 4px;
}

.browser-words {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.browser-row .browser-name-field {
  width: 100%;
  padding: 1px 5px;
  margin-left: -6px;
}

.browser-row .rename {
  opacity: 0;
}

.browser-row:hover .rename,
.browser-row .rename:focus-visible {
  opacity: 1;
}

.waits-count {
  flex-shrink: 0;
  min-width: 18px;
  padding: 1px 6px;
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  border-radius: 9px;
  font-variant-numeric: tabular-nums;
}

/* What stands in a project, beside what waits in it: the board's In progress and To do. */
.project-count {
  display: flex;
  flex-shrink: 0;
  gap: 3px;
  align-items: center;
  padding: 1px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  background: var(--bg-sunken);
  border-radius: 9px;
  font-variant-numeric: tabular-nums;
}

.waits-count.asks {
  color: var(--warning-text);
  background: var(--warning-bg);
}

.waits-count.unread {
  color: var(--accent);
  background: var(--accent-soft);
}

.menu-divider {
  height: 1px;
  margin: 4px 6px;
  background: var(--border);
}

.scrim {
  position: fixed;
  inset: 0;
  z-index: 49;
}

/* Dialogs */

.dialog-scrim {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;

.vpn-settings {

.vpn-settings h3 {

.vpn-settings > .assistant-option {

.vpn-addresses {

.vpn-addresses > label {

.vpn-addresses textarea {

.vpn-note {

.vpn-alert {

}

.vpn-actions {

.vpn-actions [role='status'] {

.vpn-settings.phone {

}

.vpn-settings.phone .phone-cell-label {

}

.vpn-settings.phone .phone-switch::before {

.composer .quiet.sending {
  position: relative;

  place-items: center;
  flex-shrink: 0;

  block-size: 32px;
  padding: 0;

  border: 0;
  border-radius: 50%;

}

.composer .quiet.sending::before {

  inline-size: 32px;
  block-size: 32px;
  border-radius: 50%;
  background: var(--fill);
}

.composer .quiet.sending:hover::before,
.composer .quiet.sending:active::before {

}

.composer .quiet.sending > .spinner-turn,
.composer .quiet.sending > svg {

}

.composer .quiet.sending .spinner-turn svg {

.composer .quiet.sending > span:not(.spinner-turn) {

  block-size: 1px;

html.phone .transcript .quiet.retry {

html.phone .composer .quiet.sending {

/* Hidden conversations: the folders scroll between the title and Close. */

}

.hidden-dialog .empty {

.phrase-rule {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px;
  align-items: center;
}


/* Animation */

@keyframes fade {
  from {
    opacity: 0;
  }
}

@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(-4px) scale(0.98);
  }
}

@keyframes lift {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.985);
  }
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.96);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* The icon turns, not the line it sits in, which is taller than the icon. */
.spinner-turn {
  display: inline-flex;
  flex-shrink: 0;
  animation: spin 900ms linear infinite;
}

@keyframes travel {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(300%);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    transition-duration: 1ms !important;
  }
}

/* ------------------------------------------------------------------ */
/* The panel window                                                    */
/* ------------------------------------------------------------------ */

.panel {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--bg);
}

.topbar {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 2px;
  height: var(--topbar);
  padding-right: 8px;
  padding-left: 82px;
  border-bottom: 1px solid var(--border);
}

html.framed .topbar {
  padding-left: 8px;
}

.tab {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  color: var(--text-dim);
  border-radius: 5px;
}

.tab:hover {
  background: var(--bg-hover);
}

.tab.on {
  color: var(--text);
  background: var(--bg-hover);
}

.panel-body {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
}

/* Correct */

.correct {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  padding: 12px;
}

.correct-field {
  position: relative;
  display: flex;
  flex: 1;
  min-height: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.correct-field:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.correct-field textarea {
  flex: 1;
  padding: 10px 12px;
  font-size: 14px;
  line-height: 1.55;
  background: none;
  border: none;
  border-radius: var(--radius);
}

.correct-field textarea:focus-visible {
  outline: none;
}

.correct-revert {
  position: absolute;
  right: 6px;
  bottom: 6px;
}

.actions {
  display: flex;
  flex-shrink: 0;
  flex-wrap: wrap;
  gap: 6px;
}

.action {
  padding: 5px 11px;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.action:hover:not(:disabled) {
  color: var(--text);
  background: var(--bg-hover);
}

.working {
  position: relative;
  flex-shrink: 0;
  height: 2px;
  overflow: hidden;
  background: var(--bg-hover);
  border-radius: 1px;
}

.working::after {
  position: absolute;
  inset: 0;
  width: 25%;
  content: '';
  background: var(--accent);
  border-radius: 1px;
  animation: travel 1.1s var(--ease) infinite;
}

.footer {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-faint);
}

.picker {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  max-width: 100%;
  padding: 3px 7px;
  overflow: hidden;
  color: var(--text-dim);
  white-space: nowrap;
  text-overflow: ellipsis;
  border-radius: 5px;
}

.picker:hover {
  color: var(--text);
  background: var(--bg-hover);
}

.notices {
  position: fixed;
  top: 44px;
  right: 16px;
  z-index: 48;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(320px, calc(100vw - 32px));
}

.notice {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 8px 10px 12px;
  cursor: pointer;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  animation: pop var(--settle) var(--ease) both;
}

.notice:hover {

.notice .state {
  flex-shrink: 0;
