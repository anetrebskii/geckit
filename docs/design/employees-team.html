  height: 8px;
  margin-top: 4px;
  border-radius: 50%;
  background: var(--accent);
}

.notice.asks .state {
  background: var(--warning-text);
}

.notice .lines {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.notice .title {
  font-size: 13px;
  font-weight: 600;
}

.notice .subtitle,
.notice .body {
  overflow: hidden;
  font-size: 13px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.notice .body {
  color: var(--text-dim);
}

/* A new version: bottom left over the sidebar in Chat, along the bottom of the panel. */
.update-notice {
  position: fixed;
  bottom: 32px;
  left: 8px;
  z-index: 47;
  width: calc(var(--sidebar, 264px) - 16px);
}

.panel .update-notice {
  right: 12px;
  bottom: 12px;
  left: 12px;
  width: auto;
}

.notice.update {
  cursor: default;
}

.notice.update .body {
  white-space: normal;
}

.version .progress,
.notice.update .progress,
.speech-model .progress {
  height: 4px;
  margin: 4px 0 2px;
  overflow: hidden;
  background: var(--bg-hover);
  border-radius: 2px;
}

.version .progress > span,
.notice.update .progress > span,
.speech-model .progress > span {
  display: block;
  height: 100%;
  background: var(--accent);
  transition: width var(--settle) var(--ease);
}

.notice.update .actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
  margin-top: 8px;
}

/* The questions about counting and errors: above the update notice on the computer, over the tab bar on the phone. */
.update-notice {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.consent-cards {
  position: fixed;
  right: 8px;
  bottom: calc(var(--bottom) + 64px);
  left: 8px;
  z-index: 47;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.notice.consent {
  cursor: default;
}

.notice.consent .body {
  white-space: normal;
}

.notice.consent .actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
  margin-top: 8px;
}

.notice.consent .actions button {
  padding: 3px 10px;
  font-size: 12px;
}

/* Declining weighs the same as agreeing: framed, and not dimmed. */
.notice.consent .quiet {
  color: var(--text);
}

.notice.consent .reveal {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-dim);
}

.notice.consent .reveal summary {
  cursor: pointer;
}

.notice.consent .reveal pre {
  max-height: 120px;
  margin: 6px 0 0;
  padding: 6px 8px;
  overflow: auto;
  font-family: var(--font-code);
  font-size: 11px;
  white-space: pre;
  background: var(--bg-hover);
  border-radius: var(--radius);
}

.version {
  display: flex;
  gap: 12px;
  align-items: center;
}

.version .lines {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 2px;
}

.version .why {
  font-size: 12px;
  color: var(--text-faint);
}

.field > label.check {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 13px;
  color: var(--text);
}

.check input {
  accent-color: var(--accent);
}

.toast {
  position: fixed;
  bottom: 16px;
  left: 50%;
  z-index: 70;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--tooltip-text);
  background: var(--tooltip-bg);
  border-radius: 6px;
  box-shadow: var(--shadow);
  transform: translateX(-50%);
  animation: rise var(--settle) var(--ease) both;
}

.tip {
  position: fixed;
  z-index: 100;
  max-width: 320px;
  padding: 4px 8px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--tooltip-text);
  overflow-wrap: anywhere;
  pointer-events: none;
  background: var(--tooltip-bg);
  border-radius: 6px;
  box-shadow: var(--shadow);
}

.tip kbd {
  margin-left: 8px;
  font: inherit;
  opacity: 0.65;
}

/* A key named on the control it presses, not only in its tooltip. */
.keys {
  flex-shrink: 0;
  font-size: 12px;
  color: var(--text-faint);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* Transcribe */

.speech-model {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 4px 12px 8px;
  font-size: 12px;
  color: var(--text-dim);
}

.speech-model button {
  align-self: flex-start;
}

.transcribe {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
}

.transcribe-head {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
}

.record {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  color: var(--accent-text);
  background: var(--accent);
  border-radius: 999px;
}

.record.on {
  color: var(--danger-text);
  background: var(--danger-solid);
}

.dot {
  width: 7px;
  height: 7px;
  background: currentcolor;
  border-radius: 50%;
}

.bars {
  display: flex;
  gap: 3px;
  align-items: center;
  height: 18px;
}

.bars span {
  width: 3px;
  background: currentcolor;
  border-radius: 2px;
  transition: height 80ms linear;
}

.drop {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

.drop.over {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 2px var(--accent);
}

.said {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
}

.said:hover {
  background: var(--bg-hover);
}

.said-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-faint);
}

.said-text {
  margin-top: 3px;
  white-space: pre-wrap;
  user-select: text;
}

/* Settings */

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 12px;
}

.field > label {
  font-size: 12px;
  color: var(--text-dim);
}

/*
 * A list of ticks in Settings: the profile in use, and the projects in it.
 *
 * The list holds the columns and a row takes them with `subgrid`, so the names
 * and the paths stand in columns however long a name is while each row is still
 * a box of its own to highlight.
 */
.projects-listed {
  display: grid;
  grid-template-columns: auto minmax(0, max-content) minmax(0, 1fr);
  max-height: 264px;
  margin-top: 2px;
  padding: 3px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

/* A conversation's title is long, so it gives way and the project and time stay whole. */
/* Where the projects under it are, Local or a host, once any project is on a host. */
.projects-listed-head {
  grid-column: 1 / -1;
  padding: 7px 8px 3px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-faint);
}

.projects-listed-head:first-child {
  padding-top: 3px;
}

.projects-listed.cut-off {
  grid-template-columns: auto minmax(0, 1fr) max-content;
}

.project-listed {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
  align-items: center;
  padding: 4px 0;
  text-align: left;
  border-radius: 4px;
}

.project-listed > * {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.project-listed:hover {
  background: var(--bg-hover);
}

/* The tick, in the accent, and nothing at all where a project is not listed: an empty box would be one more thing to read. */
.project-listed .tick {
  display: grid;
  place-items: center;
  width: 28px;
  color: var(--accent);
}

.project-listed .name {
  font-size: 13px;
  color: var(--text);
}

.project-listed.off .name {
  color: var(--text-faint);
}

.project-listed .says {
  padding-right: 10px;
  padding-left: 10px;
  font-size: 12px;
  color: var(--text-faint);
}

.phone-link {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-dim);
}

.phone-link img {
  flex: none;
  border-radius: var(--radius);
}

.phone-link span {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}

.phone-error {
  font-size: 12px;
  color: var(--danger);
}

/* A choice in a form, drawn like the fields around it, with its arrow at the end. */
.select {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  min-width: 0;
  padding: 5px 8px;
  text-align: left;
  white-space: nowrap;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
}

.select:hover:not(:disabled) {
  background: var(--bg-hover);
}

.select svg {
  flex-shrink: 0;
  color: var(--text-faint);
}

.select > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* ------------------------------------------------------------------ */
/* The chat window                                                     */
/* ------------------------------------------------------------------ */

.chat {
  --sidebar: clamp(220px, var(--side, 264px), calc(100vw - 420px));

  position: relative;
  display: grid;
  grid-template-columns: var(--sidebar) 1fr;
  /* The row is held to the window, so a long conversation scrolls inside the
     transcript instead of pushing the composer off the bottom. */
  grid-template-rows: minmax(0, 1fr) auto;
  height: 100%;
}

/* The bar across the top, the same in both views: `--bar` tall, which the grips below it start under. */
.chat.topped {
  --bar: 45px;

  grid-template-rows: auto minmax(0, 1fr) auto;
}

.chat.topped > .board-head {
  grid-column: 1 / -1;
}

.chat.topped .side-grip {
  top: var(--bar);
}

/* The sidebar's edge, dragged to make it wider or narrower. */
.side-grip[hidden] {
  display: none;
}

.side-grip {
  position: absolute;
  top: 0;
  bottom: 24px;
  left: calc(var(--sidebar) - 3px);
  z-index: 3;
  width: 6px;
  cursor: col-resize;
  -webkit-app-region: no-drag;
}

.side-grip::after {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 2px;
  width: 2px;
  content: '';
  transition: background-color var(--quick) var(--ease);
}

.side-grip:hover::after {
  background: var(--accent);
  transition-delay: 200ms;
}

.chat.sizing .side-grip::after {
  background: var(--accent);
}

.chat.sizing,
.chat.sizing * {
  cursor: col-resize;
  user-select: none;
}

.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--bg-sunken);
  border-right: 1px solid var(--border);
}

/* Collapse all and Group by: the list's own, under the bar both views share. */
.sidebar-tools {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 4px;
  height: var(--topbar);
  padding: 0 8px;
  border-bottom: 1px solid var(--border);
}

.project {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 6px 10px;
  margin: 6px 8px 4px;
  width: calc(100% - 16px);
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
}

.project:hover {
  background: var(--bg-hover);
}

.project .name {
  overflow: hidden;
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.new-session {
  display: flex;
  align-items: center;
  gap: 7px;
  width: calc(100% - 16px);
  padding: 6px 10px;
  margin: 0 8px 6px;
  color: var(--text-dim);
  border-radius: var(--radius);
}

.new-session:hover {
  color: var(--text);
  background: var(--bg-hover);
}

.sessions {
  flex: 1;
  min-height: 0;
  padding: 0 8px 10px;
  overflow-y: auto;
}

.group {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  padding: 10px 6px 4px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.group:hover {
  color: var(--text-dim);
}

.group .count {
  letter-spacing: 0;
}

.group-head {
  display: flex;
  align-items: center;
}

.group-head .group {
  flex: 1;
  min-width: 0;
}

/* Where a row dragged into the favorites would land: a line between rows, drawn over them so nothing moves. */
.row.lands-before::before,
.row.lands-after::after,
.group-head.lands-after::after {
  position: absolute;
  inset-inline: 8px;
  height: 2px;
  content: '';
  background: var(--accent);
  border-radius: 1px;
  pointer-events: none;
}

/* Inside the row, since a row out of view is not painted and so cuts off what hangs over its edge. */
.row.lands-before::before {
  top: 0;
}

.row.lands-after::after {
  bottom: 0;
}

.group-head.lands-after::after {
  bottom: -1px;
}

.group-head {
  position: relative;
}

/* Only there while rows are picked, so the list is quiet the rest of the time. */
.group-pick {
  flex-shrink: 0;
  padding: 10px 6px 4px;
  font-size: 12px;
  color: var(--text-dim);
}

.group-pick:hover {
  color: var(--text);
}

.row {
  position: relative;
  display: flex;
  gap: 8px;
  width: 100%;
  padding: 7px 8px;
  text-align: left;
  border-radius: var(--radius);
  /* A row out of view is not laid out or painted, and keeps the height it last had. */
  content-visibility: auto;
  contain-intrinsic-size: auto 52px;
}

.row:hover {
  background: var(--bg-hover);
}

/* The row that is open: a fill of its own, quiet enough to read past, as a Mac list marks a selection. */
.row.on,
.row.on:hover {
  background: color-mix(in srgb, var(--accent) 24%, var(--bg-raised));
}

.row.on .title {
  color: var(--text);
}

.row .state {
  flex-shrink: 0;
  width: 6px;
  height: 6px;
  margin-top: 6px;
  border-radius: 50%;
  background: transparent;
}

/* The mark on an answer not read yet is a button, with more to press than the dot it holds. */
.row .read {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 14px;
  height: 14px;
  margin: 2px -4px 0;
  border-radius: 50%;
}

.row .read:hover {
  background: var(--bg-hover);
}

.row .read .state {
  margin-top: 0;
}

/* Wider than the dot it stands in for, and the text stays where it was. */
.row .pick {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 14px;
  height: 14px;
  margin: 2px -4px 0;
  color: var(--accent-text);
  border: 1px solid var(--text-faint);
  border-radius: 50%;
}

.row.picked {
  background: var(--bg-active);
}

.row.picked .pick {
  background: var(--accent);
  border-color: var(--accent);
}

.sessions.picking .row .more {
  display: none;
}

.sessions.picking .row:hover .changed {
  visibility: visible;
}

.picked-bar {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  font-size: 13px;
  border-top: 1px solid var(--border);
}

.picked-bar button {
  padding: 4px 10px;
}

.row .state.working {
  background: var(--accent);
  animation: fade 900ms var(--ease) infinite alternate;
}

.row .state.asks {
  background: var(--warning-text);
}

.row .state.background {
  box-shadow: inset 0 0 0 1.5px var(--accent);
  animation: fade 900ms var(--ease) infinite alternate;
}

.row .state.unread {
  background: var(--unread);
}

.row .state.failed,
.row .state.limit {
  background: var(--danger);
}

/* A bar rather than a fill for an answer not read yet: a green fill is what the chosen row looks like. */
.row.waits.asks {
  box-shadow: inset 3px 0 0 var(--warning-text);
}

.row.waits.asks:not(.on) {
  background: var(--warning-bg);
}

/* An answer not read yet is the dot alone, as a mail list marks one: a filled row is the open one. */

.row .foot {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 1px;
}

.row .foot .stands {
  flex: 1;
  min-width: 0;
  margin-top: 0;
}

/* The key that opens it, as a key; holding Cmd lights them all up. */
.row .place {
  flex-shrink: 0;
  padding: 0 3px;
  font-family: inherit;
  font-size: 10px;
  line-height: 13px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--border);
  border-radius: 4px;
}

.row.on .place {
  border-color: var(--border-strong);
}

.chat.holding .row .place {
  color: var(--accent);
  border-color: var(--accent);
}

.row.waits .title {
  font-weight: 600;
}

.row .lines {
  min-width: 0;
  flex: 1;
}

.row .title,
.row .stands {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.row .head {
  display: flex;
  gap: 8px;
  align-items: baseline;
}

.row .head .title {
  flex: 1;
  min-width: 0;
}

.row .changed {
  flex-shrink: 0;
  font-size: 12px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.row .stands {
  margin-top: 1px;
  font-size: 12px;
  color: var(--text-faint);
}

.row .stands .where {
  color: var(--text-dim);
}

/* A project's name in the colour that project was given. */
.tinted {
  color: var(--tint);
}

.row .stands .where.tinted {
  color: var(--tint);
}

/* The tracker item and the mark, ahead of where it stands. */
.tag {
  display: inline-flex;
  flex-shrink: 0;
  gap: 3px;
  align-items: center;
  padding: 0 5px;
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  line-height: 15px;
  color: var(--text-dim);
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 4px;
}

button.tag:hover {
  color: var(--text);
  border-color: var(--border-strong);
}

.tag.blocked {
  color: var(--danger);
  border-color: currentColor;
}

.tag.done,
.tag.archived {
  color: var(--text-faint);
}

.row .foot .tag + .tag {
  margin-left: -4px;
}

.picker.marked.blocked {
  color: var(--danger);
}

.row .stands .where:not(:empty):not(:last-child)::after {
  content: ' \00b7\00a0';
  color: var(--text-faint);
}

.row .more {
  position: absolute;
  top: 5px;
  right: 4px;
  opacity: 0;
}

/* Cmd+P: every conversation, in every project */

.switcher {
  top: 12vh;
  left: 50%;
  display: flex;
  flex-direction: column;
  width: min(560px, calc(100vw - 80px));
  max-height: 60vh;
  overflow: hidden;
  transform: translateX(-50%);
}

.switcher-field {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  color: var(--text-faint);
  border-bottom: 1px solid var(--border);
}

.switcher-field input {
  flex: 1;
  padding: 0;
  font-size: 14px;
  background: none;
  border: none;
}

.switcher-field input:focus-visible {
  outline: none;
}

/* Ctrl+Tab has no field: nothing is typed, only Tab pressed while Ctrl is held. */
.switcher.recent {
  width: min(460px, calc(100vw - 80px));
}

.switcher-rows {
  min-height: 0;
  padding: 6px;
  overflow-y: auto;
}

.switcher .row {
  cursor: default;
}

.switcher-head {
  padding: 8px 10px 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-faint);
}

/* Bold rather than a colour, which the chosen row's own colour would swallow. */
.switcher mark {
  font-weight: 600;
  color: var(--text);
  background: none;
}

.switcher .where mark {
  color: inherit;
}

.switcher .more-found {
  color: var(--text-faint);
}

/* A message a search went to, marked for a moment so the eye finds it. */

.turn.found .mine,
.turn.found .theirs {
  animation: found 2.4s var(--ease) both;
}

@keyframes found {
  0%,
  40% {
    background: var(--accent-soft);
    box-shadow: 0 0 0 6px var(--accent-soft);
  }

  100% {
    background: transparent;
    box-shadow: 0 0 0 6px transparent;
  }
}

.row:hover .more,
.row .more:focus-visible {
  opacity: 1;
}

.row:hover .changed {
  visibility: hidden;
}

/* The conversation */

.talk {
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100%;
}

.talk[hidden] {
  display: none;
}

.talk-head {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 8px;
  height: var(--topbar);
  padding: 0 10px;
  border-bottom: 1px solid var(--border);
}

/* Everything in the head stays on its one line; the title gives way first, then the project, never a second line. */
.talk-head > * {
  white-space: nowrap;
}

.talk-head > .tinted {
  flex-shrink: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.talk-head .title {
  overflow: hidden;
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* The name is pressed to rename it, so it shows it can be where the pointer is. */
.talk-head button.title {
  min-width: 0;
  padding: 3px 6px;
  margin-left: -6px;
  border-radius: 5px;
}

.talk-head button.title:hover {
  background: var(--bg-hover);
}

.talk-head .head-project {
  flex-shrink: 1;
  min-width: 0;
  margin-left: -4px;
  font-size: 12px;
}

.talk-head .remote-on {
  color: var(--text);
}

.remote-dot {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
}

.talk-head .title-field {
  width: min(420px, 60%);
  padding: 2px 6px;
  margin-left: -7px;
  font-weight: 500;
  border-color: var(--accent);
}

.row .row-name {
  width: 100%;
  padding: 1px 5px;
  margin-left: -6px;
}

.transcript {
  flex: 1;
  min-height: 0;
  padding: 16px 0 8px;
  overflow-y: auto;
}

/* Finding in the conversation: a strip over it, and the words marked where they are, as a browser's own find marks them. */
.find-bar {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 6px;
  padding: 6px 10px 6px 24px;
  color: var(--text-faint);
  border-bottom: 1px solid var(--border);
}

.find-bar input[type='text'] {
  flex: 1;
  min-width: 0;
  padding: 0;
  font-size: 13px;
  color: var(--text);
  background: none;
  border: none;
  border-radius: 0;
}

.find-bar input[type='text']:focus-visible {
  outline: none;
}

.find-count {
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

::highlight(find) {
  background-color: rgb(255 200 0 / 35%);
}

::highlight(find-now) {
  color: #1a1a1a;
  background-color: rgb(255 176 0);
}

html.phone .find-bar {
  gap: 4px;
  padding: 4px 4px 4px 16px;
  background: var(--glass);
  border-bottom: 0;
  box-shadow: 0 0.5px 0 var(--separator);
}

html.phone .find-bar input[type='text'] {
  font-size: 16px;
}

html.phone .find-bar .icon-button {
  width: 40px;
  height: 40px;
}

.turn {
  padding: 0 24px;
  margin: 0 0 14px;
}

.turn.step {
  margin-bottom: 1px;
}

.turn.step + .turn:not(.step) {
  margin-top: 12px;
}

.mine {
  padding: 9px 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: text;
  background: var(--bubble);
  border-radius: var(--radius-lg);
}

.mine.unsent {
  border: 1px dashed var(--border-strong);
}

.theirs {
  user-select: text;
}

.reply-phase {
  margin-bottom: 6px;
  color: var(--text-dim);
  font-size: 12px;
}

.skeleton-line,
.skeleton-bubble,
.skeleton-dot {
  background: var(--bg-hover);
  animation: breathe 1.6s ease-in-out infinite;
}

.skeleton-line {
  height: 12px;
  margin: 6px 0 10px;
  border-radius: 6px;
}

.skeleton-line.short {
  width: 55%;
}

.skeleton-bubble {
  width: 60%;
  height: 38px;
  margin-left: auto;
  border-radius: var(--radius-lg);
}

.when {
  margin-top: 4px;
  font-size: 12px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.mine + .when {
  text-align: right;
}

.when .copy-answer {
  width: 18px;
  height: 18px;
  margin: -3px 0 -3px 4px;
  vertical-align: middle;
  opacity: 0;
  transition: opacity var(--quick) var(--ease);
}

.turn:hover .copy-answer,
.when .copy-answer:focus-visible {
  opacity: 1;
}

.did {
  display: flex;
  gap: 8px;
  align-items: baseline;
  width: 100%;
  padding: 3px 6px;
  color: var(--text-dim);
  text-align: left;
  border-radius: 5px;
}

.did:hover:not(:disabled) {
  background: var(--bg-hover);
}

.did:disabled {
  opacity: 1;
}

.did .what {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* A command that can go on in the background, with the button that sends it there beside it. */
.did-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.did-row .did {
  flex: 1;
  min-width: 0;
}

.did-row .quiet {
  flex-shrink: 0;
  padding: 1px 8px;
  font-size: 12px;
}

.did .glyph,
.card.answered .glyph {
  flex-shrink: 0;
  color: var(--text-faint);
}

.detail {
  max-height: 340px;
  padding: 8px 10px;
  margin: 4px 0 2px;
  overflow: auto;
  font-family: var(--font-code);
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  user-select: text;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.thought {
  padding: 3px 6px 3px 26px;
  font-style: italic;
  color: var(--text-faint);
}

.wrote {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  padding: 4px 6px;
  color: var(--text-dim);
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  font-size: 12px;
  color: var(--text-dim);
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 999px;
}

.chip:hover {
  color: var(--text);
  background: var(--bg-hover);
}

.note {
  padding: 8px 10px;
  color: var(--text-dim);
  background: var(--bg-sunken);
  border-radius: var(--radius);
}

.note-summary {
  margin-top: 8px;
  color: var(--text);
}

.note.failed,
.note.limit {
  color: var(--warning-text);
  background: var(--warning-bg);
}

/* What a message starting with ! will do, said while it is typed. */

.composer-hint {
  min-width: 0;
  overflow: hidden;
  font-size: 12px;
  color: var(--text-faint);
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* A draft starting with ! is a command, so the field looks like a terminal while it is typed. */

.composer-inner.command,
.composer-inner.command:focus-within {
  border-color: var(--warning-text);
  box-shadow: 0 0 0 3px var(--warning-bg);
}

.composer-inner.command textarea {
  font-family: var(--font-code);
  font-size: 13px;
}

.composer-hint.command {
  color: var(--warning-text);
}

/* A command typed after ! is the person's, so it sits in their bubble, with what it printed under it. */

.shell {
  padding: 9px 12px;
  background: var(--bubble);
  border-radius: var(--radius-lg);
}

.shell-head {
  display: flex;
  gap: 8px;
  align-items: center;
  min-height: 22px;
}

.shell-command {
  flex: 1;
  min-width: 0;
  font-family: var(--font-code);
  font-size: 12px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  user-select: text;
}

.shell-head .glyph {
  flex-shrink: 0;
  color: var(--text-faint);
}

.shell-head .quiet {
  padding: 1px 8px;
  font-size: 12px;
}

.shell-ended {
  flex-shrink: 0;
  font-size: 12px;
  color: var(--text-faint);
}

.shell-ended.failed {
  color: var(--warning-text);
}

.shell .detail-block {
  margin: 8px 0 0;
}

.shell-typed {
  width: 100%;
  margin-top: 8px;
  font-family: var(--font-code);
  font-size: 12px;
}

/* Cards */

.card {
  padding: 12px 14px;
  background: var(--bg-raised);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  animation: rise var(--settle) var(--ease) both;
}

.card.answered {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 3px 6px;
  color: var(--text-dim);
  background: none;
  border: none;
  box-shadow: none;
  animation: none;
}

.card .card-title {
  font-weight: 500;
}

.card .where {
  margin-top: 2px;
  font-size: 12px;
  color: var(--text-faint);
}

.card .card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.question-options {
  display: grid;
  gap: 4px;
  margin-top: 12px;
}

.question-option {
  display: flex;
  align-items: center;
  gap: 10px;
  min-inline-size: 0;
  padding: 8px 10px;
  text-align: start;
  overflow-wrap: anywhere;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.question-option:hover {
  background: var(--bg-hover);
}

.question-option[aria-checked='true'] {
  background: var(--accent-soft);
  border-color: var(--accent);
}

.question-check {
  display: grid;
  place-items: center;
  flex: 0 0 18px;
  inline-size: 18px;
  block-size: 18px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
}

[aria-checked='true'] > .question-check {
  color: var(--accent-text);
  background: var(--accent);
  border-color: var(--accent);
}

.question-hint {
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-dim);
}

.question-custom {
  display: flex;
  align-items: end;
  gap: 8px;
  margin-top: 12px;
}

.question-custom label {
  display: grid;
  flex: 1;
  gap: 4px;
  min-inline-size: 0;
  font-size: 12px;
  color: var(--text-dim);
}

.question-custom input {
  inline-size: 100%;
  min-inline-size: 0;
  color: var(--text);
}

.question-footer {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.question-footer .primary {
  margin-inline-start: auto;
}

.question-option:focus-visible,
.question-custom button:focus-visible,
.question-footer button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.elicitation .card-title { white-space: pre-wrap; overflow-wrap: anywhere; }
.elicitation-form { margin-top: 12px; }
.elicitation-field { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; padding: 0; min-inline-size: 0; border: none; }
.elicitation-field legend { padding: 0; margin-bottom: 4px; }
.elicitation-description { color: var(--text-dim); font-size: 12px; overflow-wrap: anywhere; }
.elicitation-field :is(input, select) { max-inline-size: 100%; min-inline-size: 0; }
.elicitation-field [aria-invalid="true"] { border-color: var(--danger); }
.elicitation-option { display: flex; align-items: center; gap: 8px; }
.elicitation-option input { flex-shrink: 0; }
html.phone .elicitation-field > :is(input, select) { min-block-size: 44px; }
html.phone .elicitation-option { min-block-size: 44px; }
html.phone .elicitation-link > button { min-block-size: 44px; }
.elicitation-error { color: var(--text-dim); margin: 8px 0; }
.elicitation-link { display: grid; justify-items: start; gap: 8px; }
.elicitation-destination { overflow-wrap: anywhere; user-select: text; font-family: var(--font-code); font-size: 12px; }

/*
 * A request from `geckit start`: the conversations Claude wants started, each
 * drawn as what it will be - a title, its project, and the first message as
 * the bubble it becomes - so it is decided on at a glance. The same raised
 * card a permission card is; it is told apart by where it stands, last in
 * the conversation, and by one accent glyph, not by a tint.
 */

.card.request {
  padding: 0;
  overflow: hidden;
}

.request-head {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px 14px 11px;
}

.request-glyph {
  display: grid;
  flex: none;
  place-items: center;
  width: 22px;
  height: 22px;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 50%;
}

.request-glyph.done {
  color: var(--success-text);
}

.request-glyph.gone {
  color: var(--text-faint);
  background: var(--fill);
}

.request-heading {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
  padding-top: 1px;
}

.request-heading .card-title {
  font-weight: 600;
  line-height: 1.35;
}

.request-sub {
  font-size: 12px;
  color: var(--text-dim);
}

.request-rows {
  border-top: 1px solid var(--border);
}

.request-row + .request-row {
  border-top: 1px solid var(--border);
}

.request-line {
  display: flex;
  gap: 10px;
  align-items: center;
  min-height: 38px;
  padding: 0 10px 0 14px;
}

.request-line input[type='checkbox'] {
  flex: none;
  width: 14px;
  height: 14px;
  margin: 0;
  accent-color: var(--accent);
}

/* The whole line opens a task in a batch; one task is already open and is not pressed. */
.request-open {
  display: flex;
  flex: 1;
  gap: 10px;
  align-items: baseline;
  min-width: 0;
  padding: 9px 4px 9px 0;
  text-align: start;
}

button.request-open {
  border-radius: var(--radius);
}

.request-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.request-project {
  flex: none;
  font-size: 12px;
}

.request-open .chevron {
  flex: none;
  align-self: center;
  color: var(--text-faint);
  transition: transform var(--quick) var(--ease);
}

.request-row.open .chevron {
  transform: rotate(90deg);
}

button.request-open:hover .request-title {
  color: var(--text);
}

.request-row.off .request-title,
.request-row.off .request-project {
  color: var(--text-faint);
  text-decoration: line-through;
  text-decoration-color: var(--border-strong);
}

/* What it says, under its title and lined up with it. */
.request-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 14px 14px 38px;
  animation: rise var(--settle) var(--ease) both;
}

.request-row.alone .request-body {
  padding-left: 14px;
}

.request-message {
  max-height: 180px;
  padding: 8px 11px;
  overflow-y: auto;
  white-space: pre-wrap;
  user-select: text;
  background: var(--bg-sunken);
  border-radius: var(--radius-lg);
}

.request-goal {
  display: flex;
  gap: 6px;
  align-items: baseline;
  font-size: 12px;
  color: var(--accent);
}

.request-goal svg {
  flex: none;
  transform: translateY(1px);
}

.request-goal.none {
  color: var(--text-faint);
}

.request-note-add,
.request-reply-add {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  align-self: flex-start;
  padding: 2px 0;
  font-size: 12px;
  color: var(--text-dim);
}

.request-note-add:hover,
.request-reply-add:hover {
  color: var(--text);
}

.request-foot .request-reply-add {
  align-self: center;
}

/* The note is the task's: it sits in the task, behind the pencil that offered it. */
.request-note {
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--text-dim);
}

.request-note input {
  flex: 1;
  min-width: 0;
}

/* The reply is to Claude, about the whole answer, so it is in the row that answers. */
.request-foot .request-reply {
  flex: 1;
  min-width: 0;
}

.request-foot {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 14px;
  border-top: 1px solid var(--border);
}

.request-foot .spacer {
  flex: 1;
}

/* Answered, each row says what became of it, and a started one opens. */
.request-said {
  flex: none;
  font-size: 12px;
}

.request-said.refused {
  color: var(--text-faint);
}

.request-replied {
  padding: 10px 14px 12px;
  font-size: 12px;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
}

.state-said.said-done {
  color: var(--done-solid);
}

.state-said.said-done .state-dot {
  background: var(--done-solid);
}

html.phone .request-line {
  min-height: 48px;
}

html.phone .request-line input[type='checkbox'] {
  width: 20px;
  height: 20px;
}

html.phone .request-body {
  padding-left: 44px;
  font-size: 16px;
}

html.phone .request-row.alone .request-body {
  padding-left: 14px;
}

html.phone .request-sub,
html.phone .request-goal,
html.phone .request-note-add,
html.phone .request-reply-add,
html.phone .request-project,
html.phone .request-said {
  font-size: 14px;
}

html.phone .request-foot {
  flex-wrap: wrap;
  gap: 10px;
}

html.phone .request-foot .request-reply-add,
html.phone .request-foot .request-reply {
  flex-basis: 100%;
}

html.phone .request-foot .spacer {
  display: none;
}

html.phone .request-foot button.quiet,
html.phone .request-foot button.primary {
  flex: 1;
  min-height: 44px;
  white-space: nowrap;
}

html.phone .request-body input,
html.phone .request-foot .request-reply {
  min-height: 44px;
  padding: 0 12px;
  font-size: 16px;
  border-radius: 12px;
}

/* The parent's children, counted on its board card, and the parent named on a child's card and head. */
.board-card-kids,
.board-card-from {
  margin-top: 4px;
  font-size: 12px;
  color: var(--text-faint);
}

.board-card-from {
  display: flex;
  gap: 4px;
  align-items: baseline;
  min-width: 0;
  white-space: nowrap;
}

.board-card-from button {
  overflow: hidden;
  min-width: 0;
  padding: 0;
  font: inherit;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--accent);
  background: none;
  border: 0;
  cursor: pointer;
}

/* A notice that can be answered where it stands: the one button approvals need, under the words as an update's are. */
.notice .notice-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 8px;
}

.notice .notice-actions button {
  padding: 3px 10px;
  font-size: 12px;
}


/* The count on a parent's card opens the list of what it started, over the board. */
.board-card-kids button {
  padding: 0;
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}

.board-card-kids button:hover {
  color: var(--text-dim);
  text-decoration: underline;
}

/* What "Started 3" opens: a row a conversation, its title over its project and how it stands, what it started indented under it. */
.menu-item.started-row {
  align-items: flex-start;
  gap: 9px;
  width: 340px;
  padding: 7px 10px 7px calc(10px + var(--depth) * 16px);
  white-space: normal;
}

.started-row > .state-said {
  flex: none;
  margin-top: 6px;
}

.started-words {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.started-title {
  display: -webkit-box;
  overflow: hidden;
  font-size: 13px;
  line-height: 1.35;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.started-meta {
  font-size: 12px;
  color: var(--text-faint);
}

/* In a started conversation, the way back to the one that started it, where "Started 3" stands in that one. */
.head-back {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  max-width: 220px;
}

.head-back span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* The composer */

.composer {
  flex-shrink: 0;
  padding: 10px 24px 14px;
}

/* Messages sent while Claude works, waiting their turn above the field. */
.phrases {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
}

.phrase {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  max-width: 100%;
  padding: 3px 10px;
  overflow: hidden;
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
  text-overflow: ellipsis;
  border: 1px solid var(--border);
  border-radius: 999px;
}

.phrase:hover {
  color: var(--text);
  background: var(--bg-hover);
}

.phrase.keep {
  padding: 3px 6px;
  border-style: dashed;
}

.queued {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 6px;
}

.queued-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 104px;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.queued-head {
  padding: 0 4px;
  font-size: 11px;
  color: var(--text-faint);
}

.queued-one {
  position: relative;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 5px 6px 5px 11px;
  font-size: 13px;
  color: var(--text-dim);
  background: var(--bg-sunken);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}

.queued-one.lifting {
  opacity: 0.55;
}

.queued-one.land-before::before,
.queued-one.land-after::after {
  position: absolute;
  right: 4px;
  left: 4px;
  height: 2px;
  background: var(--accent);
  border-radius: 2px;
  content: '';
}

.queued-one.land-before::before { top: 0; }
.queued-one.land-after::after { bottom: 0; }

.queued-grip {
  flex: none;
  width: 20px;
  height: 24px;
  padding: 0;
  color: var(--text-faint);
  background: none;
  border: 0;
  border-radius: 5px;
  cursor: grab;
  touch-action: none;
}

.queued-grip:active { cursor: grabbing; }
.queued-grip:hover { color: var(--text); }
.queued-grip:focus-visible { outline: 2px solid var(--accent); }

.queued-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  padding: 0;
  font: inherit;
  color: inherit;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: none;
  border: 0;
  cursor: text;
}

.queue-inject {
  flex: none;
  color: var(--accent);
}

.queued-one .icon-button.queue-inject {
  width: 24px;
  height: 24px;
}

html.phone .queued-one .icon-button.queue-inject {
  width: 44px;
  height: 44px;
}

.queued-edit {
  flex: 1;
  min-width: 0;
  max-height: 160px;
  padding: 0;
  font: inherit;
  color: var(--text);
  resize: none;
  background: none;
  border: 0;
  outline: none;
}

/* The message the dialog is asking about, as it was typed. */
/* The queued message a new conversation is started with, as it will be sent. */
.branch-quote {
  display: -webkit-box;
  margin: 0;
  padding: 10px 14px;
  overflow: hidden;
  color: var(--text-dim);
  white-space: pre-wrap;
  background: var(--bg-raised);
  border-radius: 10px;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
}

.sheet-keep {
  margin-top: 10px;
}

.dialog .branch-quote {
  margin: 12px 0 16px;
  padding: 8px 12px;
  color: var(--text);
  background: var(--bg-sunken);
  border-left: 2px solid var(--accent);
  border-radius: 2px 8px 8px 2px;
}

.branch-choices {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.branch-choice {
  display: flex;
  gap: 12px;
  align-items: center;
  width: 100%;
  padding: 10px 12px;
  text-align: left;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.branch-choice > svg {
  flex: none;
  color: var(--accent);
}

.branch-choice:hover {
  background: var(--bg-hover);
}

.branch-choice .says {
  font-size: 12px;
  color: var(--text-faint);
}

.dialog .branch-choices + .dialog-actions {
  margin-top: 14px;
}

.sheet .branch-quote {
  margin-bottom: 10px;
  padding: 11px 16px;
  font-size: 15px;
  border-radius: 12px;
}

.queued-picture {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  padding: 0;
  overflow: hidden;
  background: var(--bg-raised);
  border: 0;
  border-radius: 5px;
  cursor: zoom-in;
}

.queued-picture img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.queued-bare {
  font-style: italic;
  color: var(--text-faint);
}

.queued-more {
  flex-shrink: 0;
  font-size: 12px;
  color: var(--text-faint);
}

.queued-one .icon-button {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
}

.composer-inner {
  position: relative;
  background: var(--field);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
}

.chat.dropping .composer-inner,
.composer-inner:focus-within {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border-strong));
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.pending {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 11px 11px 1px;
}

.pending-one {
  position: relative;
  display: block;
  line-height: 0;
}

.pending-one img {
  cursor: zoom-in;
  width: 56px;
  height: 56px;
  object-fit: cover;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.pending-one .icon-button {
  position: absolute;
  top: -5px;
  right: -5px;
  width: 16px;
  height: 16px;
  color: var(--tooltip-text);
  background: var(--tooltip-bg);
  border-radius: 50%;
}

.pictures {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.pictures img {
  max-width: 220px;
  max-height: 220px;
  cursor: zoom-in;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color var(--quick) var(--ease);
}

.pictures img:hover {
  border-color: var(--border-strong);
}

/* A picture on the phone before it has come over. */
.picture-waiting {
  width: 160px;
  height: 120px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

/* A picture a tool handed back, under the line saying what was done. */
.did-pictures {
  margin: 4px 0 8px 20px;
}

/* The pictures of a shut run of steps, in one row that scrolls sideways. */
.fold-pictures {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}

.fold-pictures img,
.fold-pictures .picture-waiting {
  flex: none;
  max-width: 160px;
  max-height: 160px;
}

/* One picture, filling the window */

.preview {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
  background: rgb(0 0 0 / calc(72% * (1 - var(--leaving, 0))));
  animation: fade var(--quick) var(--ease) both;
}

.preview img {
  max-width: 92%;
  max-height: 86%;
  user-select: none;
  -webkit-touch-callout: none;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transform-origin: center;
}

.preview.easing img {
  transition: transform 0.25s var(--ease);
}

.preview-bar {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 1;
  display: flex;
  gap: 2px;
  align-items: center;
  padding: 3px 4px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 999px;
  box-shadow: var(--shadow);
}

.preview-bar .quiet {
  min-width: 52px;
  font-variant-numeric: tabular-nums;
}

.composer textarea {
  display: block;
  width: 100%;
  max-height: 260px;
  padding: 10px 12px 4px;
  font-size: 14px;
  line-height: 1.5;
  background: none;
  border: none;
}

.composer textarea:focus-visible {
  outline: none;
}

.goal-editor .goal-edit-field,
.goal-edit-phone .goal-edit-field {
  width: 100%;
  min-height: 90px;
  padding: 10px 12px;
  color: var(--text);
  background: var(--field);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  resize: vertical;
}

.goal-editor .goal-edit-field:focus,
.goal-edit-phone .goal-edit-field:focus {
  border-color: var(--accent);
  outline: none;
}

.goal-editor .danger,
.goal-edit-phone .danger {
  color: var(--danger);
}

.goal-edit-phone {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0 16px 16px;
}

/* @: a file or a folder of the project */

.mentions {
  position: absolute;
  right: 0;
  bottom: calc(100% + 6px);
  left: 0;
  z-index: 40;
  max-height: 280px;
  padding: 4px;
  overflow-y: auto;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
  animation: pop var(--settle) var(--ease) both;
}

.mention {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 5px 8px;
  white-space: nowrap;
  cursor: default;
  border-radius: 5px;
}

.mention.on {
  background: var(--bg-active);
}

.mention svg {
  flex-shrink: 0;
  color: var(--text-faint);
}

.mention .name {
  flex-shrink: 0;
}

.mention .in {
  overflow: hidden;
  font-size: 12px;
  color: var(--text-faint);
  text-overflow: ellipsis;
}

.composer-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 6px 6px 8px;
}

.composer-bar .goal-picker {
  flex-shrink: 1;
  min-width: 0;
  max-width: 260px;
  color: var(--text);
}

.goal-picker .remote-dot {
  flex-shrink: 0;
}

.goal-picker .goal-text {
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Under the conversation, what belongs to it: its checkout, context and cost. */

.talk-status {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 14px;
  min-width: 0;
  padding: 0 24px 10px;
  margin-top: -6px;
  overflow: hidden;
  font-size: 12px;
  color: var(--text-faint);
  white-space: nowrap;
}

.talk-status:empty {
  display: none;
}

/* The bar along the bottom: the account's plan and windows. */

.status-bar {
  display: flex;
  grid-column: 1 / -1;
  align-items: center;
  gap: 14px;
  height: 24px;
  min-width: 0;
  padding: 0 12px;
  overflow: hidden;
  font-size: 12px;
  color: var(--text-faint);
  white-space: nowrap;
  background: var(--bg-sunken);
  border-top: 1px solid var(--border);
}

.status-bar .stat,
.talk-status .stat {
  display: inline-flex;
  flex-shrink: 0;
  align-items: center;
  gap: 5px;
  font-variant-numeric: tabular-nums;
}

.status-bar .stat:has(.branch),
.talk-status .stat:has(.branch) {
  flex-shrink: 1;
  min-width: 0;
}

.talk-status .act {
  flex-shrink: 0;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  color: var(--text-dim);
  cursor: pointer;
}

.talk-status .act:hover:not(:disabled) {
  color: var(--text);
}

.talk-status .act:disabled {
  opacity: 0.5;
  cursor: default;
}

.status-bar .value,
.talk-status .value {
  color: var(--text-dim);
}

.status-bar .branch,
.talk-status .branch {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-bar .count,
.talk-status .count {
  display: inline-flex;
  align-items: center;
  gap: 1px;
}

.status-bar .count.some,
.talk-status .count.some {
  color: var(--text-dim);
}

.status-bar .lead {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-bar .lead.trouble {
  color: var(--warning-text);
}

/* A narrow window keeps when each window starts again in its tooltip. */
@media (max-width: 1080px) {
  .status-bar {
    gap: 10px;
  }

  .status-bar .resets,
  .status-bar .lead:not(.trouble) {
    display: none;
  }
}

.status-bar .lead.trouble ~ .stat {
  display: none;
}

.meter {
  position: relative;
  width: 32px;
  height: 4px;
  overflow: hidden;
  border-radius: 2px;
  background: var(--border);
}

.meter > span {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 2px;
  background: var(--accent);
}

.meter.mid > span {
  background: var(--warning-text);
}

.meter.high > span {
  background: var(--danger);
}

.send {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  color: var(--accent-text);
  background: var(--accent);
  border-radius: 7px;
}

.send.stop {
  color: var(--danger-text);
  background: var(--danger-solid);
}

.send:disabled {
  color: var(--text-faint);
  background: var(--bg-hover);
}

/* Dictating on the computer: a line in the field while it records, not a capsule over the screen. */
.dictating {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 2px 6px 2px 12px;
  font-size: 12px;
  color: var(--text-dim);
}

.dictating.failed {
  color: var(--danger);
}

.dictating .bars {
  height: 18px;
  color: var(--danger);
}

.dictating-dot {
  width: 8px;
  height: 8px;
  background: var(--danger-solid);
  border-radius: 50%;
  animation: dictating 1.2s ease-in-out infinite;
}

@keyframes dictating {
  50% {
    opacity: 0.35;
  }
}

.dictating-time {
  font-family: var(--font-code);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.dictate-mic.on {
  color: var(--danger);
}

/* Prose the assistant wrote */

.prose {
  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: break-word;
}

.prose > :first-child {
  margin-top: 0;
}

.prose > :last-child {
  margin-bottom: 0;
}

.prose p,
.prose ul,
.prose ol,
.prose pre,
.prose blockquote,
.prose-table {
  margin: 0 0 10px;
}

.prose ul,
.prose ol {
  padding-left: 20px;
}

.prose li {
  margin-bottom: 3px;
}

.prose li::marker {
  color: var(--text-faint);
}

.prose li > p {
  margin: 0 0 4px;
}

.prose li > ul,
.prose li > ol {
  margin: 3px 0 0;
}

.prose .contains-task-list {
  padding-left: 2px;
  list-style: none;
}

.prose .task-list-item input {
  margin: 0 6px 0 0;
  vertical-align: -1px;
}

.prose h1,
.prose h2,
.prose h3,
.prose h4,
.prose h5,
.prose h6 {
  margin: 18px 0 6px;
  font-weight: 600;
  line-height: 1.35;
}

.prose h1 {
  font-size: 18px;
}

.prose h2 {
  font-size: 16px;
}

.prose h3 {
  font-size: 15px;
}

.prose h4,
.prose h5,
.prose h6 {
  font-size: 14px;
  color: var(--text-dim);
}

.prose strong {
  font-weight: 600;
}

.prose del {
  color: var(--text-dim);
}

.prose code {
  padding: 0.1em 0.35em;
  font-family: var(--font-code);
  font-size: 0.85em;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

.prose pre {
  padding: 10px 12px;
  overflow-x: auto;
  font-size: 12px;
  line-height: 1.55;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.prose pre code {
  padding: 0;
  font-size: inherit;
  white-space: pre;
  background: none;
  border: none;
}

/* The block carries the margin, so the copy button sits on the code and not above it. */

.code-block {
  position: relative;
}

.code-block > pre {
  margin: 0;
}

.prose .code-block {
  margin: 0 0 10px;
}

.prose > .code-block:last-child {
  margin-bottom: 0;
}

.detail-block {
  margin: 4px 0 2px;
}

.code-block .copy-code {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 24px;
  height: 24px;
  background: var(--code-bg);
  opacity: 0;
  transition: opacity var(--quick) var(--ease);
}

.code-block:hover .copy-code,
.code-block .copy-code:focus-visible {
  opacity: 1;
}

.prose a {
  color: var(--accent);
  text-decoration: none;
}

.prose a:hover {
  text-decoration: underline;
}

/* A path the assistant wrote without a link, found on disk. */
.prose .file-link {
  color: var(--accent);
  cursor: pointer;
}

.prose .file-link:hover {
  text-decoration: underline;
}

.prose blockquote {
  padding-left: 12px;
  margin-left: 0;
  margin-right: 0;
  color: var(--text-dim);
  border-left: 2px solid var(--border-strong);
}

.prose blockquote > :last-child {
  margin-bottom: 0;
}

.prose hr {
  margin: 16px 0;
  border: none;
  border-top: 1px solid var(--border);
}

.prose-table {
  overflow-x: auto;
}

.prose table {
  font-size: 13.5px;
  line-height: 1.45;
  border-collapse: collapse;
}

.prose th,
.prose td {
  padding: 5px 10px;
  text-align: left;
  vertical-align: top;
  border: 1px solid var(--border);
}

.prose th {
  font-weight: 600;
  background: var(--code-bg);
}

.prose td code {
  padding: 0;
  background: none;
  border: none;
}

/* ------------------------------------------------------------------ */
/* The dictation capsule                                               */
/* ------------------------------------------------------------------ */

.capsule-window {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  background: transparent;
  /* Only what can be seen moves the capsule; the clear margin around it does nothing. */
  -webkit-app-region: no-drag;
}

/* The capsule is moved by any part of itself that is not a control, as a window is by its title bar. */
.capsule {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 14px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 999px;
  box-shadow: var(--shadow);
  -webkit-app-region: drag;
}

/* Run from the source: said where the capsule could be the installed GeckIt's, as the Dock icon says it. */
.dev-tag {
  padding: 1px 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--warning-text);
  background: var(--warning-bg);
  border-radius: 999px;
}

.capsule :is(button, select, textarea, input, .mic, .frames, .asking-plan, .asking-heard span) {
  -webkit-app-region: no-drag;
}

/* Asking before anything is done: the capsule becomes a card with the list in it. */
.capsule:has(.asking) {
  align-items: stretch;
  width: 320px;
  padding: 0;
  overflow: hidden;
  border-radius: 14px;
}

.asking {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
}

/* The words themselves, so a mishearing is caught before anything is done. */
.asking-heard {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 10px 14px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--text-faint);
  background: var(--bg-sunken);
  border-bottom: 1px solid var(--border);
}

.asking-heard span {
  display: -webkit-box;
  overflow: hidden;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}

.asking-heard svg {
  flex-shrink: 0;
  margin-top: 3px;
}

.asking-plan {
  display: flex;
  flex-direction: column;
  max-height: 260px;
  overflow-y: auto;
}

.asking-one {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px 14px;
}

.asking-one + .asking-one {
  border-top: 1px solid var(--border);
}

.asking-one > svg {
  flex-shrink: 0;
  box-sizing: content-box;
  padding: 5px;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 6px;
}

.asking-said {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  padding-top: 2px;
}

.asking-head {
  font-size: 13px;
  font-weight: 600;
}

.asking-text {
  font-size: 12px;
  line-height: 1.45;
  color: var(--text-dim);
}

/* When it counts as finished: read as a condition, not shouted as a result. */
.asking-goal {
  display: flex;
  gap: 7px;
  align-items: flex-start;
  margin-top: 6px;
  padding: 7px 9px;
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--text-dim);
  background: var(--fill);
  border-radius: 7px;
}

.asking-goal svg {
  flex-shrink: 0;
  margin-top: 2px;
  color: var(--accent);
}

.asking-goal b {
  font-weight: 600;
  color: var(--text);
}

.asking-foot {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  padding: 2px 14px 14px;
}

.asking-foot button {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 500;
}

.asking-foot .keys {
  padding: 1px 5px;
  font-size: 10.5px;
  color: inherit;
  background: rgb(0 0 0 / 14%);
  border-radius: 4px;
}

.capsule .time {
  min-width: 34px;
  font-family: var(--font-code);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
}

.capsule .bars {
  color: var(--danger);
}

.capsule .said {
  max-width: 170px;
  padding: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  border: none;
}

/* Recording the screen: the dot says the screen is being taken, the bars that the microphone is. */
.capsule .rec-dot {
  width: 8px;
  height: 8px;
  background: var(--danger-solid);
  border-radius: 50%;
}

/* What is being recorded leads, so the pill cannot be taken for dictation; the microphone follows it, quieter. */
.recording-what {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}

.capsule .rule {
  align-self: stretch;
  width: 1px;
  margin: 2px 0;
  background: var(--border);
}

.capsule:has(.recording-what) :is(.mic, .bars) {
  color: var(--text-faint);
}

.capsule-note {
  max-width: 280px;
  font-size: 12px;
  line-height: 1.45;
}

.capsule-note.danger {
  color: var(--danger);
}

.capsule > .quiet {
  flex-shrink: 0;
  padding: 3px 10px;
  font-size: 12px;
}

/* A recording's card is wider than an order's, to hold its frames in one row. */
.capsule:has(.recorded) {
  width: 400px;
}

.recorded .asking-heard textarea {
  flex: 1;
  min-width: 0;
  padding: 0;
  font: inherit;
  line-height: 1.45;
  color: var(--text);
  resize: none;
  background: transparent;
  border: none;
  outline: none;
}

.recorded .asking-heard textarea::placeholder {
  color: var(--text-faint);
}

.frames {
  display: flex;
  gap: 8px;
  padding: 12px 14px 10px;
  overflow-x: auto;
}

.frame {
  position: relative;
  flex: none;
  width: 64px;
}

.frame img {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.frame .at {
  display: block;
  margin-top: 3px;
  font-size: 10.5px;
  color: var(--text-faint);
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.frame .leave {
  position: absolute;
  top: -6px;
  right: -6px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  color: var(--tooltip-text);
  background: var(--tooltip-bg);
  border-radius: 50%;
  opacity: 0;
  transition: opacity var(--quick) var(--ease);
}

.frame:hover .leave,
.frame .leave:focus-visible {
  opacity: 1;
}

.mic {
  position: relative;
  display: inline-flex;
}

.mic select {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: none;
  opacity: 0;
  cursor: pointer;
}

/* Keyboard shortcuts */

.dialog.shortcuts {
  width: min(560px, 92vw);
}

.shortcuts h3 {
  margin: 16px 0 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-faint);
}

.shortcuts dl {
  margin: 0;
}

.shortcuts dl > div {
  display: grid;
  grid-template-columns: minmax(0, 13em) minmax(0, 1fr);
  gap: 12px;
  padding: 4px 0;
  border-top: 1px solid var(--border);
}

.shortcuts dt,
.shortcuts dd {
  margin: 0;
}

.shortcuts dd {
  color: var(--text-dim);
}

.shortcuts kbd {
  font-family: var(--font-code);
  font-size: 11px;
}

/* Saved prompts, run by hand or on a timetable. */

.dialog.shortcut-list {
  width: min(580px, 92vw);
}

.shortcut-empty {
  padding: 14px 0;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
}

.shortcut-row {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 0;
  border-top: 1px solid var(--border);
}

.shortcut-text {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
  padding: 3px 6px;
  text-align: left;
  border-radius: 5px;
}

.shortcut-text:hover {
  background: var(--bg-hover);
}

.shortcut-name {
  overflow: hidden;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.shortcut-when {
  overflow: hidden;
  font-size: 12px;
  color: var(--text-dim);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.shortcut-prompt {
  overflow: hidden;
  font-size: 12px;
  color: var(--text-faint);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.shortcut-when > span + span::before {
  content: ' \00b7\00a0';
}

.shortcut-row .quiet,
.shortcut-row .primary {
  flex-shrink: 0;
  padding: 4px 12px;
  font-size: 12px;
}

.shortcut-repeat {
  display: flex;
  gap: 8px;
  align-items: center;
}

.shortcut-repeat > .select {
  min-width: 140px;
}

.shortcut-minute {
  display: flex;
  gap: 6px;
  align-items: center;
  color: var(--text-dim);
}

.shortcut-minute input {
  width: 60px;
}

.shortcut-cron {
  flex: 1;
  min-width: 0;
  font-family: var(--font-code);
  font-size: 12px;
}

.shortcut-next {
  font-size: 12px;
  color: var(--text-faint);
}

.shortcut-next.wrong {
  color: var(--danger);
}

.field > label.check.shortcut-on {
  font-size: 12px;
  color: var(--text-dim);
}

.recurrence-scrim {
  z-index: 70;
  background: var(--scrim);
}

.dialog.recurrence-dialog {
  display: flex;
  flex-direction: column;
  width: min(460px, 92vw);

  overflow: hidden;
}

.recurrence-body {

  flex-direction: column;
  gap: 12px;
  min-height: 0;
  overflow-y: auto;
  margin-inline: -4px;
  padding: 4px 4px 8px;
}

.recurrence-start {

  gap: 12px;
}

.recurrence-body .field {

}

.recurrence-interval {

  gap: 10px;
}

.recurrence-interval > input {
  width: 78px;
}

.recurrence-interval > .select {
  min-width: 125px;
}

.recurrence-dialog input[type='date'],
.recurrence-dialog input[type='time'] {

.recurrence-dialog input[type='date'] {

:root[data-theme='dark'] .recurrence-dialog input {

@media (prefers-color-scheme: dark) {

/* What runs in the background, as the terminal's /tasks has it. */

/* ---------------------------------------------------------------- */
/* The board                                                         */
/* ---------------------------------------------------------------- */

/* One column of window instead of two: the board takes the width, and a conversation opened from it comes up over it. */
.chat.boarded {
  grid-template-columns: 1fr;
}

/* Or below it: the board is a strip across the top, as tall as it was dragged, and the conversation takes the rest of the window. */
.chat.docked {
  --dock-height: clamp(96px, var(--dock, 240px), 50vh);

  grid-template-rows: auto var(--dock-height) minmax(0, 1fr) auto;
}

.chat.docked > .board {
  height: auto;
  min-height: 0;
  border-bottom: 1px solid var(--border);
}

/* The strip is small, so the columns and their cards sit closer together. */
.chat.docked .board-columns {
  gap: 8px;
  padding: 8px 12px;
}

.chat.docked .board-column {
  padding: 6px;
}

.chat.docked .board-column-head {
  padding: 0 6px 6px;
}

.chat.docked .board-cards {
  gap: 6px;
}

/* A column with the whole board to itself, or the strip above a conversation: the cards are tiles side by side, as many to a row as fit, the day's heading across them all. A tile is no wider than its track, whatever word is in it. */
.board.tiled .board-day {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
}

.board.tiled .board-day-head {
  grid-column: 1 / -1;
}

.board.tiled .board-card {
  min-width: 0;
}

/* Where a dragged card would land among tiles: before this one, said on its left edge, since a line between rows could not say where in the row. The line after the last tile stays, and a picked tile keeps its frame. */
.board.tiled .board-card.landing {
  box-shadow: inset 3px 0 var(--accent);
}

.board.tiled .board-card.picked.landing {
  box-shadow: inset 3px 0 var(--accent), inset 0 0 0 1px var(--accent);
}

/* The strip's lower edge, dragged to give the board or the conversation more of the window. */
.dock-grip[hidden] {
  display: none;
}

.dock-grip {
  position: absolute;
  top: calc(var(--bar) + var(--dock-height) - 10px);
  right: 0;
  left: 0;
  z-index: 3;
  height: 20px;
  cursor: row-resize;
  -webkit-app-region: no-drag;
}

.dock-grip::before {
  position: absolute;
  top: 8px;
  left: calc(50% - 20px);
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--text-faint);
  content: '';
  pointer-events: none;
}

.dock-grip::after {
  position: absolute;
  top: 9px;
  right: 0;
  left: 0;
  height: 2px;
  content: '';
  transition: background-color var(--quick) var(--ease);
}

.dock-grip:hover::after {
  background: var(--accent);
}

.dock-grip:hover::before,
.chat.docking .dock-grip::before {
  background: var(--accent);
}

.chat.docking .dock-grip::after {
  background: var(--accent);
}

.chat.docking,
.chat.docking * {
  cursor: row-resize;
  user-select: none;
}

.board-views {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 2px;
  padding-inline-end: 8px;
  border-inline-end: 1px solid var(--border);
}

.board-view-options {
  position: relative;
  width: 28px;
  height: 28px;
}

.board-view-options.on,
.board-questions.on {
  color: var(--text);
  background: var(--bg-hover);
}

.board-view-dot {
  position: absolute;
  inset-block-start: 3px;
  inset-inline-end: 3px;
  width: 5px;
  height: 5px;
  background: var(--accent);
  border-radius: 50%;
}

.board-head .board-questions {
  width: auto;
  min-width: 28px;
  height: 28px;
  gap: 5px;
  padding-inline: 6px;
}

.board-question-count {
  min-width: 16px;
  padding-inline: 4px;
  font-size: 11px;
  line-height: 16px;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  background: var(--bg-sunken);
  border-radius: var(--radius);
}

.board {
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100%;
  background: var(--bg);
}

.board-head {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 8px;
  /* Held to the window: its buttons give way rather than widening the whole grid, which cut the bar along the bottom off at its right. Nothing is clipped, so the search's rows still drop out of it. */
  min-width: 0;
  padding: 8px 12px 8px 82px;
  border-bottom: 1px solid var(--border);
}

/* Where the window is too narrow for everything in the head, the keys go first: each is in its button's tooltip too. */
@media (max-width: 1240px) {
  .board-head .keys {
    display: none;
  }
}

html.framed .board-head {
  padding-left: 12px;
}

/* One row, one height: the picker and the two buttons carry the sidebar's own margins, which stand them off centre here. */
.board-head .project,
.board-head .board-new {
  height: 28px;
  margin: 0;
  padding: 0 10px;
}

.board-head .project {
  flex: 0 1 240px;
}

/* The search says it is there rather than waiting behind a key: the Cmd+P field itself, in the head, its rows under it. */
.board-search {
  position: relative;
  display: flex;
  flex: 1 1 auto;
  align-items: center;
  gap: 8px;
  min-width: 0;
  max-width: 520px;
  height: 28px;
  padding: 0 10px;
  color: var(--text-faint);
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 7px;
}

.board-search:hover {
  border-color: var(--border-strong);
}

/* Over the layer that takes a click away, so the field itself stays a field while the rows are up. */
.board-search.open {
  z-index: 45;
  background: var(--field);
  border-color: var(--accent);
}

/* By the element, as the Cmd+P field is: a class alone loses to input[type='text']. */
.board-search input {
  flex: 1;
  min-width: 0;
  padding: 0;
  font-size: 13px;
  color: var(--text);
  background: none;
  border: none;
  border-radius: 0;
}

.board-search input:focus-visible {
  outline: none;
}

/* Away from the field, which puts the rows away without taking the click to a card. */
.board-search-away {
  position: fixed;
  z-index: 40;
  inset: 0;
}

/* Wider than the field: a row carries a title, a project and the line it was found in. */
.board-search-found {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: min(560px, calc(100vw - 120px));
  max-height: 60vh;
  padding: 6px;
  overflow-y: auto;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.board-search-found .row {
  cursor: default;
}

.board-search-found mark {
  font-weight: 600;
  color: var(--text);
  background: none;
}

.board-search-found .where mark {
  color: inherit;
}

.board-search-found .more-found {
  color: var(--text-faint);
}

/* The column a found conversation stands in, and what is happening in it, ahead of its project. */
.switcher .stands .tag,
.board-search-found .stands .tag {
  display: inline-flex;
  vertical-align: 1px;
}

.switcher .stands .now,
.board-search-found .stands .now {
  color: var(--text-dim);
}

.board-new {
  flex-shrink: 0;
  width: auto;
  gap: 8px;
  white-space: nowrap;
}

/* New task and the arrow beside it: one control, the arrow set off by a hairline. */
.board-split {
  display: flex;
  flex-shrink: 0;
  align-items: center;
}

.board-head .board-split .board-new {
  border-radius: var(--radius) 0 0 var(--radius);
}

.board-more {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 28px;
  color: var(--text-dim);
  border-left: 1px solid var(--border);
  border-radius: 0 var(--radius) var(--radius) 0;
}

.board-more:hover,
.board-more.on {
  color: var(--text);
  background: var(--bg-hover);
}

/* Starting a task is what the board is for: tinted rather than filled, so it leads the head without shouting over the cards. */
.board-split :is(.board-new, .board-more) {
  color: var(--accent);
  background: var(--accent-soft);
}

.board-split :is(.board-new, .board-more):hover,
.board-split .board-more.on {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 24%, var(--bg-raised));
}

.board-split .board-more {
  border-left-color: color-mix(in srgb, var(--accent) 25%, transparent);
}

.board-split .keys {
  color: color-mix(in srgb, var(--accent) 65%, transparent);
}

.board-empty {
  padding: 12px 12px 0;
  font-size: 13px;
  color: var(--text-dim);
}

/* As many columns as are shown, each the same width: three, or one on its own across the board. */
.board-columns {
  display: grid;
  flex: 1;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 12px;
  min-height: 0;
  padding: 12px;
}

.board-column {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 8px;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 10px;
}

/* A card is over this column and would land here. */
.board-column.taking {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, var(--bg-sunken));
}

.board-column-head {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  padding: 2px 6px 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* How many work against the limit, said as a card says it is working, so it does not read as a second count. */
.board-column-head .working-count {
  margin-inline-end: 10px;
  font-size: 11px;
  font-weight: 500;
  text-transform: none;
  letter-spacing: 0;
}

.board-cards {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
  overflow-y: auto;
  padding: 2px;
}

.board-day {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  gap: 8px;
}

.board-day-head {
  position: sticky;
  top: -2px;
  z-index: 1;
  display: flex;
  gap: 5px;
  align-items: center;
  width: 100%;
  padding: 5px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-faint);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: var(--bg-sunken);
  border-radius: 6px;
}

.board-day-head:hover {
  color: var(--text-dim);
  background: var(--bg-raised);
}

/* The folder below its project a conversation was started in: geckit / client. */
.board-card .subfolder {
  color: var(--text-faint);
}

.board-card {
  position: relative;
  display: flex;
  flex-shrink: 0;
  flex-direction: column;
  gap: 5px;
  padding: 9px 10px;
  text-align: left;
  cursor: pointer;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  /* A card out of view is not laid out or painted, and keeps the height it last had. */
  content-visibility: auto;
  contain-intrinsic-size: auto 86px;
}

.board-card > .provider-icon {
  position: absolute;
  right: 10px;
  bottom: 9px;
}

.board-card:has(> .provider-icon):not(:has(> .employee-card-avatar)) > :nth-last-child(2) {
  padding-right: 20px;
}

.board-card:has(> .employee-card-avatar) > .provider-icon {
  inset-inline-end: 36px;
  inset-block-end: 12px;
}

/* A favorite, the same ones the sidebar groups at its top. */
.board-card.starred {
  background: color-mix(in srgb, var(--accent) 7%, var(--bg-raised));
  border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
}

.board-card.starred:hover {
  border-color: var(--accent);
}

.board-card-star {
  flex-shrink: 0;
  align-self: center;
  color: var(--accent);
}

.board-card:hover {
  border-color: var(--text-faint);
}

/* The one open behind the conversation showing over the board. */
.board-card.on {
  background: color-mix(in srgb, var(--accent) 24%, var(--bg-raised));
}

.board-card.picked {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.board-picked {
  padding: 8px 14px;
}

.board-picked-how {
  color: var(--text-faint);
}

.board-card.waits.asks {
  box-shadow: inset 3px 0 0 var(--warning-text);
  background: var(--warning-bg);
}

.board-card.waits .board-card-name {
  flex: 1;
  min-width: 0;
  font-size: 13px;
}

.board-card-title {
  font-weight: 600;
}

.board-card-head {
  display: flex;
  gap: 7px;
  align-items: baseline;
}

.board-card-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  font-size: 13px;
  line-height: 1.35;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.board-card-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  font-size: 12px;
}

/* Only there to be found when it is wanted, so it keeps quiet until then. */
.board-card-links {
  display: flex;
  flex-shrink: 0;
  gap: 3px;
  align-items: center;
  height: 18px;
  padding: 0 5px;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--text-faint);
  border-radius: 5px;
  opacity: 0.7;
}

.board-card:hover .board-card-links,
.board-card-links:hover {
  opacity: 1;
}

.board-card-links:hover {
  color: var(--text);
  background: var(--bg-hover);
}

.board-card-goal,
.board-card-stands {
  display: flex;
  gap: 5px;
  align-items: center;
  min-width: 0;
  font-size: 12px;
  color: var(--text-dim);
}

.board-card-goal span,
.board-card-stands span {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.board-card-goal {
  color: var(--accent);
}

.board-card-goal.met {
  color: var(--success-text);
}

/* What is happening in it: Claude working, waiting for you, what runs in the background. */
.board-card-state {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  align-items: center;
  margin-top: 1px;
  font-size: 11px;
  color: var(--text-dim);
}

/* Where a dragged card would land. It takes no room, so nothing moves under the pointer. */
.board-drop {
  flex-shrink: 0;
  height: 2px;
  margin: -5px 2px;
  background: var(--accent);
  border-radius: 1px;
}

/* Above the first card it would sit outside the scrolled list and be cut off, so it takes the list's padding instead. */
.board-day:first-child > .board-drop:first-child {
  margin: -2px 2px -8px;
}

.state-said {
  display: inline-flex;
  gap: 5px;
  align-items: center;
}

.state-said .state-dot {
  flex-shrink: 0;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-faint);
}

.state-said.said-working {
  color: var(--accent);
}

.state-said.said-working .state-dot {
  background: var(--accent);
  animation: fade 900ms var(--ease) infinite alternate;
}

.state-said.said-asks {
  color: var(--warning-text);
}

.state-said.said-asks .state-dot {
  background: var(--warning-text);
}

.state-said.said-unread .state-dot {
  background: var(--unread);
}

/* Still running, with the turn over: the ring the list uses for the same thing. */
.state-said.said-background {
  color: var(--accent);
}

.state-said.said-background .state-dot {
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--accent);
  animation: fade 900ms var(--ease) infinite alternate;
}

.state-said.said-failed {
  color: var(--danger);
}

.state-said.said-failed .state-dot {
  background: var(--danger);
}

/* The New task form the board opens, over the same dimming as a conversation. */
.new-task {
  position: absolute;
  top: 80px;
  left: 50%;
  z-index: 8;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: min(520px, calc(100% - 80px));
  max-height: calc(100% - 96px);
  overflow-y: auto;
  padding: 16px 18px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 18px 50px rgb(0 0 0 / 35%);
  transform: translateX(-50%);
}

.new-task-head {
  font-size: 14px;
  font-weight: 600;
}

.new-task-kinds {
  display: flex;
  gap: 2px;
  margin-left: -10px;
}

.new-task-label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
  color: var(--text-dim);
}

.new-task-folder {
  margin: 0;
  width: 100%;
  min-width: 0;
  padding: 7px 9px;
  text-align: left;
}

.new-task-folder > .name {
  flex: 1;
  min-width: 0;
  max-width: none;
}

.new-task-folder .lines {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.new-task-folder .says {
  overflow: hidden;
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 400;
  text-overflow: ellipsis;
}

.new-task-models {
  display: flex;
  gap: 12px;
}

.new-task-models > label {
  flex: 1;
  min-width: 0;
}

.new-task-where,
.new-task-text,
.new-task-goal {
  padding: 7px 9px;
  font: inherit;
  font-size: 13px;
  color: var(--text);
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.new-task-text {
  resize: vertical;
  line-height: 1.45;
}

/* A file is over the field and would be taken. */
.new-task-text.taking {
  background: var(--accent-soft);
  border-color: var(--accent);
}

.new-task .pending {
  margin-top: -4px;
}

.new-task-where:focus,
.new-task-text:focus,
.new-task-goal:focus {
  border-color: var(--accent);
  outline: none;
}

/* Other ways to fill the field than typing in it. */
.new-task-ways {
  display: flex;
  gap: 6px;
  margin-top: -4px;
}

.new-task-ways .quiet {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 3px 9px;
  font-size: 12px;
}

.new-task-recorded {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: -6px;
  font-size: 11px;
  color: var(--text-faint);
}

.new-task-recorded .icon-button {
  width: 18px;
  height: 18px;
}

.new-task-foot {
  display: flex;
  gap: 8px;
  align-items: center;
}

.new-task-why {
  flex: 1;
  min-width: 0;
  font-size: 11px;
  color: var(--text-faint);
}

.new-task-why.trouble,
.phone-task-note.trouble {
  color: var(--danger);
}

/* The conversation over the board, and the board dimmed behind it. */
.talk-scrim {
  position: absolute;
  inset: 0;
  z-index: 5;
  background: rgb(0 0 0 / 35%);
}

/* A form opened over an open conversation stands above it. */
.talk-scrim.form-scrim {
  z-index: 7;
}

.talk.over {
  position: absolute;
  /* Clear of the board's own head, so the window keeps its drag strip and the
     traffic lights are not covered, and standing off every edge: the board it
     is over stays visible around it. */
  inset: 62px 40px 38px;
  z-index: 6;
  overflow: hidden;
  width: min(1200px, calc(100% - 80px));
  height: auto;
  margin: 0 auto;
  background: var(--bg);
  border: 1px solid var(--border);
