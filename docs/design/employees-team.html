.assistant-preview.phone-preview .assistant-preview-controls select, .assistant-preview.phone-preview .assistant-preview-controls button { min-width: 0; max-width: 110px; font-size: 10px; }
.assistant-preview-heading { display: flex; flex: none; justify-content: space-between; align-items: center; padding: 20px 24px; }
.assistant-preview-heading h1 { margin: 0; font-size: 22px; }
.assistant-preview-board { padding: 0 20px 20px; gap: 16px; }
.assistant-preview-board .board-column { min-width: 0; }
.assistant-preview .board-card-head { gap: 12px; justify-content: space-between; }
.assistant-preview .board-card-head > span:last-child { flex: none; color: var(--text-dim); font-size: 12px; }
.assistant-preview .board-card-title { white-space: normal; }
.assistant-preview-task-note { margin: 8px 0 0; color: var(--text-dim); font-size: 12px; }
.assistant-preview-phone-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px; }
.assistant-preview-phone-list h2 { margin: 20px 0 12px; color: var(--text-dim); font-size: 13px; }
.assistant-preview-phone-list h2 span { margin-left: 8px; color: var(--text-faint); }
.assistant-preview-phone-list .board-card { margin-bottom: 10px; }
.assistant-preview.phone-preview .assistant-preview-heading { padding: 16px; }
.assistant-preview.phone-preview .board-card-head { align-items: start; }
.assistant-preview-board .board-column-head { gap: 10px; }
.assistant-phone-row > span:first-child { flex-shrink: 0; }
.assistant-phone-name { flex-shrink: 0; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
.assistant-phone-summary .assistant-quota { flex-shrink: 1; min-width: 0; }
.assistant-phone-summary .assistant-quota > span:first-child { max-width: 44px; overflow: hidden; text-overflow: ellipsis; }

.assistant-details-header h2 { margin: 0; font-size: 18px; }
.assistant-close { display: flex; flex: none; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius); color: var(--text-dim); }

.assistant-close:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.assistant-details-list { overflow-y: auto; padding: 0 20px 20px; }

.assistant-section + .assistant-section { margin-top: 14px; border-top: 1px solid var(--border); }

.assistant-quota-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.assistant-quota-tile { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 10px; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius); }
.assistant-quota-tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.assistant-quota-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 12px; }
.assistant-quota-heading > span { min-width: 0; color: var(--text-dim); overflow-wrap: anywhere; }
.assistant-quota-heading strong { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: end; overflow-wrap: anywhere; }

.assistant-quota-reset { color: var(--text-faint); font-size: 11px; }
.assistant-account .assistant-metadata { margin-top: 10px; color: var(--text-faint); font-size: 11px; }
.assistant-details-sheet .sheet-body { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.assistant-details-sheet .assistant-details { max-height: 72dvh; }
.assistant-details-sheet .assistant-details-header { padding: 0 16px 10px; }
.assistant-details-sheet .assistant-close { width: 44px; height: 44px; }
.assistant-details-sheet .assistant-details-list { padding: 0 16px 20px; }
.assistant-details-sheet .assistant-section h3 { font-size: 16px; }
.assistant-details-sheet .assistant-plan, .assistant-details-sheet .assistant-state, .assistant-details-sheet .assistant-account h4 { font-size: 13px; }
.assistant-details-sheet .assistant-quota-tile.wide { grid-column: 1 / -1; }
.assistant-details-sheet .assistant-quota-tile.wide .assistant-quota-heading { flex-wrap: wrap; }
.assistant-details-sheet .assistant-quota-heading strong { flex: none; }

.manager-settings {
  min-inline-size: 0;
}

.manager-settings p,
.manager-session p {
  color: var(--text-dim);
  line-height: 1.5;
}

.manager-setting,
.manager-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.manager-setting {
  justify-content: space-between;
  padding-block: 8px;
  border-block-end: 1px solid var(--border);
}

.manager-setting > span:last-child {
  text-align: end;
  color: var(--text-dim);
  max-inline-size: 60%;
}

.manager-actions {
  flex-wrap: wrap;
  margin-block-start: 12px;
}

.manager-settings .quiet.danger {
  color: var(--danger);
}

.manager-telegram {
  min-inline-size: 0;
}

/* Where Telegram stands: a dot in the state's tone, the state, and who it is connected as. */
.manager-telegram-state {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  min-inline-size: 0;
  margin-block-start: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-sunken);
}

.manager-telegram-state > div {
  min-inline-size: 0;
}

.manager-telegram-state strong {
  display: block;
  font-size: 13px;
}

.manager-telegram-state p {
  margin-block: 2px 0;
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.manager-telegram-state .manager-telegram-id {
  color: var(--text-faint);
}

.manager-telegram-state p.manager-telegram-detail {
  margin-block-start: 6px;
  color: var(--danger);
}

.manager-telegram-dot {
  flex: none;
  inline-size: 8px;
  block-size: 8px;
  margin-block-start: 5px;
  border-radius: 50%;
  background: var(--text-faint);
}

.manager-telegram-state[data-state='connected'] .manager-telegram-dot {
  background: var(--accent);
}

.manager-telegram-state[data-state='pairing'] .manager-telegram-dot,
.manager-telegram-state[data-state='confirming'] .manager-telegram-dot,
.manager-telegram-state[data-state='offline'] .manager-telegram-dot {
  background: var(--review-solid);
}

.manager-telegram-state[data-state='revoked'] .manager-telegram-dot,
.manager-telegram-state[data-state='conflict'] .manager-telegram-dot,
.manager-telegram-state[data-state='storage-error'] .manager-telegram-dot {
  background: var(--danger);
}

/* The links shared from Telegram: what each is, the time it has left, and Stop. */
.manager-links {
  margin-block-start: 12px;
  outline: none;
}

.manager-links-title {
  margin-block: 0 4px;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 600;
}

.manager-links-none {
  margin: 0;
  color: var(--text-faint);
  font-size: 12px;
}

.manager-links ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.manager-links li {
  display: flex;
  align-items: center;
  gap: 8px;
  min-inline-size: 0;
  padding-block: 4px;
  border-block-end: 1px solid var(--border);
}

.manager-links-name {
  flex: 1;
  min-inline-size: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}

.manager-links-left {
  flex: none;
  color: var(--text-faint);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

/* The quiet note a step can carry under its buttons. */
.manager-aside {
  margin-block-start: 12px;
}

.manager-aside summary {
  width: fit-content;
  color: var(--text-faint);
  font-size: 11px;
  cursor: pointer;
}

.manager-aside p {
  margin-block: 6px 0;
  color: var(--text-faint);
  font-size: 11px;
  line-height: 1.5;
}

/* The picture above the steps: three parts, and the direction the open step adds. */
.manager-flow {
  margin-block: 12px 14px;
  padding: 14px 12px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg-sunken);
}

.manager-flow-stage {
  position: relative;
  /* The mark's carrier is as wide as the rail and slides along it, so its box leaves the stage. */
  overflow: clip;
  overflow-clip-margin: 16px;
}

.manager-flow-line {
  position: absolute;
  inset-block-start: 18px;
  inset-inline: 16.667%;
  block-size: 2px;
  border-radius: 2px;
  background: var(--border-strong);
}

/* The mark travels by moving a rail-wide carrier, so only transform and opacity animate. */
.manager-flow-mark {
  position: absolute;
  inset-block-start: 19px;
  inset-inline: 16.667%;
  block-size: 0;
  opacity: 0;
}

.manager-flow-dot {
  position: absolute;
  inset-block-start: -4px;
  inset-inline-start: -4px;
  inline-size: 8px;
  block-size: 8px;
  border-radius: 50%;
  background: var(--accent);
}

.manager-flow-nodes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 0;
  margin: 0;
  list-style: none;
}

.manager-flow-node {
  position: relative;
  /* The mark passes behind a node rather than across its face. */
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  min-inline-size: 0;
  color: var(--text-faint);
  font-size: 11px;
  transition: color var(--settle) var(--ease);
}

.manager-flow-node.lit {
  color: var(--text);
}

.manager-flow-name {
  max-inline-size: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.manager-flow-badge {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  inline-size: 38px;
  block-size: 38px;
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  background: var(--bg);
  transition: border-color var(--settle) var(--ease), background-color var(--settle) var(--ease);
}

.manager-flow-node.lit .manager-flow-badge {
  border-color: var(--accent);
  background: linear-gradient(var(--accent-soft), var(--accent-soft)) var(--bg);
}

.manager-flow-ring {
  position: absolute;
  inset: -2px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  opacity: 0;
}

/* Named twice to outweigh `.dialog p`, which sets the margin shorthand and would otherwise take the centring and the gap away. */
.manager-flow .manager-flow-say {
  max-inline-size: 44ch;
  margin: 14px auto 0;
  text-align: center;
  text-wrap: balance;
  font-size: 12px;
}

/* The picture plays twice when the step opens or its answer changes, then rests: it explains once, and a loop above the step being read is movement, not explanation. Changing the step or the answer swaps which animation applies, which is what replays it. */
.manager-flow.step-assistant .node-manager .manager-flow-ring {
  animation: manager-flow-boot 2200ms var(--ease) 2;
}

.manager-flow.step-delegation[data-delegation='approve'] .node-you .manager-flow-ring {
  animation: manager-flow-boot 3200ms var(--ease) 2;
}

.manager-flow.step-delegation .manager-flow-mark {
  animation: manager-flow-out 2400ms linear 2;
}

.manager-flow.step-delegation[data-delegation='approve'] .manager-flow-mark {
  animation: manager-flow-ask 3200ms linear 2;
}

.manager-flow.step-telegram .manager-flow-mark {
  animation: manager-flow-ping 3000ms linear 2;
}

.manager-flow.step-enable .manager-flow-mark {
  animation: manager-flow-loop 4800ms linear 2;
}

@keyframes manager-flow-boot {
  from {
    transform: scale(0.72);
    opacity: 0.55;
  }
  70% {
    transform: scale(1.5);
    opacity: 0;
  }
  to {
    transform: scale(1.5);
    opacity: 0;
  }
}

@keyframes manager-flow-out {
  from {
    transform: translateX(50%);
    opacity: 0;
  }
  12% {
    opacity: 1;
  }
  88% {
    opacity: 1;
  }
  to {
    transform: translateX(100%);
    opacity: 0;
  }
}

/* Approval: the message stops just outside the manager and waits to be allowed. */
@keyframes manager-flow-ask {
  from {
    transform: translateX(50%);
    opacity: 0;
  }
  8% {
    opacity: 1;
  }
  22% {
    transform: translateX(62%);
  }
  47% {
    transform: translateX(62%);
  }
  92% {
    opacity: 1;
  }
  to {
    transform: translateX(100%);
    opacity: 0;
  }
}

@keyframes manager-flow-ping {
  from {
    transform: translateX(0);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  40% {
    transform: translateX(50%);
  }
  55% {
    transform: translateX(50%);
  }
  90% {
    opacity: 1;
  }
  to {
    transform: translateX(0);
    opacity: 0;
  }
}

@keyframes manager-flow-loop {
  from {
    transform: translateX(0);
    opacity: 0;
  }
  8% {
    opacity: 1;
  }
  25% {
    transform: translateX(50%);
  }
  50% {
    transform: translateX(100%);
  }
  75% {
    transform: translateX(50%);
  }
  92% {
    opacity: 1;
  }
  to {
    transform: translateX(0);
    opacity: 0;
  }
}

/* Standing still, the sentence under the picture is the whole explanation. */
@media (prefers-reduced-motion: reduce) {
  .manager-flow-mark,
  .manager-flow-ring {
    display: none;
  }
}

.manager-steps {
  display: grid;
  gap: 6px;
  padding: 0;
  margin: 0;
  list-style: none;
}

.manager-step {
  min-inline-size: 0;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  transition: border-color var(--settle) var(--ease), opacity var(--settle) var(--ease);
}

.manager-step.is-open {
  border-color: var(--border-strong);
}

.manager-step.is-locked {
  opacity: 0.55;
}

.manager-step-head {
  display: flex;
  align-items: center;
  gap: 10px;
  inline-size: 100%;
  min-inline-size: 0;
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: none;
  color: inherit;
  font: inherit;
  text-align: start;
}

button.manager-step-head {
  cursor: pointer;
}

.manager-step-mark {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  inline-size: 22px;
  block-size: 22px;
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  color: var(--text-faint);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  transition: background-color var(--settle) var(--ease), border-color var(--settle) var(--ease), color var(--settle) var(--ease);
}

.manager-step.is-open .manager-step-mark {
  border-color: var(--accent);
  color: var(--accent);
}

.manager-step.is-answered .manager-step-mark {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-text);
  animation: manager-step-done 260ms var(--ease);
}

@keyframes manager-step-done {
  from {
    transform: scale(0.55);
  }
}

.manager-step-title {
  flex: 1 1 auto;
  min-inline-size: 0;
  font-size: 13px;
  font-weight: 600;
  overflow-wrap: break-word;
}

.manager-step-value {
  flex: 0 100 auto;
  min-inline-size: 0;
  margin-inline-start: auto;
  overflow: hidden;
  color: var(--text-dim);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

button.manager-step-head > svg {
  flex: none;
  color: var(--text-faint);
}

button.manager-step-head:hover > svg {
  color: var(--text);
}

/* Named twice for the same reason as `.manager-flow-say`: `.dialog p` would flatten the indent that lines this up under the step's title. */
.manager-step .manager-step-locked {
  margin: 6px 0 0 32px;
  font-size: 12px;
}

.manager-step-body {
  display: grid;
  grid-template-rows: 1fr;
  animation: manager-step-open var(--settle) var(--ease);
}

.manager-step-fold {
  min-block-size: 0;
  overflow: clip;
  overflow-clip-margin: 4px;
}

@keyframes manager-step-open {
  from {
    grid-template-rows: 0fr;
    opacity: 0;
  }
}

.manager-settings .manager-message {
  font-size: 12px;
  color: var(--text-faint);
}

.manager-settings .manager-error,
.manager-error {
  color: var(--danger);
  overflow-wrap: anywhere;
}

.manager-setup {
  margin-block: 12px 0;
}

/* The three parts of the bot setup, with the line between them filling as they are answered. */
.manager-setup-steps {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 8px;
  padding: 0;
  margin-block: 4px 16px;
  list-style: none;
  color: var(--text-faint);
  font-size: 12px;
}

.manager-setup-steps li {
  position: relative;
  padding-block-start: 14px;
}

.manager-setup-steps li::before {
  content: '';
  position: absolute;
  inset-block-start: 3px;
  inset-inline: 0;
  block-size: 2px;
  border-radius: 2px;
  background: var(--border);
  transition: background-color var(--settle) var(--ease);
}

.manager-setup-steps li.done::before,
.manager-setup-steps [aria-current='step']::before {
  background: var(--accent);
}

.manager-setup-steps [aria-current='step'] {
  color: var(--text);
  font-weight: 600;
}

.manager-bot-guide p {
  margin-block: 8px;
}

.manager-token {
  display: grid;
  gap: 8px;
  margin-block: 16px;
}

.manager-token input {
  inline-size: 100%;
  padding: 8px;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  background: var(--field);
  color: var(--text);
}

.manager-token input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.manager-token p {
  margin-block: 0;
  font-size: 12px;
}

.manager-candidate,
.manager-pairing {
  margin-block: 16px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.manager-session {
  inline-size: min(560px, calc(100vw - 32px));
  max-block-size: calc(100dvh - 32px);
  overflow-y: auto;
}

.manager-session header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.manager-details {
  display: grid;
  grid-template-columns: 100px minmax(0, 1fr);
  gap: 6px 12px;
  margin-block: 12px;
  font-size: 12px;
}

.manager-details dt {
  color: var(--text-faint);
}

.manager-details dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.manager-settings summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.manager-status {
  position: relative;
  z-index: 6;
  flex: none;
  gap: 6px;
  max-inline-size: 280px;
}

.manager-status-label {
  min-inline-size: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-faint);
}

.manager-inspection {
  display: flex;
  flex-direction: column;
  inline-size: min(920px, calc(100vw - 32px));
  block-size: min(740px, calc(100dvh - 48px));
  padding: 0;
  overflow: hidden;
}

.manager-inspection-header {
  display: flex;
  flex: none;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-block-end: 1px solid var(--border);
}

.manager-inspection-header h2 {
  margin: 0;
  font-size: 16px;
}

.manager-inspection-header > button {
  flex: none;
  white-space: nowrap;
}

.manager-inspection-header > button + button {
  margin-inline-start: -8px;
}

/* Where Manager stands, as a dot in its own tone next to the word. */
.manager-stand {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-inline-size: 0;
  margin-inline-end: auto;
  padding: 2px 9px 2px 7px;
  border-radius: 999px;
  background: var(--fill);
  color: var(--text-dim);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.manager-stand-text {
  min-inline-size: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.manager-stand-dot {
  flex: none;
  inline-size: 7px;
  block-size: 7px;
  border-radius: 50%;
  background: var(--text-faint);
}

.manager-stand[data-tone='ready'] .manager-stand-dot,
.manager-stand[data-tone='working'] .manager-stand-dot {
  background: var(--accent);
}

.manager-stand[data-tone='waiting'] .manager-stand-dot,
.manager-stand[data-tone='paused'] .manager-stand-dot {
  background: var(--review-solid);
}

.manager-stand[data-tone='error'] .manager-stand-dot {
  background: var(--danger);
}

.manager-stand[data-tone='working'] .manager-stand-dot {
  animation: manager-stand-beat 1.8s ease-in-out infinite;
}

@keyframes manager-stand-beat {
  50% {
    opacity: 0.3;
  }
}

@media (prefers-reduced-motion: reduce) {
  .manager-stand-dot {
    animation: none !important;
  }
}

.manager-inspection-info {
  flex: none;
  padding: 8px 16px;
  max-block-size: 35%;
  overflow-y: auto;
  border-block-end: 1px solid var(--border);
}

.manager-inspection-info p {
  margin-block: 4px;
  color: var(--text-dim);
  font-size: 12px;
}

.manager-retry {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.manager-inspection-facts {
  color: var(--text) !important;
  font-weight: 500;
  overflow-wrap: anywhere;
}

.manager-inspection-id {
  color: var(--text-faint) !important;
  font-family: var(--font-code);

/* The floating gecko: its window is transparent and square, the gecko drawn from its frames standing in it, the same on every system and in light and dark. Sizes are fractions of the window, so it scales when it is resized. */
.gecko-glyph {
  width: 20px;
  height: 20px;
  object-fit: contain;
}

.gecko-window {
  position: fixed;
  inset: 0;
  cursor: pointer;
}

.gecko-hold {
  position: absolute;
  inset: 0;
}

.gecko-art {
  position: absolute;
  inset: 0;
  container-type: size;
  --gk-spring: cubic-bezier(0.3, 1.6, 0.5, 1);
}

/* The drawing's 1024 view, a little smaller than the window so a hop stays inside it. */
.gk-box {
  position: absolute;
  bottom: 2%;
  left: 6%;
  width: 88%;
  aspect-ratio: 1;
}

.gk-wig,
.gk-mover,
.gk-breath {
  position: absolute;
  inset: 0;
  transform-origin: 50% 90.8%;
}

.gk-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.gk-shadow {
  position: absolute;
  top: 88.3%;
  left: 20.7%;
  width: 58.6%;
  height: 5.1%;
  border-radius: 50%;
  background: rgb(0 0 0 / 14%);
}

/* One layer at a time, swapped at once: no fade between frames, so nothing flickers. */
.gecko-art .gk-layer,
.gecko-art .gk-key {
  opacity: 0;
}

.gecko-art .gk-layer.gk-on,
.gecko-art .gk-key.gk-on {
  opacity: 1;
}

.gk-pupil {
  transition: transform 120ms ease-out;
}

/* The lens flashes only when the shot is taken. */
.gecko-art .gk-lens.gk-on {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}

.gk-snap .gk-lens.gk-on {
  animation: gk-lens 500ms ease-out;
}

.gk-flash {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgb(255 255 255 / 95%), rgb(255 255 255 / 0%));
  opacity: 0;
  pointer-events: none;
}

.gk-snap .gk-flash {
  animation: gk-flash 450ms ease-out;
}

/* The waiting count on its corner, from one: it stays while the gecko dozes. */
.gk-badge {
  position: absolute;
  top: round(3cqh, 1px);
  right: round(3cqw, 1px);
  box-sizing: border-box;
  min-width: round(max(16px, 12.5cqmin), 2px);
  height: round(max(16px, 12.5cqmin), 2px);
  padding: 0 round(max(4px, 3.3cqmin), 1px);
  border-radius: 999px;
  color: #fff;
  background: #f08c1e;
  box-shadow: 0 0 0 round(max(2px, 1cqmin), 1px) #fff;
  font-size: max(10px, 6.7cqmin);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: round(max(16px, 12.5cqmin), 2px);
  text-align: center;
  animation: gk-pop 350ms var(--gk-spring);
}

/* What the body does in each pose, on the HTML wrappers so the compositor draws it. */
.gk-asleep .gk-breath {
  animation: gk-breathe 3.6s ease-in-out 8;
}

.gk-working .gk-breath {
  animation: gk-nod 1.1s ease-in-out infinite;
}

.gk-waiting .gk-breath {
  animation: gk-bounce 3.2s ease-in-out infinite;
}

.gk-done .gk-breath {
  animation: gk-sway 3s ease-in-out infinite;
}

.gk-press .gk-wig {
  animation: gk-squash 350ms ease-out;
}

.gk-got .gk-mover {
  animation: gk-squash 350ms ease-out;
}

.gk-hop .gk-mover {
  animation: gk-hop 1.1s cubic-bezier(0.3, 0.7, 0.4, 1);
}

.gk-hop .gk-shadow {
  animation: gk-shadow 1.1s cubic-bezier(0.3, 0.7, 0.4, 1);
}

/* Not seen, reduced motion, and stills: nothing moves. */
.gk-still .gk-breath,
.gk-still .gk-wig,
.gk-still .gk-mover,
.gk-still .gk-shadow,
.gk-still .gk-lens,
.gk-still .gk-flash,
.gk-still .gk-badge {
  animation: none;
}

.gk-still .gk-pupil {
  transition: none;
}

/* The grip it is resized from, on its bottom right corner while it is pointed at. */
.gk-grip {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 16px;
  height: 16px;
  border-radius: 4px 0 6px;
  background:
    linear-gradient(135deg, transparent 0 45%, rgb(0 0 0 / 45%) 45% 52%, transparent 52% 64%, rgb(0 0 0 / 45%) 64% 71%, transparent 71%),
    rgb(255 255 255 / 75%);
  box-shadow: 0 0 0 0.5px rgb(0 0 0 / 15%);
  cursor: nwse-resize;
  opacity: 0;
  transition: opacity 150ms;
}

.gecko-window:hover .gk-grip,
.gk-grip:active {
  opacity: 1;
}

@keyframes gk-breathe {
  0%,
  100% {
    transform: none;
  }
  50% {
    transform: scale(1.018, 0.978);
  }
}

@keyframes gk-nod {
  0%,
  100% {
    transform: none;
  }
  50% {
    transform: rotate(0.8deg);
  }
}

@keyframes gk-bounce {
  0%,
  75%,
  100% {
    transform: none;
  }
  84% {
    transform: translateY(-2.73%) scale(0.98, 1.03);
  }
  92% {
    transform: scale(1.03, 0.97);
  }
}

@keyframes gk-sway {
  0%,
  100% {
    transform: none;
  }
  50% {
    transform: rotate(-1.2deg);
  }
}

@keyframes gk-hop {
  0%,
  100% {
    transform: none;
  }
  14% {
    transform: translateY(0.78%) scale(1.06, 0.92);
  }
  42% {
    transform: translateY(-11.72%) scale(0.97, 1.04);
  }
  68% {
    transform: none;
  }
  78% {
    transform: translateY(0.78%) scale(1.06, 0.93);
  }
}

@keyframes gk-shadow {
  0%,
  14%,
  68%,
  100% {
    transform: none;
    opacity: 1;
  }
  42% {
    transform: scale(0.6);
    opacity: 0.5;
  }
}

@keyframes gk-squash {
  0%,
  100% {
    transform: none;
  }
  40% {
    transform: scale(1.08, 0.88);
  }
  70% {
    transform: scale(0.97, 1.04);
  }
}

@keyframes gk-lens {
  0% {
    opacity: 1;
    transform: scale(0.6);
  }
  100% {
    opacity: 0;
    transform: scale(2.6);
  }
}

@keyframes gk-flash {
  0% {
    opacity: 0.85;
  }
  100% {
    opacity: 0;
  }
}

@keyframes gk-pop {
  0% {
    transform: scale(0);
  }
  100% {
    transform: none;
  }
}

/* The gecko's menu, in its own transparent window round the gecko: glass discs that fly out from it, the one in focus green. Scaled with the gecko by --k. */
.gk-ring {
  position: fixed;
  inset: 0;
  --gk-spring: cubic-bezier(0.3, 1.5, 0.5, 1);
}

.gk-ring-gecko {
  position: absolute;
  border-radius: 50%;
}

.gk-item {
  position: absolute;
  width: calc(92px * var(--k));
  margin: calc(-31px * var(--k)) 0 0 calc(-46px * var(--k));
  padding: 0;
  border: 0;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(6px * var(--k));
  cursor: pointer;
  opacity: 0;
  transform: scale(0.3);
  transition:
    transform 450ms var(--gk-spring),
    opacity 200ms;
  transition-delay: calc(var(--i) * 35ms);
  font: inherit;
}

.gk-ring-open .gk-item {
  opacity: 1;
  transform: translate(var(--x), var(--y));
}

/* The press keeps the item where it is: without it, every button's press transform pulls it back to the gecko and the release misses it. */
.gk-ring-open .gk-item:active {
  transform: translate(var(--x), var(--y)) scale(0.97);
}

.gk-item:focus-visible,
.gk-item:focus {
  outline: none;
}

.gk-disc {
  position: relative;
  display: grid;
  place-items: center;
  width: calc(62px * var(--k));
  height: calc(62px * var(--k));
  border-radius: 50%;
  color: #1d3b26;
  background: linear-gradient(rgb(255 255 255 / 92%), rgb(255 255 255 / 70%));
  box-shadow:
    inset 0 1px 0 #fff,
    0 0 0 0.5px rgb(0 0 0 / 8%),
    0 6px 18px rgb(0 0 0 / 18%);
  backdrop-filter: blur(14px) saturate(1.6);
  transition:
    transform 200ms var(--gk-spring),
    background 200ms,
    color 200ms;
}

.gk-disc svg {
  width: calc(26px * var(--k));
  height: calc(26px * var(--k));
}

.gk-item:focus .gk-disc {
  transform: scale(1.14);
  color: #fff;
  background: #1f8031;
}

/* On a dark pill, so it reads over any app behind it, a white page too. */
.gk-lbl {
  padding: calc(2px * var(--k)) calc(8px * var(--k));
  border-radius: 999px;
  color: #fff;
  background: rgb(20 28 22 / 62%);
  font-size: calc(12.5px * var(--k));
  font-weight: 600;
  white-space: nowrap;
}

.gk-cnt {
  position: absolute;
  top: -4px;
  right: -4px;
  box-sizing: border-box;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 11px;
  color: #fff;
  background: #f08c1e;
  box-shadow: 0 0 0 2px #fff;
  font-size: 12px;
  line-height: 22px;
  text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  .gecko-art *,
  .gk-badge {
    animation: none !important;
  }

  .gk-item,
  .gk-disc {
    transition: none;
  }
}

}

function filterItems() {
  return [{ v: '', label: 'All employees', on: S.filter === '' }, { v: 'none', label: 'No employee', lead: '<span class="none-dot">' + ic('person', 11) + '</span>', on: S.filter === 'none' }, { hr: 1 },

function boltItems() {
  const groups = [...S.employees.filter((e) => !e.archived), null];

  for (const g of groups) {

    items.push({ head: g ? av(g) + esc(g.name) : 'No employee' });

function assignItems(current) {

function render() {

  st.querySelectorAll('[data-editsc]').forEach((b) => b.onclick = () => shortcutDialog(S.shortcuts.find((x) => x.id === b.dataset.editsc)));
  if ($('newsc')) $('newsc').onclick = () => shortcutDialog({ employee: S.selected, name: '', project: 'Samara realty', schedule: null, on: true });
  if ($('edit')) $('edit').onclick = () => { S.editing = true; render(); $('ename').focus(); };
  if ($('cancel')) $('cancel').onclick = () => { S.editing = false; render(); };
  if ($('save')) $('save').onclick = () => { const e = emp(S.selected); e.name = $('ename').value.trim() || e.name; e.role = $('erole').value; e.description = $('edesc').value; S.editing = false; render(); };
  if ($('more')) $('more').onclick = (ev) => { const e = emp(S.selected); menu(ev.currentTarget, [{ v: e.archived ? 'restore' : 'archive', label: e.archived ? 'Restore' : 'Archive' }], (v) => v === 'restore' ? (e.archived = false, render(), toast('Schedules resumed')) : archiveDialog(e), false); };
  const ne = () => { const id = 'e' + Math.random().toString(36).slice(2, 6); S.employees.push({ id, name: 'New employee', role: '', avatar: 7 + S.employees.length, archived: false, description: '' }); S.selected = id; S.editing = true; render(); $('ename').select(); };
  if ($('newemp')) $('newemp').onclick = ne; if ($('newemp2')) $('newemp2').onclick = ne;
}
function pickFor(t, v) {
  if (v === '#team') { S.view = 'team'; S.selected = t.employee || 'e-realtor'; S.open = null; render(); return; }
  if (v === '#view') { S.view = 'team'; S.selected = t.employee; S.open = null; render(); return; }

}
function run(id) {
  if (id === '#team') { S.view = 'team'; render(); return; }
  const s = S.shortcuts.find((x) => x.id === id);
  if (S.tasks.some((t) => t.from === id && t.working)) { toast(`"${s.name}" is still running`); return; }
  S.tasks.forEach((t) => t.just = false);
  S.tasks.unshift({ id: 'r' + Date.now(), title: s.name, project: s.project, employee: s.employee, column: 'progress', working: true, at: Date.now(), stands: 'Starting', from: s.id, just: true });

}

    <label class="p-field">Prompt<textarea placeholder="What to do each time">${isNew ? '' : 'Найди новые лоты на torgi.gov.ru в Самарском районе до 2 млн рублей и сравни со вчерашним списком.'}</textarea></label>
    <p style="font-size:11px;color:var(--text-faint)">Assistant, model and mode as in the folder. A schedule runs while GeckIt is open.</p>

let menuClose = null;
function menu(anchor, items, onPick, search, onGone) {
  closeMenu();
  const r = anchor.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'pmenu'; el.setAttribute('role', 'menu');
  let q = '';
  const draw = () => {
    const shown = items.filter((i) => i.hr || i.head || !q || (i.label + ' ' + (i.small || '')).toLowerCase().includes(q));
    el.querySelector('.items').innerHTML = shown.map((i) => i.hr ? '<hr>' : i.head ? `<div class="mh">${i.head}</div>` : `<button class="mi" role="menuitem" data-v="${i.v}">${i.lead || ''}<span class="w"><span>${esc(i.label)}</span>${i.small ? `<small>${esc(i.small)}</small>` : ''}</span>${i.on ? `<span class="chk">${ic('check', 12)}</span>` : ''}${i.trail || ''}</button>`).join('');
    el.querySelectorAll('.mi').forEach((b) => b.onclick = () => { const v = b.dataset.v; closeMenu(); onPick(v); });
  };
  el.innerHTML = (search ? '<input placeholder="Search employees" aria-label="Search employees">' : '') + '<div class="items"></div>';
  $('layer').append(el); draw();
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  el.style.top = (r.bottom + 4 + h > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  const input = el.querySelector('input');
  if (input) { input.oninput = () => { q = input.value.toLowerCase(); draw(); }; input.focus(); } else el.querySelector('.mi')?.focus();
