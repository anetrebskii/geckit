  animation: fade 900ms var(--ease) infinite alternate;
}

.state-said.said-failed {
  color: var(--danger);
}

.state-said.said-failed .state-dot {
  background: var(--danger);
}

/* The New task form the board opens, over the same dimming as a conversation. */
.new-task {
  position: absolute;
  top: 80px;
  left: 50%;
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: min(520px, calc(100% - 80px));
  padding: 16px 18px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 18px 50px rgb(0 0 0 / 35%);
  transform: translateX(-50%);
}

.new-task-head {
  font-size: 14px;
  font-weight: 600;
}

.new-task-label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
  color: var(--text-dim);
}

.new-task-where,
.new-task-text,
.new-task-goal {
  padding: 7px 9px;
  font: inherit;
  font-size: 13px;
  color: var(--text);
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.new-task-text {
  resize: vertical;
  line-height: 1.45;
}

/* A file is over the field and would be taken. */
.new-task-text.taking {
  background: var(--accent-soft);
  border-color: var(--accent);
}

.new-task .pending {
  margin-top: -4px;
}

.new-task-where:focus,
.new-task-text:focus,
.new-task-goal:focus {
  border-color: var(--accent);
  outline: none;
}

/* Other ways to fill the field than typing in it. */
.new-task-ways {
  display: flex;
  gap: 6px;
  margin-top: -4px;
}

.new-task-ways .quiet {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 3px 9px;
  font-size: 12px;
}

.new-task-recorded {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: -6px;
  font-size: 11px;
  color: var(--text-faint);
}

.new-task-recorded .icon-button {
  width: 18px;
  height: 18px;
}

.new-task-foot {
  display: flex;
  gap: 8px;
  align-items: center;
}

.new-task-why {
  flex: 1;
  min-width: 0;
  font-size: 11px;
  color: var(--text-faint);
}

/* The conversation over the board, and the board dimmed behind it. */
.talk-scrim {
  position: absolute;
  inset: 0;
  z-index: 5;
  background: rgb(0 0 0 / 35%);
}

.talk.over {
  position: absolute;
  /* Clear of the board's own head, so the window keeps its drag strip and the
     traffic lights are not covered, and standing off every edge: the board it
     is over stays visible around it. */
  inset: 62px 40px 38px;
  z-index: 6;
  overflow: hidden;
  width: min(1200px, calc(100% - 80px));
  height: auto;
  margin: 0 auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 18px 50px rgb(0 0 0 / 35%);
}

@media (width <= 900px) {
  .talk.over {
    inset: 52px 14px 22px;
    width: calc(100% - 28px);
  }
}

/* ---------------------------------------------------------------- */
/* The phone                                                         */
/* ---------------------------------------------------------------- */

/* The same window served to the phone, drawn as an iPhone app: the system font at iOS sizes, grouped lists, and 44pt targets. */
html.phone {
  --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --top: env(safe-area-inset-top);
  --bottom: env(safe-area-inset-bottom);

  -webkit-tap-highlight-color: transparent;
}

html.phone body {
  font-size: 17px;
  line-height: 1.3;
  background: var(--ground);
  overscroll-behavior: none;
}

/* Shrunk with the keyboard as it rises, in its time, so the field comes up on top of the keys rather than after them. */
html.phone #root {
  height: calc(100dvh - var(--keyboard, 0px));
  transition: height 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
}

/* The board's usage line says what the status bar says, and the conversation covers the rest. */
html.phone .status-bar,
html.phone .talk-scrim {
  display: none;
}

html.phone .chat {
  grid-template-rows: minmax(0, 1fr);
}

/* Safari zooms into any field whose text is smaller than this. */
html.phone input,
html.phone textarea,
html.phone [contenteditable] {
  font-size: 17px;
}

html.phone button:active:not(:disabled) {
  filter: brightness(0.92);
}

/* The board */

.phone-board {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-width: 0;
  background: var(--ground);
}

.phone-bar {
  flex: none;
  padding: calc(var(--top) + 4px) 16px 0;
  background: var(--ground);
}

.phone-bar-row {
  display: flex;
  align-items: center;
  height: 44px;
  margin-inline-end: -10px;
}

.phone-bar-small {
  flex: 1;
  min-width: 0;
  font-size: 17px;
  font-weight: 600;
  pointer-events: none;
  opacity: 0;
  transform: translateY(6px);
  transition:
    opacity var(--settle) var(--ease),
    transform var(--settle) var(--ease);
}

.phone-bar.scrolled .phone-bar-small {
  opacity: 1;
  transform: none;
}

.phone-large {
  margin: 0 16px;
  font-size: 34px;
  font-weight: 700;
  line-height: 41px;
  letter-spacing: 0.01em;
}

/* The board's title stands above the list rather than in it, so the list's scroll indicator starts under the header, and folds into the bar once the list is scrolled. */
.phone-board .phone-large {
  flex: none;
  height: 41px;
  overflow: hidden;
  transition:
    height var(--settle) var(--ease),
    opacity var(--settle) var(--ease);
}

.phone-board .phone-large.folded {
  height: 0;
  opacity: 0;
}

/* The line under it shows once the title has gone. */
.phone-seg-bar {
  flex: none;
  padding: 10px 16px 12px;
  background: var(--ground);
  transition: box-shadow var(--settle) var(--ease);
}

.phone-seg-bar.scrolled {
  box-shadow: 0 0.5px 0 var(--separator);
}

.phone-seg-bar .phone-seg {
  margin: 0;
}

.phone-icon {
  display: grid;
  flex: none;
  place-items: center;
  width: 44px;
  height: 44px;
  color: var(--accent);
  border-radius: 22px;
}

/* The segmented control: the thumb slides under the chosen third. */
.phone-seg {
  position: relative;
  display: flex;
  margin: 10px 0 12px;
  padding: 2px;
  background: var(--fill);
  border-radius: 9px;
}

.phone-seg button {
  position: relative;
  z-index: 1;
  flex: 1;
  height: 30px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  border-radius: 7px;
}

.phone-seg button.on {
  font-weight: 600;
}

.phone-seg .n {
  margin-inline-start: 4px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  color: var(--text-faint);
}

.phone-seg-thumb {
  position: absolute;
  inset-block: 2px;
  left: 2px;
  width: calc((100% - 4px) / 3);
  background: var(--bg-raised);
  border-radius: 7px;
  box-shadow: 0 0 0 0.5px var(--separator), 0 3px 8px var(--fill-strong);
  transform: translateX(calc(var(--at, 0) * 100%));
  transition: transform 280ms var(--ease);
}

.phone-list {
  flex: 1;
  min-height: 0;
  padding-bottom: calc(var(--bottom) + 18px);
  overflow-y: auto;
  overscroll-behavior: contain;
}

.phone-alert {
  margin: 0 16px 14px;
  padding: 12px 14px;
  font-size: 15px;
  color: var(--warning-text);
  background: var(--warning-bg);
  border-radius: 12px;
}

.phone-empty {
  margin: 90px 32px;
  font-size: 17px;
  color: var(--text-faint);
  text-align: center;
}

.phone-head {
  margin: 18px 32px 7px;
  font-size: 13px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.phone-day-head {
  display: flex;
  gap: 6px;
  align-items: center;
  width: calc(100% - 64px);
  padding: 0;
  font: inherit;
  font-size: 13px;
  color: var(--text-faint);
  text-align: left;
  background: none;
  border: none;
}

.phone-day-head .n {
  text-transform: none;
}

.phone-head:first-child {
  margin-top: 4px;
}

.phone-group {
  margin: 0 16px;
  overflow: hidden;
  background: var(--bg-raised);
  border-radius: 12px;
}

.phone-note {
  margin: 7px 32px 0;
  font-size: 13px;
  color: var(--text-faint);
}

.phone-foot {
  margin: 18px 32px 0;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--text-faint);
}

/* The asks past the third, folded into one line at the foot of the group. */
.phone-fold {
  position: relative;
  width: 100%;
  height: 44px;
  font-size: 17px;
  color: var(--accent);
  box-shadow: inset 0 0.5px 0 var(--separator);
}

/* A row, and what its swipe uncovers on either side. */
.phone-swipe {
  position: relative;
  overflow: hidden;
}

.phone-swipe + .phone-swipe .phone-row::before {
  position: absolute;
  top: 0;
  inset-inline: 36px 0;
  height: 0.5px;
  content: '';
  background: var(--separator);
}

.phone-actions {
  position: absolute;
  inset-block: 0;
  display: flex;
  overflow: hidden;
}

.phone-actions.lead {
  left: 0;
}

.phone-actions.trail {
  right: 0;
  justify-content: flex-end;
}

.phone-action {
  display: flex;
  flex: none;
  flex-direction: column;
  gap: 4px;
  align-items: center;
  justify-content: center;
  width: 84px;
  font-size: 13px;
  font-weight: 600;
  color: var(--on-solid);
  transition: width var(--settle) var(--ease);
}

.phone-action.review {
  background: var(--review-solid);
}

.phone-action.done {
  background: var(--done-solid);
}

.phone-action.more,
.phone-action.back {
  background: var(--more-solid);
}

.phone-action.keep {
  background: var(--review-solid);
}

.phone-action.delete {
  background: var(--danger-solid);
}

.phone-row {
  position: relative;
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr);
  column-gap: 10px;
  padding: 11px 16px;
  cursor: default;
  background: var(--bg-raised);
  touch-action: pan-y;
  user-select: none;
  -webkit-touch-callout: none;
  transition: transform 260ms var(--ease);
}

.phone-row.moving {
  transition: none;
}

/* A favorite, tinted where it stands as the Mac's board tints it. */
.phone-row.starred {
  background: color-mix(in srgb, var(--accent) 9%, var(--bg-raised));
}

.phone-row-star {
  color: var(--accent);
}

.phone-dot {
  width: 10px;
  height: 10px;
  margin-top: 6px;
  border-radius: 50%;
}

.phone-dot.working {
  background: var(--accent);
  animation: breathe 1.6s ease-in-out infinite;
}

.phone-dot.asks {
  background: var(--review-solid);
}

.phone-dot.failed {
  background: var(--danger);
}

.phone-dot.unread {
  background: var(--accent);
}

.phone-dot.read {
  box-shadow: inset 0 0 0 1.5px var(--text-faint);
}

@keyframes breathe {
  50% {
    opacity: 0.35;
  }
}

.phone-row-line {
  display: flex;
  gap: 8px;
  align-items: baseline;
}

.phone-row-title {
  display: -webkit-box;
  flex: 1;
  overflow: hidden;
  font-size: 17px;
  font-weight: 600;
  line-height: 22px;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.phone-row-time {
  flex: none;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  color: var(--text-faint);
}

.phone-row-said {
  display: -webkit-box;
  margin-top: 3px;
  overflow: hidden;
  font-size: 15px;
  line-height: 20px;
  color: var(--text-dim);
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.phone-row-said.doing {
  color: var(--accent);
}

.phone-row-asks {
  margin-top: 3px;
  font-size: 15px;
  font-weight: 600;
  color: var(--warning-text);
}

.phone-row-cmd {
  margin-top: 6px;
  padding: 7px 10px;
  overflow: hidden;
  font-family: var(--font-code);
  font-size: 14px;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: var(--bg-sunken);
  border-radius: 8px;
}

.phone-row-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-items: center;
  margin-top: 5px;
  font-size: 13px;
  color: var(--text-faint);
}

.phone-row-tag {
  padding: 1px 6px;
  font-size: 12px;
  background: var(--fill);
  border-radius: 4px;
}

.phone-row-tag.blocked {
  color: var(--danger);
  background: none;
  box-shadow: inset 0 0 0 1px currentColor;
}

.phone-row-answer {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.phone-button {
  flex: 1;
  height: 44px;
  padding: 0 16px;
  font-size: 17px;
  font-weight: 600;
  border-radius: 10px;
}

.phone-button.fill {
  color: var(--accent-text);
  background: var(--accent);
}

.phone-button.grey {
  color: var(--text);
  background: var(--fill);
}

/* A long press lifts the row over a blurred board and opens its menu beside it. */
.phone-veil {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--scrim);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  animation: fade 200ms var(--ease) both;
}

.phone-lifted {
  position: fixed;
  z-index: 61;
  overflow: hidden;
  pointer-events: none;
  border-radius: 12px;
  box-shadow: var(--lift);
  animation: press 260ms var(--ease) both;
}

@keyframes press {
  from {
    transform: scale(0.96);
  }
  60% {
    transform: scale(1.03);
  }
}

.phone-menu {
  position: fixed;
  z-index: 61;
  width: 250px;
  overflow: hidden;
  transform-origin: top left;
  background: var(--menu);
  backdrop-filter: saturate(180%) blur(30px);
  -webkit-backdrop-filter: saturate(180%) blur(30px);
  border-radius: 14px;
  box-shadow: var(--lift);
  animation: grow 260ms var(--ease) both;
}

@keyframes grow {
  from {
    opacity: 0;
    transform: scale(0.6);
  }
}

.phone-menu button {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 44px;
  padding: 0 16px;
  font-size: 17px;
  text-align: start;
}

.phone-menu button + button::before {
  position: absolute;
  inset: 0 0 auto;
  height: 0.5px;
  content: '';
  background: var(--separator);
}

.phone-menu button.accent {
  font-weight: 600;
  color: var(--accent);
}

.phone-menu button.danger {
  color: var(--danger-solid);
}

.phone-menu .gap {
  height: 8px;
  background: var(--fill);
}

/* Sheets: every menu on the phone, rising from the bottom under the thumb. They share one layer, so one opened from another lands on top of it. */
.sheet-scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--scrim);
  animation: fade 240ms var(--ease) both;
}

.sheet {
  position: fixed;
  inset: auto 0 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  max-height: calc(100% - var(--top) - 10px);
  padding: 0 16px calc(var(--bottom) + 12px);
  background: var(--sheet);
  border-radius: 14px 14px 0 0;
  transition:
    transform 280ms var(--ease),
    bottom 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
  animation: sheet 360ms var(--ease) both;
}

.sheet.dragging {
  transition: none;
}

/* The web view does not shrink for the keyboard, so a sheet with a field in it stands on the keys rather than under them. */
html.keyboard .sheet {
  bottom: var(--keyboard);
  max-height: calc(100% - var(--top) - 10px - var(--keyboard));
  padding-bottom: 12px;
}

@keyframes sheet {
  from {
    transform: translateY(100%);
  }
}

.sheet-grab {
  display: flex;
  flex: none;
  flex-direction: column;
  align-items: center;
  padding-top: 6px;
  cursor: grab;
  touch-action: none;
}

.sheet-handle {
  width: 36px;
  height: 5px;
  margin-bottom: 10px;
  background: var(--fill-strong);
  border-radius: 3px;
}

.sheet-title {
  padding: 0 16px 12px;
  font-size: 13px;
  color: var(--text-faint);
  text-align: center;
}

.sheet-body {
  min-height: 0;
  overflow-y: auto;
}

.sheet-list {
  overflow: hidden;
  background: var(--bg-raised);
  border-radius: 12px;
}

.sheet-body + .sheet-list,
.sheet-field + .sheet-list {
  margin-top: 10px;
}

.sheet-option {
  position: relative;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 50px;
  padding: 9px 16px;
  font-size: 17px;
  text-align: start;
}

.sheet-option + .sheet-option::before {
  position: absolute;
  top: 0;
  inset-inline: 16px 0;
  height: 0.5px;
  content: '';
  background: var(--separator);
}

.sheet-option > svg {
  flex: none;
  color: var(--accent);
}

.sheet-words {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.sheet-words .says {
  margin-top: 1px;
  font-size: 13px;
  color: var(--text-faint);
}

.sheet-option.danger {
  color: var(--danger);
}

.sheet-option.sheet-cancel {
  justify-content: center;
  font-weight: 600;
  color: var(--accent);
}

/* The menu's note on the phone, split into lines as `.menu-note` is. */
.sheet-note {
  margin: 7px 16px 0;
  font-size: 13px;
  color: var(--text-faint);
  white-space: pre-line;
}

.sheet-field {
  display: flex;
  align-items: center;
  background: var(--bg-raised);
  border-radius: 12px;
}

.sheet-field input {
  flex: 1;
  min-width: 0;
  padding: 11px 16px;
  color: var(--text);
  background: none;
  border: 0;
  outline: none;
}

.sheet-field-clear {
  display: grid;
  flex: none;
  place-items: center;
  width: 18px;
  height: 18px;
  margin: 0 12px 0 -4px;
  padding: 0;
  color: var(--bg-raised);
  background: var(--text-faint);
  border: 0;
  border-radius: 50%;
}

/* Centred in what the keyboard leaves of the screen, as the system's alerts are. */
.rename-alert-scrim {
  position: fixed;
  inset: 0 0 var(--keyboard, 0px);
  z-index: 60;
  display: grid;
  place-items: center;
  background: var(--scrim);
  animation: fade 200ms var(--ease) both;
}

.rename-alert {
  width: 290px;
  overflow: hidden;
  text-align: center;
  background: var(--sheet);
  border-radius: 14px;
  animation: rename-alert 200ms var(--ease) both;
}

@keyframes rename-alert {
  from {
    transform: scale(1.1);
    opacity: 0;
  }
}

.rename-alert-text {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 19px 16px 16px;
}

.rename-alert-title {
  font-size: 17px;
  font-weight: 600;
}

.rename-alert-note {
  font-size: 13px;
  color: var(--text-dim);
}

.rename-alert .sheet-field {
  margin-top: 8px;
  border-radius: 8px;
}

.rename-alert .sheet-field input {
  padding: 8px 10px;
  font-size: 16px;
}

.rename-alert-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-top: 0.5px solid var(--separator);
}

.rename-alert-actions button {
  height: 44px;
  padding: 0;
  font-size: 17px;
  color: var(--accent);
  background: none;
  border: 0;
}

.rename-alert-actions button + button {
  border-left: 0.5px solid var(--separator);
}

.rename-alert-actions button.default {
  font-weight: 600;
}

.rename-alert-actions button:disabled {
  color: var(--text-faint);
}

/* New task: a sheet almost the height of the screen, the way Mail's new message is. */
.phone-task {
  position: fixed;
  inset: calc(var(--top) + 10px) 0 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  background: var(--sheet);
  border-radius: 14px 14px 0 0;
  transition: transform 280ms var(--ease);
  animation: sheet 360ms var(--ease) both;
}

.phone-task.dragging {
  transition: none;
}

.phone-task-bar {
  display: grid;
  flex: none;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  height: 52px;
  padding: 0 8px;
  touch-action: none;
}

.phone-task-bar b {
  overflow: hidden;
  font-size: 17px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.phone-task-bar button {
  height: 44px;
  padding: 0 8px;
  font-size: 17px;
  color: var(--accent);
  justify-self: start;
}

.phone-task-bar button.strong {
  font-weight: 600;
  justify-self: end;
}

.phone-task-bar button:disabled {
  color: var(--text-faint);
}

.phone-task-form {
  flex: 1;
  min-height: 0;
  padding: 8px 16px calc(var(--bottom) + 16px);
  overflow-y: auto;
  overscroll-behavior: contain;
}

.phone-task-form:has(> .file-view-page) {
  padding: 0;
  overflow: hidden;
}

.file-view-page {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
}

.file-view-said {
  margin: 24px 0;
  color: var(--text-faint);
  text-align: center;
}

.file-view-prose {
  padding-bottom: 16px;
}

/* A file is read, not glanced at: the text fills the sheet edge to edge, with no box around it. */

.phone-task-form:has(> .file-view-text) {
  padding: 0 0 var(--bottom);
}

.file-view-text {
  padding: 4px 16px 24px;
  margin: 0;
  font-family: var(--font-code);
  font-size: 12.5px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: text;
}

.phone-task-bar .file-view-copy {
  width: 44px;
  justify-self: end;
  justify-content: center;
}

.phone-task-bar .file-view-copy svg {
  width: 19px;
  height: 19px;
}

.phone-task-label {
  margin: 16px 16px 6px;
  font-size: 13px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.phone-task-label:first-child {
  margin-top: 4px;
}

.phone-task-cell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 44px;
  padding: 0 16px;
  font-size: 17px;
  background: var(--bg-raised);
  border-radius: 12px;
}

.phone-task-cell span {
  display: flex;
  gap: 4px;
  align-items: center;
  color: var(--text-faint);
}

.phone-task-text,
.phone-task-goal {
  width: 100%;
  padding: 11px 16px;
  line-height: 22px;
  color: var(--text);
  resize: none;
  background: var(--bg-raised);
  border: 0;
  border-radius: 12px;
  outline: none;
}

.phone-task-text {
  min-height: 132px;
}

.phone-task-note {
  margin: 7px 16px 0;
  font-size: 13px;
  color: var(--text-faint);
}

/* New task and Question on the phone: the text fills the sheet as a note does, and what adds to it rides on the keyboard, as in Notes and Mail. */
.phone-compose .phone-task-form {
  display: flex;
  flex-direction: column;
  padding: 8px 16px 12px;
}

.phone-compose .phone-task-group {
  flex: none;
  overflow: hidden;
  background: var(--bg-raised);
  border-radius: 12px;
}

.phone-compose .phone-task-cell {
  position: relative;
  background: none;
  border-radius: 0;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 44px;
  padding: 0 16px;
  font-size: 17px;
  color: var(--text);
}

.phone-compose .phone-task-cell + .phone-task-cell::before {
  position: absolute;
  top: 0;
  inset-inline: 16px 0;
  height: 0.5px;
  content: '';
  background: var(--separator);
}

.phone-compose .phone-task-goal {
  flex: 1;
  width: auto;
  min-width: 0;
  padding: 0;
  height: 44px;
  font-size: 17px;
  color: var(--text);
  text-align: end;
  background: none;
  border: 0;
  outline: none;
}

.phone-compose .phone-task-goal::placeholder {
  color: var(--text-faint);
}

.phone-compose .phone-task-text {
  flex: 1;
  width: 100%;
  min-height: 120px;
  margin-top: 14px;
  padding: 0;
  font-size: 17px;
  line-height: 22px;
  color: var(--text);
  resize: none;
  background: none;
  border: 0;
  outline: none;
}

.phone-compose .phone-task-form > .phone-task-text:first-child {
  margin-top: 4px;
}

.phone-compose .phone-task-text::placeholder {
  color: var(--text-faint);
}

/* Rides on the keyboard while it is up, and on the home indicator when it is not. */
.phone-task-tools {
  display: flex;
  flex: none;
  gap: 4px;
  align-items: center;
  padding: 4px 8px var(--bottom);
  background: var(--sheet);
  box-shadow: 0 -0.5px 0 var(--separator);
}

html.keyboard .phone-task-tools {
  padding-bottom: 4px;
  margin-bottom: var(--keyboard, 0px);
}

.phone-task-tools button {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  color: var(--accent);
  border-radius: 22px;
}

.phone-task-tools button.on {
  color: var(--danger);
}

html.phone .phone-task-tools button.spoken {
  position: static;
  width: auto;
  min-width: 44px;
  height: 44px;
  font-size: 13px;
}

html.phone .phone-task-tools button.spoken:disabled {
  color: var(--text-faint);
}

.phone-task-tools-note {
  flex: 1;
  min-width: 0;
  padding-inline-end: 8px;
  font-size: 13px;
  color: var(--text-faint);
  text-align: end;
}

.phone-task .pending {
  padding: 10px 0 0;
}

/* The conversation, pushed in from the right over the board. */
html.phone .talk.over {
  inset: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  border: 0;
  border-radius: 0;
  box-shadow: -8px 0 30px var(--fill-strong);
  transition: transform 280ms var(--ease);
  animation: push 320ms var(--ease) both;
}

@keyframes push {
  from {
    transform: translateX(100%);
  }
}

.phone-edge {
  position: absolute;
  inset-block: 0;
  left: 0;
  z-index: 4;
  width: 20px;
  touch-action: none;
}

.phone-nav {
  position: relative;
  z-index: 2;
  display: grid;
  flex: none;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  min-height: calc(var(--top) + 52px);
  padding: var(--top) 4px 0;
  background: var(--glass);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 0.5px 0 var(--separator);
}

.phone-back {
  display: flex;
  gap: 2px;
  align-items: center;
  height: 44px;
  padding: 0 10px 0 4px;
  font-size: 17px;
  color: var(--accent);
  justify-self: start;
}

.phone-nav-end {
  display: flex;
  justify-self: end;
}

.phone-nav-title {
  min-width: 0;
  max-width: 220px;
  text-align: center;
}

.phone-nav-title b {
  display: block;
  overflow: hidden;
  font-size: 17px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.phone-nav-title span {
  font-size: 12px;
  color: var(--text-faint);
}

.phone-nav .phone-icon {
  justify-self: end;
}

html.phone .transcript {
  padding: 16px 0 24px;
  overscroll-behavior: contain;
}

html.phone .turn {
  padding: 0 16px;
}

html.phone .mine {
  width: fit-content;
  max-width: 82%;
  margin-inline-start: auto;
  padding: 9px 14px;
  border-radius: 20px;
}

html.phone .prose {
  font-size: 17px;
  line-height: 1.45;
}

/* A question waiting for an answer stays in reach at the foot of the conversation while the rest scrolls under it. */
html.phone .talk.asks .turn:has(> .card:not(.answered)) {
  position: sticky;
  bottom: 8px;
  z-index: 2;
}

/* The composer under a docked card waits: the card is what needs answering first. */
html.phone .talk.asks .composer {
  pointer-events: none;
  opacity: 0.45;
}

html.phone .card:not(.answered) {
  padding: 16px;
  border: 0;
  border-radius: 18px;
  box-shadow: var(--lift);
}

html.phone .card .card-title {
  font-size: 17px;
  font-weight: 600;
}

html.phone .card .where {
  font-size: 13px;
}

html.phone .card .card-actions {
  display: grid;
  gap: 8px;
}

html.phone .card .card-actions button {
  height: 50px;
  font-size: 17px;
  font-weight: 600;
  border-radius: 12px;
}

html.phone .card .card-actions input {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 12px;
}

html.phone .composer {
  padding: 8px 10px calc(var(--bottom) + 8px);
  background: var(--glass);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 -0.5px 0 var(--separator);
}

/* With the keyboard up the home indicator is under it, so its inset would only be a gap above the keys. */
html.phone.keyboard .composer {
  padding-bottom: 8px;
}

/* As in Messages: a round photo button beside one round field with Send inside it, and above them the phrases and then mode, tasks and goal, each one row of filled capsules that runs to the screen's edges and scrolls sideways. */
html.phone .composer-inner {
  display: grid;
  grid-template-columns: 36px 1fr;
  column-gap: 8px;
  align-items: end;
  background: none;
  border: 0;
  border-radius: 0;
}

html.phone .composer-inner > * {
  grid-column: 1 / -1;
}

html.phone .composer-inner > .photo-pick {
  grid-column: 1;
}

html.phone .composer-inner > textarea {
  grid-column: 2;
}

/* The field has no frame on the phone, so the pictures line up with the photo button rather than sit inside a box that is not drawn. */
html.phone .composer-inner > .pending {
  padding: 6px 0 8px;
}

html.phone .composer-inner:focus-within {
  box-shadow: none;
}

html.phone .composer-inner textarea {
  min-height: 40px;
  padding: 8px 48px 8px 16px;
  line-height: 22px;
  background: var(--field);
  border: 1px solid var(--separator);
  border-radius: 20px;
  scrollbar-width: none;
  transition: border-color 0.2s;
}

/* Beside the photo button a long placeholder would take two lines, so it ends in an ellipsis instead. */
html.phone .composer-inner textarea::placeholder {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

html.phone .composer-inner textarea:focus {
  border-color: var(--fill-strong);
}

html.phone .photo-pick {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  margin-bottom: 2px;
  padding: 0;
  color: var(--text-dim);
  background: var(--fill);
  border: 0;
  border-radius: 18px;
}

html.phone .photo-pick:active {
  background: var(--fill-strong);
}

html.phone .phrases,
html.phone .composer-bar {
  flex-wrap: nowrap;
  gap: 6px;
  margin: 0 -10px;
  padding: 0 10px 8px;
  overflow-x: auto;
  scrollbar-width: none;
}

html.phone .phrases::-webkit-scrollbar,
html.phone .composer-bar::-webkit-scrollbar {
  display: none;
}

html.phone .composer-bar {
  order: -1;
}

html.phone .phrase,
html.phone .composer-bar .picker {
  flex: none;
  height: 30px;
  padding: 0 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  background: var(--fill);
  border: 0;
  border-radius: 15px;
}

html.phone .phrase {
  max-width: 240px;
  color: var(--accent);
  background: var(--accent-soft);
}

html.phone .phrase.keep {
  width: 30px;
  padding: 0;
  justify-content: center;
  color: var(--text-dim);
  background: none;
  border: 1px dashed var(--border-strong);
}

html.phone .phrase:active,
html.phone .composer-bar .picker:active {
  background: var(--fill-strong);
}

html.phone .composer-bar .goal-picker {
  max-width: 220px;
  color: var(--accent);
  background: var(--accent-soft);
}

html.phone .composer-bar .spacer,
html.phone .composer-hint {
  display: none;
}

/* On the phone the whole block has no border, so a command marks the field itself. */
html.phone .composer-inner.command,
html.phone .composer-inner.command:focus-within {
  border: 0;
  box-shadow: none;
}

html.phone .composer-inner.command textarea {
  font-size: 16px;
  border-color: var(--warning-text);
  box-shadow: 0 0 0 3px var(--warning-bg);
}

.phone-hint {
  order: -1;
  padding: 0 16px 6px;
  font-size: 13px;
  color: var(--text-faint);
}

.phone-hint.command {
  color: var(--warning-text);
}

/* A thumb edits, starts elsewhere or cancels a queued message, and Safari zooms into an edit field under 16px. */
html.phone .queued-head {
  font-size: 13px;
}

/* Two rows and part of a third, so a longer queue shows it scrolls and the transcript keeps the screen. */
html.phone .queued-list {
  max-height: 112px;
}

html.phone .queued-one {
  gap: 4px;
  padding: 4px 4px 4px 14px;
  font-size: 15px;
  border-radius: 12px;
}

html.phone .queued-picture {
  width: 36px;
  height: 36px;
  border-radius: 8px;
}

html.phone .queued-edit {
  font-size: 17px;
}

html.phone .queued-one .icon-button {
  width: 36px;
  height: 36px;
}

/* Held to the field's last line, and not clipped by the chip row it sits in, which is not what it is placed against. */
html.phone .send {
  position: absolute;
  right: 4px;
  bottom: 4px;
  width: 32px;
  height: 32px;
  border-radius: 16px;
}

html.phone .send.stop {
  color: var(--text);
  background: var(--fill-strong);
}

html.phone .send:disabled {
  color: var(--bg-raised);
  background: var(--fill-strong);
}

html.phone .send.listening {
  color: var(--danger-text);
  background: var(--danger-solid);
  animation: breathe 1.6s ease-in-out infinite;
}

/* The language dictation listens in, beside the mic, so a task in the other language is one press away. */
html.phone .spoken {
  position: absolute;
  right: 40px;
  bottom: 4px;
  min-width: 32px;
  height: 32px;
  padding: 0 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  border-radius: 16px;
}

html.phone .composer-inner:has(.spoken) textarea {
  padding-right: 80px;
}

html.phone .send.mic.beside {
  right: 40px;
  color: var(--accent);
  background: none;
}

html.phone .spoken.beside {
  right: 76px;
}

html.phone .composer-inner:has(.spoken.beside) textarea {
  padding-right: 116px;
}

/* Notices come down from the top as the system's banners do, newest first, and are pushed back up to put them away. */
html.phone .notices {
  top: calc(var(--top) + 6px);
  right: 8px;
  left: 8px;
  width: auto;
  gap: 6px;
}

html.phone .notice.banner {
  gap: 12px;
  align-items: center;
  padding: 12px 16px 12px 12px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  background: var(--glass);
  backdrop-filter: saturate(180%) blur(30px);
  -webkit-backdrop-filter: saturate(180%) blur(30px);
  border: 0;
  border-radius: 24px;
  box-shadow: var(--lift);
  transition:
    transform 320ms var(--ease),
    opacity 320ms var(--ease);
  animation: banner 420ms var(--ease) backwards;
}

html.phone .notice.banner:active:not(.leaving) {
  background: var(--bg-raised);
}

html.phone .notice.banner.leaving {
  opacity: 0;
  pointer-events: none;
}

html.phone .banner-icon {
  position: relative;
  display: grid;
  flex: none;
  place-items: center;
  width: 38px;
  height: 38px;
  color: #fff;
  background: var(--fill-strong);
  border-radius: 10px;
}

html.phone .banner-icon::after {
  position: absolute;
  right: -3px;
  bottom: -3px;
  width: 12px;
  height: 12px;
  content: '';
  background: var(--accent);
  border: 2.5px solid var(--bg-raised);
  border-radius: 50%;
}

html.phone .notice.banner.asks .banner-icon::after {
  background: var(--warning-text);
}

html.phone .notice.banner.plain .banner-icon::after {
  display: none;
}

html.phone .notice.banner .lines {
  gap: 1px;
}

html.phone .banner-head {
  display: flex;
  gap: 8px;
  align-items: baseline;
}

html.phone .banner-what {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  white-space: nowrap;
  text-overflow: ellipsis;
}

html.phone .notice.banner.done .banner-what {
  color: var(--accent);
}

html.phone .notice.banner.asks .banner-what {
  color: var(--warning-text);
}

html.phone .banner-project {
  font-weight: 400;
  color: var(--text-dim);
}

html.phone .banner-when {
  flex: none;
  font-size: 13px;
  color: var(--text-dim);
}

html.phone .notice.banner .title {
  overflow: hidden;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  text-overflow: ellipsis;
}

html.phone .notice.banner .body {
  display: -webkit-box;
  font-size: 15px;
  line-height: 1.3;
  white-space: normal;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

@keyframes banner {
  from {
    transform: translateY(-140%);
  }
}

/* The link to the Mac is down; a pill says so, and goes once the page is back on a new link. On the board it sits at the foot, clear of the large title; in a conversation, under the bar, clear of the field. */
.phone-offline {
  position: fixed;
  bottom: calc(var(--bottom) + 16px);
  left: 50%;
  z-index: 55;
  height: 32px;
  padding: 0 14px;
  font-size: 13px;
  line-height: 32px;
  color: var(--text-dim);
  white-space: nowrap;
  background: var(--bg-raised);
  border-radius: 16px;
  box-shadow: var(--shadow);
  transform: translateX(-50%);
  animation: fade var(--settle) var(--ease) both;
}

body:has(.talk.over:not([hidden])) .phone-offline {
  top: calc(var(--top) + 60px);
  bottom: auto;
}

.phone-spin {
  flex: none;
  width: 14px;
  height: 14px;
  border: 2px solid var(--fill-strong);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 800ms linear infinite;
}

/* The Mac's screen: black edge to edge, with the bars above and below the picture rather than over it, so nothing of it is covered. */
.phone-screen {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: flex;
  flex-direction: column;
  color: var(--screen-text);
  background: var(--screen);
  animation: fade var(--settle) var(--ease) both;
}

.phone-screen-stage {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
}

.phone-screen-video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transform-origin: 0 0;
}

.phone-screen-note {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
  justify-content: center;
  padding: 0 32px;
  font-size: 15px;
  line-height: 1.4;
  text-align: center;
}

.phone-screen-note .phone-button {
  flex: none;
}

.phone-screen-note .phone-spin {
  width: 22px;
  height: 22px;
  border-width: 2.5px;
}

.phone-screen-bar {
  display: flex;
  flex: none;
  gap: 8px;
  align-items: center;
  padding: calc(var(--top) + 2px) max(8px, env(safe-area-inset-right)) 2px max(16px, env(safe-area-inset-left));
}

.phone-screen-bar.hidden {
  display: none;
}

.phone-screen-title {
  display: flex;
  flex: none;
  gap: 8px;
  align-items: center;
  font-size: 17px;
  font-weight: 600;
}

.phone-screen-live {
  padding: 1px 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--on-solid);
  background: var(--danger-solid);
  border-radius: 4px;
}

/* Look or Control, drawn light on the black whatever the theme. */
.phone-screen-seg {
  flex: 0 1 180px;
  margin: 0 0 0 8px;
  background: rgb(255 255 255 / 12%);
}

.phone-screen-seg .phone-seg-thumb {
  width: calc((100% - 4px) / 2);
  background: rgb(255 255 255 / 24%);
  box-shadow: none;
}

.phone-screen-done {
  flex: none;
  height: 44px;
  padding: 0 10px;
  font-size: 17px;
  font-weight: 600;
  color: var(--screen-text);
}

.phone-screen-done.icon {
  display: grid;
  place-items: center;
  width: 40px;
  padding: 0;
}

.phone-screen-peek {
  position: absolute;
  top: calc(var(--top) + 6px);
  right: max(12px, env(safe-area-inset-right));
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  color: var(--screen-text);
  background: var(--screen-bar);
  border-radius: 16px;
}

/* How the trackpad is worked, until the first touch. */
.phone-screen-hint {
  position: absolute;
  right: 16px;
  bottom: 16px;
  left: 16px;
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.4;
  text-align: center;
  pointer-events: none;
  background: var(--screen-bar);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 12px;
}

/* Why the Mac would not be worked from here, over the top of the picture until pressed away. */
.phone-screen-refused {
  position: absolute;
  top: 12px;
  right: 12px;
  left: 12px;
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.4;
  color: var(--screen-text);
  text-align: left;
  background: var(--screen-bar);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 12px;
}

/* Only there to bring up the phone's keyboard; 16px so the phone does not zoom in on it. */
.phone-screen-typing {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 1px;
  height: 1px;
  font-size: 16px;
  opacity: 0;
  resize: none;
}

/* The keys the phone's keyboard has not got, along the bottom and over the keyboard once it is up; a modifier stays down for the next key. */
.phone-screen-keys {
  display: flex;
  flex: none;
  gap: 6px;
  padding: 6px max(8px, env(safe-area-inset-right)) max(6px, var(--bottom)) max(8px, env(safe-area-inset-left));
  margin-bottom: var(--keyboard, 0px);
  overflow-x: auto;
  scrollbar-width: none;
}

.phone-screen-keys.hidden {
  display: none;
}

.phone-screen-key {
  display: grid;
  flex: 1 0 36px;
  place-items: center;
  height: 40px;
  font-size: 16px;
  color: var(--screen-text);
  background: rgb(255 255 255 / 14%);
  border-radius: 8px;
}

.phone-screen-key.on {
  color: #000000;
  background: var(--screen-text);
}

/* The Background sheet on a phone: the name has the width to itself, and what it cost and how it stands stand under it. */
html.phone .task-row {
  flex-wrap: wrap;
  row-gap: 2px;
}

html.phone .task-row .what {
  flex: 1 0 calc(100% - 26px);
  white-space: normal;
}

html.phone .task-row .lasted {
  margin-inline-start: 26px;
}

html.phone .task-row .how {
  min-width: 0;
  text-align: start;
}

/* The Background window as a sheet on the phone: the list sits in the sheet's own grouped box rather than a dialog of its own. */
.tasks-sheet .dialog.tasks {
  width: auto;
  max-height: none;
  padding: 12px 16px;
  overflow: visible;
  border: 0;
  border-radius: 12px;
  box-shadow: none;
  animation: none;
}

.tasks-sheet .dialog.tasks + .sheet-list {
  margin-top: 10px;
}

/* The large title names the Mac the board is from, and opens the list of Macs this phone is paired with. */
.phone-macs {
  display: flex;
  gap: 6px;
  align-items: center;
  max-width: calc(100% - 32px);
  text-align: start;
}

.phone-macs > svg {
  flex: none;
  margin-top: 4px;
  color: var(--accent);
}

.phone-bar-small,
.phone-macs {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* A Mac in the list: its star, its name that switches to it, and its menu, each a target of its own. */
.phone-mac {
  gap: 0;
  padding: 0;
}

.phone-mac + .phone-mac::before {
  inset-inline-start: 48px;
}

.phone-mac-star,
.phone-mac-more {
  display: grid;
  flex: none;
  place-items: center;
  width: 48px;
  min-height: 50px;
  color: var(--text-faint);
}

.phone-mac.favorite .phone-mac-star {
  color: var(--favorite);
}

.phone-mac.favorite .phone-mac-star svg {
  fill: currentColor;
}

.phone-mac-name {
  display: flex;
  flex: 1;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  min-width: 0;
  min-height: 50px;
  font-size: 17px;
  text-align: start;
}

.phone-mac-name .label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.phone-mac.favorite .phone-mac-name .label {
  font-weight: 600;
}

.phone-mac-name > svg {
  flex: none;
  color: var(--accent);
}

.phone-mac-add,
.sheet-note + .sheet-list {
  margin-top: 10px;
}

/* On the phone a picture takes the whole screen on black, is pinched rather than stepped, and only the close button stays, clear of the notch. */
html.phone .preview {
  background: rgb(0 0 0 / calc(1 - var(--leaving, 0)));
}

html.phone .preview img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 0;
  box-shadow: none;
}

html.phone .preview-bar {
  top: calc(var(--top) + 8px);
  right: 12px;
  padding: 0;
  opacity: calc(1 - var(--leaving, 0) * 2);
  background: rgb(255 255 255 / 16%);
  border: none;
  box-shadow: none;
}

html.phone .preview-bar .zooming {
  display: none;
}

html.phone .preview-bar .icon-button {
  width: 36px;
  height: 36px;
  color: #fff;
  border-radius: 999px;
}

/* ------------------------------------------------------------------ */
/* The welcome a first start opens over the board (docs/ux/welcome.md). */

.welcome {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px 24px;
  background: var(--bg);
  animation: fade var(--settle) var(--ease) both;
}

.welcome-drag {
  position: absolute;
  inset: 0 0 auto;
  height: var(--topbar);
  -webkit-app-region: drag;
}

.welcome-skip {
  position: absolute;
  top: 8px;
  right: 12px;
  padding: 4px 10px;
  color: var(--text-faint);
  border-radius: var(--radius);
}

.welcome-skip:hover {
  color: var(--text);
  background: var(--bg-hover);
}

.welcome-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: min(520px, 100%);
  max-height: calc(100vh - 140px);
  overflow-y: auto;
  animation: lift var(--settle) var(--ease) both;
}

.welcome-card h1 {
  margin: 8px 0 0;
  font-size: 22px;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.welcome-card p {
  margin: 0;
  line-height: 1.5;
  color: var(--text-dim);
}

.welcome-card .field {
  margin: 0;
}

.welcome-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0;
  margin: 0;
  list-style: none;
}

.welcome-list li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  line-height: 1.5;
  color: var(--text-dim);
}

.welcome-list svg {
  flex: none;
  margin-top: 3px;
  color: var(--accent);
}

.welcome-list b {
  color: var(--text);
  font-weight: 600;
}

.welcome-status {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  color: var(--text-dim);
  background: var(--bg-sunken);
  border-radius: var(--radius);
}

.welcome-status.ready {
  color: var(--success-text);
  background: var(--accent-soft);
}

.welcome-status.missing,
.welcome-status.out,
.welcome-status.key {
  color: var(--warning-text);
  background: var(--warning-bg);
}

.welcome-command {
  display: flex;
  align-items: center;
  gap: 8px;
}

.welcome-command code {
  flex: 1;
  min-width: 0;
  padding: 7px 10px;
  overflow-x: auto;
  font-family: var(--font-code);
  font-size: 12px;
  white-space: nowrap;
  user-select: all;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.welcome-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  width: min(520px, 100%);
  margin-top: 24px;
}

.welcome-dots {
  display: flex;
  gap: 6px;
}

.welcome-dots button {
  width: 7px;
  height: 7px;
  padding: 0;
  background: var(--fill-strong);
  border-radius: 50%;
  transition: width var(--settle) var(--ease), background var(--settle) var(--ease);
}

.welcome-dots button.on {
  width: 20px;
  background: var(--accent);
  border-radius: 4px;
}

/* The pictures. Each one's own rules are its last frame, which is what stays with Reduce motion. */

.welcome-art {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 150px;
  overflow: hidden;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}

.welcome-art i {
  display: block;
}

.board-art {
  gap: 12px;
  align-items: stretch;
  padding: 18px 22px;
}

.art-column {
  display: flex;
  flex: none;
  flex-direction: column;
  gap: 6px;
  width: 128px;
}

.art-column span {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-faint);
}

.art-column i {
  height: 30px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  opacity: 0.6;
}

.art-card {
  position: absolute;
  top: 40px;
  left: calc(50% - 206px + 280px);
  display: flex;
  flex-direction: column;
  gap: 5px;
  width: 128px;
  padding: 8px 10px;
  background: var(--bg-raised);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  animation: art-card 4.2s var(--ease) infinite;
}

.art-card b {
  width: 8px;
  height: 8px;
  background: var(--done-solid);
  border-radius: 50%;
  animation: art-status 4.2s var(--ease) infinite;
}

.art-card i {
  width: 90%;
  height: 5px;
  background: var(--fill-strong);
  border-radius: 3px;
}

.art-card i + i {
  width: 55%;
}

@keyframes art-card {
  0%,
  22% {
    left: calc(50% - 206px);
    transform: none;
  }
  30% {
    transform: translateY(-4px) rotate(-2deg);
  }
  38%,
  56% {
    left: calc(50% - 206px + 140px);
    transform: none;
  }
  64% {
    transform: translateY(-4px) rotate(2deg);
  }
  72%,
  100% {
    left: calc(50% - 206px + 280px);
    transform: none;
  }
}

@keyframes art-status {
  0%,
  33% {
    background: var(--accent);
  }
  38%,
  67% {
    background: var(--review-solid);
  }
  72%,
  100% {
    background: var(--done-solid);
  }
}

.terminal-art {
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  gap: 8px;
  padding: 12px 16px;
  font-family: var(--font-code);
  font-size: 12px;
  color: #e8e8ea;
  background: #1c1c1e;
  border-color: #1c1c1e;
}

.art-lights {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.art-lights i {
  width: 10px;
  height: 10px;
  background: #ff5f57;
  border-radius: 50%;
}

.art-lights i:nth-child(2) {
  background: #febc2e;
}

.art-lights i:nth-child(3) {
  background: #28c840;
}

.art-line {
  display: flex;
  gap: 8px;
  white-space: nowrap;
}

.art-prompt {
  color: #5fd068;
}

.art-typed {
  width: calc(var(--chars) * 1ch);
  overflow: hidden;
  border-right: 2px solid transparent;
  animation:
    art-type 1.8s steps(var(--chars)) both,
    art-caret 0.8s step-end 6;
}

.art-answer {
  color: #5fd068;
  animation: fade var(--settle) var(--ease) 1.9s both;
}

@keyframes art-type {
  from {
    width: 0;
  }
}

@keyframes art-caret {
  50% {
    border-color: #e8e8ea;
  }
}

.folder-art {
  gap: 36px;
}

.art-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 170px;
  padding: 10px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.art-list i,
.art-slot {
  height: 18px;
  background: var(--fill);
  border-radius: 4px;
}

.art-slot {
  background: var(--accent-soft);
  animation: art-slot 3.6s var(--ease) infinite;
}

.art-folder {
  position: absolute;
  top: 84px;
  left: calc(50% - 104px);
  display: flex;
  color: var(--accent);
  animation: art-folder 3.6s var(--ease) infinite;
}

@keyframes art-folder {
  0% {
    top: 40px;
    left: calc(50% + 70px);
    opacity: 0;
    transform: scale(1.3);
  }
  15% {
    top: 40px;
    left: calc(50% + 70px);
    opacity: 1;
    transform: scale(1.3);
  }
  50%,
  100% {
    top: 84px;
    left: calc(50% - 104px);
    opacity: 1;
    transform: scale(0.7);
  }
}

@keyframes art-slot {
  0%,
  45% {
    background: var(--fill);
  }
  55%,
  100% {
    background: var(--accent-soft);
  }
}

.keys-art {
  flex-direction: column;
  gap: 14px;
}

.art-keys {
  display: flex;
  align-items: center;
  gap: 6px;
}

.art-keys kbd {
  min-width: 34px;
  padding: 6px 8px;
  font-family: var(--font-ui);
  font-size: 12px;
  text-align: center;
  color: var(--text);
  background: var(--bg-raised);
  border: 1px solid var(--border-strong);
  border-bottom-width: 3px;
  border-radius: var(--radius);
  animation: art-press 4s var(--ease) infinite;
}

.art-keys span {
  width: 64px;
  margin-left: 10px;
  font-size: 12px;
  color: var(--text-faint);
}

.art-keys.art-correct kbd:nth-child(2) {
  animation-delay: 0.25s;
}

.art-keys.art-correct kbd:nth-child(3) {
  animation-delay: 0.5s;
}

.art-keys.art-dictate kbd {
  animation-delay: 2s;
}

.art-keys.art-dictate kbd:nth-child(2) {
  animation-delay: 2.25s;
}

.art-keys.art-dictate kbd:nth-child(3) {
  animation-delay: 2.5s;
}

@keyframes art-press {
  0%,
  100% {
    transform: none;
  }
  4%,
  28% {
    color: var(--accent-text);
    background: var(--accent);
    border-color: var(--accent);
    border-bottom-width: 1px;
    transform: translateY(2px);
  }
  34% {
    transform: none;
  }
}

.phone-art {
  gap: 48px;
}

.art-code {
  display: grid;
  grid-template-columns: repeat(5, 12px);
  gap: 2px;
  padding: 8px;
  background: #ffffff;
  border-radius: 4px;
}

.art-code i {
  height: 12px;

  <span class="said" id="p-said"></span>
