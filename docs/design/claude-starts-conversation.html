<script>
const PATHS = {
  folder: 'M2.5 4.5a1 1 0 0 1 1-1h2.8l1.5 1.7h4.7a1 1 0 0 1 1 1v6.3a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1Z',
  down: 'M4 6.5 8 10.5 12 6.5',
  plus: 'M8 3.5v9M3.5 8h9',
  close: 'M4 4l8 8M12 4l-8 8',
  check: 'M3.5 8.5 6.5 11.5 12.5 4.5',
  spinner: 'M8 2.5a5.5 5.5 0 1 0 5.5 5.5',
  left: 'M10 3.5 5.5 8 10 12.5',
  right: 'M6 3.5 10.5 8 6 12.5',
  more: 'M4 8h.01M8 8h.01M12 8h.01',
  up: 'M8 12.5v-9M4 7.5l4-4 4 4',
}
const icon = (name, size = 14, cls = '') =>
  `<svg ${cls ? `class="${cls}" ` : ''}width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="${name === 'more' ? 2.6 : 1.45}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${PATHS[name]}"/></svg>`
const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const COLORS = { geckit: 0, pinch: 1, trailmap: 5, docs: 3 }
const CLI = '~/.geckit/bin/geckit'

const CONVERSATIONS = {
  trail: {
    title: 'Offline trail pages',
    project: 'trailmap',
    said: 'Make the trail pages work offline: the page, its map tiles and the elevation chart.',
    answer: 'The service worker caches each trail page with its tiles. Three things I found belong in conversations of their own, so I have asked GeckIt for them in one batch and am going on with the chart meanwhile.',
    tasks: [
      {
        project: 'geckit',
        title: 'Fix the flaky upload test',
        text: 'The upload test in client/test/upload.test.ts fails about one run in five on CI: the fake server answers before the listener is attached. Make it wait for the listener, and run the file 50 times to show it holds. The failing runs are in the last three CI builds of main; the log line to look for is "ECONNRESET before listen".',
        goal: 'upload.test.ts passes 50 runs in a row',
      },
      { project: 'pinch', title: 'Honour Retry-After in the client', text: 'trailmap now sends a Retry-After header on 429. Make the pinch client wait for it instead of retrying at once.' },
      { project: 'trailmap', title: 'Cache the elevation charts', text: 'The elevation chart is drawn from /api/elevation on every visit. Cache the response in the service worker next to the tiles, so an offline trail page has its chart too.' },
    ],
  },
  notes: {
    title: 'Release notes 1.18',
    project: 'geckit',
    said: 'Write the release notes for 1.18.',
    answer: 'The changelog is drafted. The README screenshots are out of date, so I have asked for a conversation to take them again.',
    tasks: [{ project: 'geckit', title: 'Take the README screenshots again', text: 'Take the README screenshots again from the demo copy of the app: the board head changed in 1.18.' }],
  },
}
const OTHERS = [
  { id: 'o1', title: 'Tray icon blurry on Retina', project: 'geckit', at: '25m', column: 1, stands: 'The template image is drawn at 16 and 32 px now.' },
  { id: 'o2', title: 'Upgrade to Next.js 16', project: 'pinch', at: 'Sun', column: 2, stands: 'Builds and the e2e suite passes on 16.0.2.' },
]
const STATUS = { working: ['said-working', 'working'], review: ['said-review', 'in review'], blocked: ['said-asks', 'blocked'], done: ['said-done', 'done'] }

let batches, children, macOpen, phoneOpenOn, macFront, phoneOpen, pushed, notified, dismissed, returned, sent, focusAfter
function reset() {
  batches = []
  children = []
  macOpen = undefined
  phoneOpenOn = 'o1'
  macFront = true
  phoneOpen = true
  pushed = false
  notified = []
  dismissed = new Set()
  returned = []
  sent = 0
  say('Press "Claude asks for 3". Approving is one press: "Start all" on the notice. Press the notice itself to open the conversation at its request.')
  syncToggles()
  draw()
}

function send(from) {
  const id = `b${sent++}`
  const tasks = CONVERSATIONS[from].tasks.map((t, i) => ({ ...t, id: `${id}t${i}`, n: i + 1, ticked: true, open: false, note: '' }))
  batches.push({ id, from, tasks, reply: '', replying: false, state: 'waiting' })
  if (!macFront) notified.push(id)
  pushed = false
}

const waiting = () => batches.filter((b) => b.state === 'waiting')
const batchOf = (id) => batches.find((b) => b.id === id)
const taskOf = (id) => batches.flatMap((b) => b.tasks).find((t) => t.id === id)
const ticked = (b) => b.tasks.filter((t) => t.ticked)
const conv = (b) => CONVERSATIONS[b.from]
const projects = (b) => [...new Set(b.tasks.map((t) => t.project))].join(', ')
const many = (n) => (n === 1 ? 'a conversation' : `${n} conversations`)
const primaryLabel = (b) => (b.tasks.length === 1 ? 'Start' : ticked(b).length === b.tasks.length ? 'Start all' : `Start ${ticked(b).length} of ${b.tasks.length}`)

function answer(id, how, where) {
  const b = batchOf(id)
  if (b === undefined || b.state !== 'waiting') return
  b.state = 'answered'
  b.where = where
  for (const t of b.tasks) {
    t.started = how === 'start' && t.ticked
    if (t.started) {
      const child = { id: `c${children.length}`, title: t.title, project: t.project, parent: b.from, status: 'working' }
      children.push(child)
      t.child = child.id
    }
  }
  notified = notified.filter((one) => one !== id)
  const lines = b.tasks.map((t) => (t.started ? `${t.n} Started ${t.child}-4f1d8e2a...${t.note.trim() ? `: ${t.note.trim()}` : ''}` : `${t.n} Refused`))
  if (b.reply.trim()) lines.push(`Reply: ${b.reply.trim()}`)
  returned.unshift({ head: `printed to ${conv(b).title}`, lines })
  const n = b.tasks.filter((t) => t.started).length
  say(n === 0 ? `Refused on the ${where}. The command prints it, with the reply if one was typed.` : `Answered on the ${where}: ${n} started, In progress and "From ${conv(b).title}". Nothing opened. The command prints every answer at once.`)
  draw()
}

function say(text) {
  document.getElementById('p-said').textContent = text
}

// The block, the same on both devices; the phone's rules make it bigger.

function blockHtml(b, here) {
  if (b.state !== 'waiting') {
    const n = b.tasks.filter((t) => t.started).length
    const head =
      b.state === 'withdrawn'
        ? 'Claude stopped waiting for these.'
        : n === 0
          ? b.tasks.length === 1 ? 'Refused' : `Refused all ${b.tasks.length}`
          : n === b.tasks.length ? `Started ${n}` : `Started ${n} of ${b.tasks.length}`
    const elsewhere = b.state === 'answered' && b.where !== here ? ` on the ${b.where}` : ''
    return `<div class="card request answered-block">
      <div class="card-title"><span class="glyph">${icon(b.state === 'withdrawn' ? 'close' : 'check', 12)}</span>${head}${elsewhere}</div>
      <div class="request-rows">${b.tasks
        .map((t) => {
          const child = children.find((c) => c.id === t.child)
          const said = child === undefined ? `<span class="request-status refused">${b.state === 'withdrawn' ? 'not started' : 'refused'}</span>` : `<span class="request-status state-said ${STATUS[child.status][0]}"><span class="state-dot"></span>${STATUS[child.status][1]}</span>`
          return `<div class="request-row"><div class="request-line"><button type="button" class="request-open"${child === undefined ? ' disabled' : ` data-go="${child.id}"`}><span class="tinted" style="--tint: var(--project-${COLORS[t.project]})">${t.project}</span><span class="title">${esc(t.title)}</span></button>${said}</div></div>`
        })
        .join('')}</div>
      ${b.reply.trim() && b.state === 'answered' ? `<div class="request-replied">You replied: ${esc(b.reply.trim())}</div>` : ''}
    </div>`
  }
  const one = b.tasks.length === 1
  return `<div class="card request" data-block="${b.id}" role="group" aria-label="Claude wants to start ${many(b.tasks.length)}">
    <div class="card-title">Claude wants to start ${many(b.tasks.length)}</div>
    <div class="request-rows">${b.tasks
      .map(
        (t) => `<div class="request-row${t.open ? ' open' : ''}${t.ticked ? '' : ' off'}">
        <div class="request-line">
          ${one ? '' : `<input type="checkbox" ${t.ticked ? 'checked' : ''} data-tick="${t.id}" aria-label="Start ${esc(t.title)}" />`}
          <button type="button" class="request-open" data-open="${t.id}" aria-expanded="${t.open}">
            <span class="tinted" style="--tint: var(--project-${COLORS[t.project]})">${t.project}</span>
            <span class="title">${esc(t.title)}</span>
            ${icon('right', 12, 'chevron')}
          </button>
        </div>
        ${
          t.open
            ? `<div class="request-more"${one ? ' style="padding-left: 12px"' : ''}>
          <div class="prompt">${esc(t.text)}</div>
          ${t.goal === undefined ? '' : `<div class="goal">Goal: ${esc(t.goal)}</div>`}
          <input type="text" placeholder="Note for this conversation" data-note="${t.id}" value="${esc(t.note)}" />
        </div>`
            : ''
        }
      </div>`,
      )
      .join('')}</div>
    ${b.replying ? `<div class="request-reply"><input type="text" placeholder="Reply to Claude (optional)" data-reply="${b.id}" value="${esc(b.reply)}" /></div>` : ''}
    <div class="card-actions">
      ${b.replying ? '' : `<button type="button" class="quiet reply-toggle" data-replying="${b.id}">Reply to Claude</button>`}
      <span class="spacer"></span>
      <button type="button" class="quiet" data-refuse="${b.id}" data-where="${here}">${one ? 'Refuse' : 'Refuse all'}</button>
      <button type="button" class="primary" data-start="${b.id}" data-where="${here}" ${ticked(b).length === 0 ? 'disabled' : ''}>${primaryLabel(b)}</button>
    </div>
  </div>`
}

function transcriptOf(from, here) {
  const c = CONVERSATIONS[from]
  const mine = batches.filter((b) => b.from === from)
  return `<div class="turn"><div class="mine">${esc(c.said)}</div></div>
    ${mine.length === 0 ? '' : `<div class="turn"><div class="theirs"><p>${esc(c.answer)}</p></div></div>`}
    ${mine
      .map(
        (b) => `<div class="turn step"><button type="button" class="did" disabled><span class="glyph${b.state === 'waiting' ? ' spinning' : ''}">${icon(b.state === 'waiting' ? 'spinner' : 'check', 12)}</span><span class="what">${CLI} start --tasks tasks.json</span></button></div>
      <div class="turn">${blockHtml(b, here)}</div>`,
      )
      .join('')}`
}

function childTranscript(child) {
  const t = batches.flatMap((b) => b.tasks).find((one) => one.child === child.id)
  return `<div class="turn"><div class="mine">${esc(t.text)}${t.note.trim() ? `\n\nAlex: ${esc(t.note.trim())}` : ''}</div></div>
    <div class="turn"><div class="theirs"><p>Looking at it now.</p></div></div>`
}

// The board: the asker's state and its children's counts; a child's parent.

function boardCards() {
  const cards = []
  for (const c of [...children].reverse()) {
    const column = c.status === 'review' || c.status === 'blocked' ? 1 : c.status === 'done' ? 2 : 0
    cards.push({ id: c.id, title: c.title, project: c.project, at: 'now', column, parent: c.parent, state: c.status === 'working' ? ['said-working', 'Claude is working'] : undefined, stands: c.status === 'working' ? 'Working' : 'Finished.' })
  }
  for (const [key, c] of Object.entries(CONVERSATIONS)) {
    const asks = waiting().filter((b) => b.from === key)
    const kids = children.filter((one) => one.parent === key)
    const counts = Object.entries(STATUS)
      .map(([status, [, words]]) => [kids.filter((k) => k.status === status).length, words])
      .filter(([n]) => n > 0)
      .map(([n, words]) => `${n} ${words}`)
      .join(', ')
    cards.push({
      id: key,
      title: c.title,
      project: c.project,
      at: key === 'trail' ? '2m' : '9m',
      column: 0,
      state: asks.length > 0 ? ['said-asks', 'Asking you'] : batches.some((b) => b.from === key) ? ['said-working', 'Claude is working'] : undefined,
      stands: asks.length > 0 ? `Wants to start ${many(asks.reduce((n, b) => n + b.tasks.length, 0))}` : key === 'trail' ? 'Working - drawing the chart offline' : 'The changelog is drafted.',
      kids: kids.length === 0 ? undefined : `Started ${kids.length} - ${counts}`,
    })
  }
  return [...cards, ...OTHERS]
}

function drawBoard() {
  const cards = boardCards()
  return ['In progress', 'In review', 'Done']
    .map((title, i) => {
      const rows = cards.filter((c) => c.column === i)
      return `<div class="board-column">
      <div class="board-column-head">${title}<span class="spacer"></span><span class="count">${rows.length}</span></div>
      <div class="board-cards"><div class="board-day">${rows
        .map(
          (c) => `<div class="board-card" role="button" tabindex="0" data-go="${c.id}">
          <div class="board-card-head"><span class="board-card-title">${esc(c.title)}</span><span class="changed">${c.at}</span></div>
          <div class="board-card-foot"><span class="tinted" style="--tint: var(--project-${COLORS[c.project]})">${c.project}</span><span class="spacer"></span></div>
          ${c.parent === undefined ? '' : `<div class="board-card-from">From <button type="button" data-go="${c.parent}">${esc(CONVERSATIONS[c.parent].title)}</button></div>`}
          ${c.state ? `<div class="board-card-state"><span class="state-said ${c.state[0]}"><span class="state-dot"></span>${c.state[1]}</span></div>` : ''}
          ${c.stands ? `<div class="board-card-stands"><span>${esc(c.stands)}</span></div>` : ''}
          ${c.kids ? `<div class="board-card-kids"><button type="button" data-go="${c.id}">${esc(c.kids)}</button></div>` : ''}
        </div>`,
        )
        .join('')}</div></div></div>`
    })
    .join('')
}

function noticeTitle(b) {
  return b.tasks.length === 1 ? `Wants to start a conversation - ${b.tasks[0].project}` : `Wants to start ${b.tasks.length} conversations - ${projects(b)}`
}

function macNotices() {
  const list = waiting().filter((b) => !dismissed.has(b.id) && b.from !== macOpen)
  if (!macFront || list.length === 0) return ''
  return `<div class="notices no-drag" aria-live="polite">${list
    .map(
      (b) => `<div class="notice asks" role="button" tabindex="0" data-review="${b.id}" data-where="Mac">
      <span class="state"></span>
      <span class="lines">
        <span class="title">${esc(noticeTitle(b))}</span>
        <span class="subtitle">${esc(conv(b).title)}</span>
        <span class="body">${esc(b.tasks.map((t) => t.title).join(', '))}</span>
        <span class="notice-actions"><button type="button" class="primary" data-start="${b.id}" data-where="Mac">${b.tasks.length === 1 ? 'Start' : 'Start all'}</button></span>
      </span>
      <button type="button" class="icon-button" aria-label="Dismiss" data-dismiss="${b.id}">${icon('close', 12)}</button>
    </div>`,
    )
    .join('')}</div>`
}

function macNotifications() {
  if (macFront) return ''
  const list = waiting().filter((b) => notified.includes(b.id))
  if (list.length === 0) return ''
  return `<div class="mac-notes">${list
    .map(
      (b) => `<div class="os-note">
    <span class="app-icon"></span>
    <span class="lines" data-review="${b.id}" data-where="Mac" data-front>
      <span class="app"><span>GECKIT</span><span>now</span></span>
      <b>${esc(noticeTitle(b))}</b>
      <span class="sub">${esc(conv(b).title)}</span>
      <span class="text">${esc(b.tasks.map((t) => t.title).join(', '))}</span>
    </span>
    <button type="button" class="quiet os-action" data-start="${b.id}" data-where="Mac">Start all</button>
  </div>`,
    )
    .join('')}</div>`
}

function talkHtml(open, here) {
  const child = children.find((c) => c.id === open)
  const c = CONVERSATIONS[open]
  const other = OTHERS.find((o) => o.id === open)
  const title = child?.title ?? c?.title ?? other?.title
  const project = child?.project ?? c?.project ?? other?.project
  const from = child === undefined ? '' : `<span style="font-size: 12px; color: var(--text-faint)">From <button type="button" class="link-from" data-go="${child.parent}" style="padding: 0; font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer">${esc(CONVERSATIONS[child.parent].title)}</button></span>`
  const transcript = child !== undefined ? childTranscript(child) : c !== undefined ? transcriptOf(open, here) : `<div class="turn"><div class="theirs"><p>${esc(other.stands)}</p></div></div>`
  return { title, project, from, transcript, child }
}

function drawMac() {
  const count = waiting().length
  let talk = ''
  if (macOpen !== undefined) {
    const t = talkHtml(macOpen, 'Mac')
    talk = `<div class="talk-scrim" data-close></div>
    <div class="talk over">
      <div class="talk-head drag">
        <span class="title">${esc(t.title)}</span>
        <span class="tinted" style="font-size: 12px; --tint: var(--project-${COLORS[t.project]})">${t.project}</span>
        ${t.from}
        <div class="spacer"></div>
        <button type="button" class="icon-button no-drag" aria-label="Close" data-close>${icon('close')}</button>
      </div>
      <div class="transcript">${t.transcript}</div>
      <div class="composer"><div class="composer-inner"><textarea rows="1" placeholder="Ask for changes, or type / for commands"></textarea><div class="composer-bar"><span class="spacer"></span><button type="button" class="send" aria-label="Send">${icon('up')}</button></div></div></div>
    </div>`
  }
  document.getElementById('mac').innerHTML = `<div class="chat boarded topped">
    <div class="board">
      <div class="board-head drag">
        <button type="button" class="project no-drag"><span>${icon('folder')}</span><span class="name">All projects</span><span class="spacer"></span><span class="keys">Cmd+K</span>${icon('down', 11)}</button>
        <span class="spacer"></span>
        <span style="font-size: 12px; color: var(--text-faint)">Dock badge: ${count === 0 ? 'none' : count}</span>
        <button type="button" class="new-session no-drag board-new">${icon('plus')}New task<span class="keys">Cmd+N</span></button>
      </div>
      <div class="board-columns">${drawBoard()}</div>
    </div>
    ${talk}
  </div>
  ${macNotices()}
  ${macFront ? '' : '<div class="elsewhere">Another app is in front. GeckIt is behind it.</div>'}
  ${macNotifications()}`
  document.getElementById('mac-label').textContent = macFront ? "The Mac: GeckIt's Chat window, in front" : 'The Mac: GeckIt behind another app'
  document.getElementById('returned').innerHTML =
    returned.length === 0 ? '<span class="dim">What each asker\'s command prints appears here.</span>' : returned.map((r) => `<span class="dim"># ${esc(r.head)}</span>\n${esc(r.lines.join('\n'))}`).join('\n\n')
}

// The phone.

const phone = document.getElementById('phone')
function phoneDoc() {
  const doc = phone.contentDocument
  if (doc.getElementById('root') === null) {
    doc.open()
    doc.write(`<!doctype html><html class="phone" data-theme="light"><head><style>${document.getElementById('app-css').textContent}</style><style>${document.getElementById('request-css').textContent}</style></head><body><div id="root"></div></body></html>`)
    doc.close()
    wire(doc)
  }
  doc.documentElement.dataset.theme = document.documentElement.dataset.theme
  doc.documentElement.style.setProperty('--top', '44px')
  doc.documentElement.style.setProperty('--bottom', '20px')
  return doc
}

function phoneBanners() {
  const list = waiting().filter((b) => b.from !== phoneOpenOn)
  if (list.length === 0) return ''
  return `<div class="notices" aria-live="polite">${[...list]
    .reverse()
    .map(
      (b) => `<div class="notice banner asks" role="button" tabindex="0" data-review="${b.id}" data-where="phone">
      <span class="banner-icon" style="background: var(--project-${COLORS[conv(b).project]})">${icon('more', 18)}</span>
      <span class="lines">
        <span class="banner-head"><span class="banner-what">${b.tasks.length === 1 ? 'Wants to start a conversation' : `Wants to start ${b.tasks.length} conversations`}</span><span class="banner-when">now</span></span>
        <span class="title">${esc(conv(b).title)}</span>
        <span class="body">${esc(b.tasks.map((t) => t.title).join(', '))}</span>
      </span>
    </div>`,
    )
    .join('')}</div>`
}

function drawPhone() {
  const shell = document.getElementById('iphone')
  shell.querySelector('.locked')?.remove()
  document.getElementById('phone-label').textContent = phoneOpen ? 'The iPhone: GeckIt open and linked' : 'The iPhone: locked, GeckIt closed'
  if (!phoneOpen) {
    const n = waiting().reduce((sum, b) => sum + b.tasks.length, 0)
    const lock = document.createElement('div')
    lock.className = 'locked'
    lock.innerHTML = `<div class="clock">9:41</div><div class="date">Monday 28 September</div>
      ${
        pushed
          ? `<div class="os-note" data-push role="button" tabindex="0"><span class="app-icon"></span><span class="lines"><span class="app"><span>GECKIT</span><span>now</span></span><b>${n > 1 ? `Claude wants to start ${n} conversations` : 'Claude wants to start a conversation'}</b><span class="text">${n > 1 ? 'Open GeckIt to review them.' : 'Open GeckIt to review it.'}</span></span></div>`
          : ''
      }
      <div class="hint">${pushed ? 'No task text in the push: it goes through Apple.' : n > 0 ? 'Nothing yet: the Mac is being used.<br>Press "2 minutes pass".' : ''}</div>`
    lock.addEventListener('click', clicked)
    shell.append(lock)
    return
  }
  const doc = phoneDoc()
  const keep = doc.activeElement?.dataset?.note ?? doc.activeElement?.dataset?.reply
  const t = talkHtml(phoneOpenOn, 'phone')
  doc.getElementById('root').innerHTML = `<div class="chat boarded"><div class="talk over">
    <div class="phone-nav">
      <button type="button" class="phone-back">${icon('left', 22)}Board</button>
      <div class="phone-nav-title"><b>${esc(t.title)}</b><span>${t.child === undefined ? t.project : `${t.project} - from ${esc(CONVERSATIONS[t.child.parent].title)}`}</span></div>
      <span class="phone-nav-end"><button type="button" class="phone-icon" aria-label="More">${icon('more', 24)}</button></span>
    </div>
    <div class="transcript">${t.transcript}</div>
    <div class="composer"><div class="composer-inner"><textarea rows="1" placeholder="Message"></textarea><div class="composer-bar"><span class="spacer"></span><button type="button" class="send" aria-label="Send">${icon('up')}</button></div></div></div>
  </div></div>
  ${phoneBanners()}`
  const scroller = doc.querySelector('.transcript')
  scroller.scrollTop = scroller.scrollHeight
  if (keep !== undefined) doc.querySelector(`[data-note="${keep}"],[data-reply="${keep}"]`)?.focus()
}

function draw() {
  const keep = document.activeElement?.dataset?.note ?? document.activeElement?.dataset?.reply
  drawMac()
  drawPhone()
  const scroller = document.querySelector('#mac .transcript')
  if (scroller !== null) scroller.scrollTop = scroller.scrollHeight
  if (keep !== undefined) {
    const field = document.querySelector(`#mac [data-note="${keep}"],#mac [data-reply="${keep}"]`)
    field?.focus()
    field?.setSelectionRange(field.value.length, field.value.length)
  }
  if (focusAfter !== undefined) {
    document.querySelector(focusAfter)?.focus()
    focusAfter = undefined
  }
}

function clicked(event) {
  const at = event.target.closest('[data-start],[data-refuse],[data-open],[data-replying],[data-dismiss],[data-review],[data-go],[data-close],[data-push]')
  if (at === null) return
  const onPhone = at.ownerDocument !== document
  if (at.dataset.start !== undefined) {
    event.stopPropagation()
    return answer(at.dataset.start, 'start', at.dataset.where)
  }
  if (at.dataset.refuse !== undefined) return answer(at.dataset.refuse, 'refuse', at.dataset.where)
  if (at.dataset.open !== undefined) {
    const t = taskOf(at.dataset.open)
    t.open = !t.open
    return draw()
  }
  if (at.dataset.replying !== undefined) {
    batchOf(at.dataset.replying).replying = true
    draw()
    ;(onPhone ? phone.contentDocument : document).querySelector(`${onPhone ? '' : '#mac '}[data-reply="${at.dataset.replying}"]`)?.focus()
    return
  }
  if (at.dataset.dismiss !== undefined) {
    event.stopPropagation()
    dismissed.add(at.dataset.dismiss)
    say('Dismissed. The request still waits in its conversation, and the card still says "Asking you".')
    return draw()
  }
  if (at.dataset.review !== undefined) {
    const b = batchOf(at.dataset.review)
    if (at.dataset.where === 'Mac') {
      macOpen = b.from
      if (at.dataset.front !== undefined) {
        macFront = true
        notified = []
        syncToggles()
      }
      focusAfter = `#mac [data-block="${b.id}"] .primary`
      say('The asking conversation opens at its request, focus on the primary button: Enter starts. Open a row to read its prompt and goal, untick what should not start.')
    } else phoneOpenOn = b.from
    return draw()
  }
  if (at.dataset.go !== undefined) {
    event.stopPropagation()
    if (onPhone) phoneOpenOn = at.dataset.go
    else macOpen = at.dataset.go
    return draw()
  }
  if (at.dataset.close !== undefined) {
    macOpen = undefined
    return draw()
  }
  if (at.dataset.push !== undefined) {
    phoneOpen = true
    pushed = false
    syncToggles()
    phoneOpenOn = waiting()[0]?.from ?? phoneOpenOn
    say('The push opened GeckIt, which linked to the Mac and opened the asking conversation at its request.')
    return draw()
  }
}

function changed(event) {
  const tick = event.target.dataset?.tick
  if (tick !== undefined) {
    taskOf(tick).ticked = event.target.checked
    return draw()
  }
  const note = event.target.dataset?.note
  if (note !== undefined) taskOf(note).note = event.target.value
  const reply = event.target.dataset?.reply
  if (reply !== undefined) batchOf(reply).reply = event.target.value
}

// Enter on the block's button starts, Cmd+Enter from a field does too; Right and Left open and fold a row.
function keyed(event) {
  const block = event.target.closest?.('[data-block]')
  if (block === null || block === undefined) return
  const where = event.target.ownerDocument === document ? 'Mac' : 'phone'
  const b = batchOf(block.dataset.block)
  if (event.key === 'Enter' && (event.metaKey || event.ctrlKey) && event.target.matches('input[type=text]')) {
    event.preventDefault()
    if (ticked(b).length > 0) answer(b.id, 'start', where)
    return
  }
  const open = event.target.dataset?.open
  if (open !== undefined && (event.key === 'ArrowRight' || event.key === 'ArrowLeft')) {
    event.preventDefault()
    taskOf(open).open = event.key === 'ArrowRight'
    draw()
    ;(where === 'Mac' ? document.querySelector(`#mac [data-open="${open}"]`) : phone.contentDocument.querySelector(`[data-open="${open}"]`))?.focus()
  }
}

function wire(root) {
  root.addEventListener('click', clicked)
  root.addEventListener('input', changed)
  root.addEventListener('change', changed)
  root.addEventListener('keydown', keyed)
}
wire(document.getElementById('mac'))

function syncToggles() {
  const front = document.getElementById('p-front')
  front.classList.toggle('on', macFront)
  front.textContent = macFront ? 'Chat window in front' : 'Chat window behind'
  const open = document.getElementById('p-phone')
  open.classList.toggle('on', phoneOpen)
  open.textContent = phoneOpen ? 'Phone open' : 'Phone locked'
}

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && macOpen !== undefined && !event.target.matches?.('input')) {
    macOpen = undefined
    draw()
  }
})
document.getElementById('p-ask').addEventListener('click', () => {
  send('trail')
  say(macFront ? '"Offline trail pages" asks for 3. A notice with "Start all"; its card says "Asking you". The phone shows a banner.' : 'GeckIt is behind another app: a macOS notification with the action "Start all".')
  draw()
})
document.getElementById('p-other').addEventListener('click', () => {
  send('notes')
  say('"Release notes 1.18" asks for 1 while the other may still wait: its own block, notice and "Asking you". One task: "Start", no boxes.')
  draw()
})
document.getElementById('p-gone').addEventListener('click', () => {
  const b = waiting()[0]
  if (b === undefined) return say('Nothing is waiting.')
  b.state = 'withdrawn'
  notified = notified.filter((one) => one !== b.id)
  returned.unshift({ head: `printed to ${conv(b).title}`, lines: ['GeckIt closed before answering.'] })
  say('The command ended before the answer: the block folds to "Claude stopped waiting for these." and nothing started.')
  draw()
})
document.getElementById('p-move').addEventListener('click', () => {
  if (children.length === 0) return say('Start some first.')
  const order = ['working', 'review', 'done']
  children.forEach((c, i) => {
    if (i % 2 === 0 || c.status !== 'working') c.status = order[Math.min(order.indexOf(c.status) + 1, 2)]
  })
  say('The started conversations moved: the rows in the folded block and the counts on the asker\'s card follow them.')
  draw()
})
document.getElementById('p-linked').addEventListener('click', () => {
  const kids = children.filter((c) => c.parent === 'trail')
  const refused = batches.filter((b) => b.from === 'trail' && b.state === 'answered').flatMap((b) => b.tasks.filter((t) => !t.started))
  const lines = [
    ...kids.map((k) => `started  ${`${k.id}-4f1d...`.padEnd(13)}${k.project.padEnd(10)}${STATUS[k.status][1].padEnd(11)}${k.title}`),
    ...refused.map((t) => `refused  ${'-'.padEnd(13)}${t.project.padEnd(10)}${t.title}`),
  ]
  returned.unshift({ head: 'geckit linked, from Offline trail pages', lines: lines.length === 0 ? ['Nothing is linked to this conversation.'] : lines })
  say('For Claude: its children with their status, and what was refused. It reads any of them further with geckit show <id> --last 10.')
  draw()
})
document.getElementById('p-front').addEventListener('click', () => {
  macFront = !macFront
  if (macFront) notified = []
  syncToggles()
  draw()
})
document.getElementById('p-phone').addEventListener('click', () => {
  phoneOpen = !phoneOpen
  if (phoneOpen) pushed = false
  syncToggles()
  draw()
})
document.getElementById('p-wait').addEventListener('click', () => {
  if (waiting().length === 0) return say('Nothing is waiting, so nothing is pushed.')
  if (phoneOpen) return say('The phone is open and already shows its banners, so no push. Lock it first.')
  pushed = true
  say('Two minutes unanswered (or the Mac idle for two): one push, with no task text.')
  draw()
})
document.getElementById('p-reset').addEventListener('click', reset)
document.getElementById('p-theme').addEventListener('click', (event) => {
  const dark = document.documentElement.dataset.theme === 'light'
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'
  event.target.textContent = dark ? 'Light' : 'Dark'
  draw()
})

reset()
</script>
</body>
</html>
