version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /client
      - /mobile
      - /signal/functions
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: playwright-core
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
