name: whisper-cli

# Builds the whisper-cli each installer carries, one per platform and processor, and hands them to Publish as artifacts. Pushed to any branch but main, a change to the build runs it alone, so it can be tried without making a release.
on:
  workflow_call:
  push:
    branches-ignore:
      - main
    paths:
      - 'client/scripts/whisper.sh'
      - 'client/scripts/llama.sh'
      - '.github/workflows/whisper.yml'

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: client
        shell: bash
    strategy:
      matrix:
        include:
          - runner: macos-26
            os: mac
            arch: arm64
          - runner: macos-26
            os: mac
            arch: x64
          - runner: windows-latest
            os: win
            arch: x64
          - runner: ubuntu-latest
            os: linux
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - id: pinned
        run: echo "version=$(sed -n 's/^VERSION=//p' scripts/whisper.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: client/whisper/bin/${{ matrix.os }}-${{ matrix.arch }}
          key: whisper-cli-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.pinned.outputs.version }}-${{ hashFiles('client/scripts/whisper.sh') }}

      - name: Build
        env:
          WHISPER_WORK: ${{ runner.temp }}/whisper
        run: |
          if ls whisper/bin/${{ matrix.os }}-${{ matrix.arch }}/whisper-cli* > /dev/null 2>&1; then echo "From the cache"; else scripts/whisper.sh ${{ matrix.os }} ${{ matrix.arch }}; fi

      # The copy for this runner is run, so one that cannot start fails here; the Intel Mac copy is built on an arm64 runner without Rosetta, so only its architecture is checked.
      - name: Check
        run: |
          bin=whisper/bin/${{ matrix.os }}-${{ matrix.arch }}
          ls -l "$bin"
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            mac-x64) test "$(lipo -archs "$bin/whisper-cli")" = x86_64 ;;
            mac-arm64) otool -L "$bin/whisper-cli"; "$bin/whisper-cli" --help > /dev/null ;;
            linux-x64) ldd "$bin/whisper-cli"; "$bin/whisper-cli" --help > /dev/null ;;
            win-x64) "$bin/whisper-cli.exe" --help > /dev/null ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: whisper-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: client/whisper/bin/${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

      # llama-server runs the small model behind geckit browser find. The Chrome bridge is not on Windows yet, so neither is it.
      - id: llama
        if: matrix.os != 'win'
        run: echo "version=$(sed -n 's/^VERSION=//p' scripts/llama.sh)" >> "$GITHUB_OUTPUT"

      - if: matrix.os != 'win'
        uses: actions/cache@v6
        with:
          path: client/llama/bin/${{ matrix.os }}-${{ matrix.arch }}
          key: llama-server-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.llama.outputs.version }}-${{ hashFiles('client/scripts/llama.sh') }}

      - name: Build llama-server
        if: matrix.os != 'win'
        env:
          LLAMA_WORK: ${{ runner.temp }}/llama
        run: |
          if ls llama/bin/${{ matrix.os }}-${{ matrix.arch }}/llama-server > /dev/null 2>&1; then echo "From the cache"; else scripts/llama.sh ${{ matrix.os }} ${{ matrix.arch }}; fi

      - name: Check llama-server
        if: matrix.os != 'win'
        run: |
          bin=llama/bin/${{ matrix.os }}-${{ matrix.arch }}
          ls -l "$bin"
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            mac-x64) test "$(lipo -archs "$bin/llama-server")" = x86_64 ;;
            mac-arm64) otool -L "$bin/llama-server"; "$bin/llama-server" --version ;;
            linux-x64) ldd "$bin/llama-server"; "$bin/llama-server" --version ;;
          esac

      - if: matrix.os != 'win'
        uses: actions/upload-artifact@v7
        with:
          name: llama-server-${{ matrix.os }}-${{ matrix.arch }}
          path: client/llama/bin/${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
