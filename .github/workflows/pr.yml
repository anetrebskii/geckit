name: Pull request

on:
  pull_request:
  workflow_dispatch:

# A pull request from a fork runs with code nobody has reviewed yet, so the token only reads and no secret is used anywhere below.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # The same builds as a release, unsigned, kept on the run for a week so a reviewer can install what the pull request makes.
  build:
    needs: check
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run build
      - name: Package unsigned
        run: |
          sign=()
          if [ "${{ matrix.platform }}" = mac ]; then sign=(-c.mac.identity=- -c.mac.hardenedRuntime=false); fi
          npm exec electron-builder -- --publish never --${{ matrix.platform }} "${sign[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: geckit-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            client/release/build/*.dmg
            client/release/build/*.exe
            client/release/build/*.AppImage

  ios:
    needs: check
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: |
          npm ci --prefix ../client
          npm ci
          npm run build
          npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/GeckIt.xcarchive" archive CODE_SIGNING_ALLOWED=NO

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Use Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: |
          npm ci --prefix ../client
          npm ci
          npm run build
          npx cap sync android
      - name: Build Android and tests
        working-directory: mobile/android
        run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - name: Start Android emulator
        run: |
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckit-test -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd geckit-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          timeout 240 bash -c 'until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
      - name: Exercise native localhost form submissions
        working-directory: mobile/android
        run: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geckit-android-checks
          retention-days: 7
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/outputs/androidTest-results/
            mobile/android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/emulator.log
