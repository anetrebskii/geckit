name: Publish

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'mobile/**'
      - '.github/workflows/publish.yml'

permissions:
  deployments: write
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: |
          npm ci
          npm run lint
          npm test

  # Decided once, so the three builds carry the same number. The major is set here and nowhere else; the minor is one past the highest tag that has it, and the tag is made before the builds start. The same action and the same shape as Twins-AI.
  # The action pushes .version to main, which the ruleset lets only the owner update, so it pushes with the owner's token. Pull requests never see this secret.
  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: entech-code/auto-version-tagging-action@7615bc1048b4e526aa6403e39e38bc0dba86f981
        id: pick
        with:
          token: ${{ secrets.VERSION_TOKEN }}
          majorVersion: 1

  whisper:
    needs: test
    uses: ./.github/workflows/whisper.yml

  publish:
    needs: [version, whisper]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
        shell: bash

    strategy:
      matrix:
        include:
          - os: macos-26
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The Developer ID for the Mac build only; with no secret the build is unsigned, as before.
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Read by the build: only a signed Mac copy can install an update over itself.
      GECKIT_SIGNED: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK != '' }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v7

      - name: Install Node and NPM
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # electron-builder packs whisper/bin/<os>-<arch> into the app's resources; the artifacts lose the executable bit on the way.
      - name: Take whisper-cli
        uses: actions/download-artifact@v8
        with:
          name: whisper-cli-${{ matrix.platform }}-x64
          path: client/whisper/bin/${{ matrix.platform }}-x64

      - name: Take Apple Silicon whisper-cli
        if: matrix.platform == 'mac'
        uses: actions/download-artifact@v8
        with:
          name: whisper-cli-mac-arm64
          path: client/whisper/bin/mac-arm64

      - name: Take llama-server
        if: matrix.platform != 'win'
        uses: actions/download-artifact@v8
        with:
          name: llama-server-${{ matrix.platform }}-x64
          path: client/llama/bin/${{ matrix.platform }}-x64

      - name: Take Apple Silicon llama-server
        if: matrix.platform == 'mac'
        uses: actions/download-artifact@v8
        with:
          name: llama-server-mac-arm64
          path: client/llama/bin/mac-arm64

      - name: Take the secrets broker
        uses: actions/download-artifact@v8
        with:
          name: geckit-broker-${{ matrix.platform }}-x64
          path: client/broker/bin/${{ matrix.platform }}-x64

      - name: Take the Apple Silicon secrets broker
        if: matrix.platform == 'mac'
        uses: actions/download-artifact@v8
        with:
          name: geckit-broker-mac-arm64
          path: client/broker/bin/mac-arm64

      - name: Install and build
        run: |
          chmod +x whisper/bin/*/whisper-cli*
          chmod +x broker/bin/*/geckit-broker* 2>/dev/null || true
          mkdir -p llama/bin/${{ matrix.platform }}-x64
          chmod +x llama/bin/*/llama-server* 2>/dev/null || true
          ls -lR whisper/bin
          npm ci
          if [ "${{ matrix.platform }}" = mac ]; then
            node scripts/prepare-mac-service-addons.cjs
          fi
          npm run typecheck
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run build

      - name: Upload to the draft release
        run: |
          sign=()
          if [ "$GECKIT_SIGNED" = true ]; then
            # electron-builder unlocks the keychain it makes with the certificate's password instead of the keychain's own, and macOS 26 refuses that. So the certificate goes into a keychain made here, and electron-builder finds the identity in it.
            keychain="$RUNNER_TEMP/geckit.keychain-db"
            unlock=$(openssl rand -hex 24)
            echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/geckit.p12"
            security create-keychain -p "$unlock" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$unlock" "$keychain"
            security import "$RUNNER_TEMP/geckit.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$unlock" "$keychain" > /dev/null
            rm "$RUNNER_TEMP/geckit.p12"
            # Apple's intermediate certificates, which electron-builder ships, so the identity's chain can be built.
            cp node_modules/app-builder-lib/certs/root_certs.keychain "$RUNNER_TEMP/apple-roots.keychain"
            security list-keychains -d user -s "$keychain" "$RUNNER_TEMP/apple-roots.keychain" $(security list-keychains -d user | tr -d '"')
            security find-identity -v -p codesigning "$keychain"
            unset CSC_LINK CSC_KEY_PASSWORD
            # Without an identity electron-builder only warns and ships the app unsigned; this makes it fail instead.
            sign=(-c.mac.notarize=true -c.forceCodeSigning=true)
          else
            # An empty CSC_LINK is read as a path, so it is taken away rather than left blank.
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Without a certificate the Mac app is signed ad hoc, because a Mac calls an app with an unsealed signature damaged and offers only the Trash.
            if [ "${{ matrix.platform }}" = mac ]; then sign=(-c.mac.identity=- -c.mac.hardenedRuntime=false); fi
          fi
          npm exec electron-builder -- --publish always --${{ matrix.platform }} "${sign[@]}"

      # A broken signature fails the run here, and the release stays a draft nobody updates to.
      - name: Check the Mac signature
        if: matrix.platform == 'mac'
        run: |
          for app in release/build/mac-arm64/GeckIt.app release/build/mac/GeckIt.app; do
            codesign --verify --deep --strict "$app"
            # With the certificate, macOS itself has to call it notarized Developer ID, which is what opens it without a warning.
            if [ "$GECKIT_SIGNED" = true ]; then spctl --assess --type execute --verbose=4 "$app"; fi
          done

  ios:
    needs: version
    runs-on: macos-26
    environment: testflight
    outputs:
      artifact-id: ${{ steps.ipa.outputs.artifact-id }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install and build
        run: |
          npm ci --prefix ../client
          npm ci
          npm run build
          npx cap sync ios

      - name: Archive and export the signed iOS package
        env:
          IOS_APP_PROFILE: ${{ secrets.IOS_APP_PROFILE }}
          IOS_EXTENSION_PROFILE: ${{ secrets.IOS_EXTENSION_PROFILE }}
          IOS_SIGNING_P12: ${{ secrets.IOS_SIGNING_P12 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          : "${IOS_SIGNING_P12:?Configure IOS_SIGNING_P12 in the testflight environment}"
          : "${IOS_SIGNING_P12_PASSWORD:?Configure IOS_SIGNING_P12_PASSWORD in the testflight environment}"
          umask 077
          signing=$(mktemp -d "$RUNNER_TEMP/ios-signing.XXXXXX")
          keychain="$signing/ios.keychain-db"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -r "$signing"' EXIT
          unlock=$(openssl rand -hex 24)
          printf '%s' "$IOS_SIGNING_P12" | base64 --decode > "$signing/signing.p12"
          security create-keychain -p "$unlock" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$unlock" "$keychain"
          security import "$signing/signing.p12" -k "$keychain" -P "$IOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$unlock" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          unset IOS_SIGNING_P12 IOS_SIGNING_P12_PASSWORD
          bash scripts/export-ios.sh "$VERSION" "$GITHUB_RUN_NUMBER"

      - name: Retain the signed IPA
        id: ipa
        uses: actions/upload-artifact@v7
        with:
          name: geckit-ios-${{ needs.version.outputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/GeckIt.ipa
          if-no-files-found: error
          retention-days: 90

  # Published only once every build is in it, which is when the installed copies see it. A prerelease is the Development channel; Promote is what makes one Latest, which is Stable and what the website links at.
  release:
    needs: [version, publish, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          IOS_ARTIFACT_ID: ${{ needs.ios.outputs.artifact-id }}
        run: |
          : "${IOS_ARTIFACT_ID:?Publish did not produce an iOS artifact}"
          jq -n --arg version "$VERSION" --arg build "$GITHUB_RUN_NUMBER" --arg source "$GITHUB_SHA" --arg artifactId "$IOS_ARTIFACT_ID" \
            '{version: $version, build: $build, source: $source, artifactId: $artifactId}' > ios-build.json
          gh release upload "v$VERSION" ios-build.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
