name: Publish

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'mobile/**'
      - '.github/workflows/publish.yml'

permissions:
  deployments: write
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: |
          npm ci
          npm run lint
          npm test

  # Decided once, so the three builds carry the same number. The major is set here and nowhere else; the minor is one past the highest tag that has it, and the tag is made before the builds start. The same action and the same shape as Twins-AI.
  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: entech-code/auto-version-tagging-action@HEAD
        id: pick
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          majorVersion: 1

  publish:
    needs: version
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
        shell: bash

    strategy:
      matrix:
        include:
          - os: macos-26
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The Developer ID for the Mac build only; with no secret the build is unsigned, as before.
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Read by the build: only a signed Mac copy can install an update over itself.
      GECKIT_SIGNED: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK != '' }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v5

      - name: Install Node and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install and build
        run: |
          npm ci
          npm run typecheck
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run build

      - name: Upload to the draft release
        run: |
          sign=()
          if [ "$GECKIT_SIGNED" = true ]; then
            # electron-builder unlocks the keychain it makes with the certificate's password instead of the keychain's own, and macOS 26 refuses that. So the certificate goes into a keychain made here, and electron-builder finds the identity in it.
            keychain="$RUNNER_TEMP/geckit.keychain-db"
            unlock=$(openssl rand -hex 24)
            echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/geckit.p12"
            security create-keychain -p "$unlock" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$unlock" "$keychain"
            security import "$RUNNER_TEMP/geckit.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$unlock" "$keychain" > /dev/null
            rm "$RUNNER_TEMP/geckit.p12"
            # Apple's intermediate certificates, which electron-builder ships, so the identity's chain can be built.
            cp node_modules/app-builder-lib/certs/root_certs.keychain "$RUNNER_TEMP/apple-roots.keychain"
            security list-keychains -d user -s "$keychain" "$RUNNER_TEMP/apple-roots.keychain" $(security list-keychains -d user | tr -d '"')
            security find-identity -v -p codesigning "$keychain"
            unset CSC_LINK CSC_KEY_PASSWORD
            # Without an identity electron-builder only warns and ships the app unsigned; this makes it fail instead.
            sign=(-c.mac.notarize=true -c.forceCodeSigning=true)
          else
            # An empty CSC_LINK is read as a path, so it is taken away rather than left blank.
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Without a certificate the Mac app is signed ad hoc, because a Mac calls an app with an unsealed signature damaged and offers only the Trash.
            if [ "${{ matrix.platform }}" = mac ]; then sign=(-c.mac.identity=- -c.mac.hardenedRuntime=false); fi
          fi
          npm exec electron-builder -- --publish always --${{ matrix.platform }} "${sign[@]}"

      # A broken signature fails the run here, and the release stays a draft nobody updates to.
      - name: Check the Mac signature
        if: matrix.platform == 'mac'
        run: |
          for app in release/build/mac-arm64/GeckIt.app release/build/mac/GeckIt.app; do
            codesign --verify --deep --strict "$app"
            # With the certificate, macOS itself has to call it notarized Developer ID, which is what opens it without a warning.
            if [ "$GECKIT_SIGNED" = true ]; then spctl --assess --type execute --verbose=4 "$app"; fi
          done

  # The iPhone app is built here so a change that breaks it fails the run; it goes to App Store Connect from the Mac, by hand.
  ios:
    needs: version
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install and build
        run: |
          npm ci --prefix ../client
          npm ci
          npm run build
          npx cap sync ios

      - name: Archive
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/GeckIt.xcarchive" archive CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=${{ needs.version.outputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }}

  # Published only once every build is in it, which is when the installed copies see it.
  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --repo "${{ github.repository }}" --draft=false --latest
