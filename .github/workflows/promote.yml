name: Promote

# Moves a build from Development to Stable. Nothing is rebuilt: the installers get copies named without the version and the release is marked Latest, which is what copies on Stable read and what the website's releases/latest link opens.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (X.Y.Z). Empty takes the newest development build.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: promote

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.promote.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Promote to Stable
        id: promote
        run: |
          if [ -z "$VERSION" ]; then
            tag=$(gh release list --repo "$REPO" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          else
            tag="v${VERSION#v}"
          fi
          echo "Promoting $tag"
          # Every platform's updater file has to be there, or a copy on Stable would be told to update and find nothing to fetch.
          assets=$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name')
          missing=""
          for file in latest-mac.yml latest.yml latest-linux.yml; do
            grep -qx "$file" <<< "$assets" || missing="$missing $file"
          done
          if [ -n "$missing" ]; then
            echo "::error::$tag cannot go to Stable, it is missing:$missing"
            exit 1
          fi
          # Copies without the version in the name, so the README's buttons at releases/latest/download/<name> download the file itself.
          dir=$(mktemp -d)
          v=${tag#v}
          for file in "GeckIt-$v-arm64.dmg" "GeckIt-$v-x64.dmg" "GeckIt-Setup-$v.exe" "GeckIt-$v.AppImage"; do
            gh release download "$tag" --repo "$REPO" --pattern "$file" --dir "$dir"
            mv "$dir/$file" "$dir/${file/-$v/}"
          done
          gh release upload "$tag" --repo "$REPO" --clobber "$dir"/*
          gh release edit "$tag" --repo "$REPO" --draft=false --prerelease=false --latest
          echo "$tag is Stable: https://github.com/$REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  testflight:
    needs: promote
    if: github.ref == 'refs/heads/main' && vars.TESTFLIGHT_AUTO_PUBLISH == 'true'
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Retrieve the signed IPA for the promoted version
        id: ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.promote.outputs.tag }}
        run: |
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern ios-build.json --dir "$RUNNER_TEMP"; then
            echo "::error::$TAG has no iOS package recorded. TestFlight needs a release built by the updated Publish workflow."
            exit 1
          fi
          manifest="$RUNNER_TEMP/ios-build.json"
          version=${TAG#v}
          artifact=$(jq -er --arg version "$version" 'select(.version == $version) | .artifactId | select(test("^[0-9]+$"))' "$manifest")
          build=$(jq -er '.build | select(test("^[0-9]+$"))' "$manifest")
          if ! gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/geckit-ios.zip"; then
            echo "::error::$TAG iOS artifact $artifact is unavailable. Check its GitHub Actions retention."
            exit 1
          fi
          unzip -p "$RUNNER_TEMP/geckit-ios.zip" GeckIt.ipa > "$RUNNER_TEMP/GeckIt.ipa"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Deliver the retained IPA to TestFlight Public
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          VERSION: ${{ steps.ipa.outputs.version }}
          BUILD: ${{ steps.ipa.outputs.build }}
        run: node mobile/scripts/testflight.mjs deliver "$RUNNER_TEMP/GeckIt.ipa" "$VERSION" "$BUILD"
