<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GeckIt Browser</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --bg-hover: rgb(0 0 0 / 5%);
  --fill: rgb(118 118 128 / 12%);
  --separator: rgb(60 60 67 / 18%);
  --text: #1d1d1f;
  --text-dim: #5c5c61;
  --text-faint: #737378;
  --accent: #1f8031;
  --accent-soft: #e6f4e8;
  --danger: #c0392b;
  --warning: #c08a1e;
  --warning-bg: #fdf3e0;
  --warning-text: #8a6116;
  --idle: #8e8e93;
  --on-solid: #ffffff;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --quick: 120ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1e20;
    --bg-hover: rgb(255 255 255 / 7%);
    --fill: rgb(118 118 128 / 24%);
    --separator: rgb(84 84 88 / 60%);
    --text: #f2f2f4;
    --text-dim: #a2a2a8;
    --text-faint: #8e8e95;
    --accent: #4ac85c;
    --accent-soft: rgb(74 200 92 / 16%);
    --danger: #ff6b5e;
    --warning: #e0bb72;
    --warning-bg: #3a2f18;
    --warning-text: #e0bb72;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 340px; max-height: 580px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 12px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; }
header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
header img { flex: none; }
.head { flex: 1; min-width: 0; }
h1 { font-size: 13px; font-weight: 600; }
.status { display: flex; align-items: center; gap: 6px; color: var(--text-dim); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); flex: none; transition: background var(--quick) var(--ease); }
.on .dot { background: var(--accent); }
.paused .dot { background: var(--warning); }
.faint { color: var(--text-faint); }
.hint { margin: 0 16px 10px; padding: 8px 10px; border-radius: 8px; background: var(--fill); color: var(--text-dim); }
.paused-hint { background: var(--warning-bg); color: var(--warning-text); }
.now { display: flex; align-items: center; gap: 10px; margin: 0 12px 8px; padding: 8px 10px; border: 0; border-radius: 8px; background: var(--accent-soft); color: var(--text); font: inherit; text-align: start; cursor: pointer; width: calc(100% - 24px); }
.now[hidden] { display: none; }
.now:hover { filter: brightness(0.97); }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; border-right-color: var(--accent); opacity: 0.6; } }
main { flex: 1; overflow-y: auto; border-top: 1px solid var(--separator); }
section { padding: 10px 0 6px; }
section + section { border-top: 1px solid var(--separator); }
h2 { padding: 0 16px 4px; font-size: 11px; font-weight: 600; color: var(--text-faint); }
ul, ol { list-style: none; }
.tab { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 16px; border: 0; background: none; color: inherit; font: inherit; text-align: start; cursor: pointer; transition: background var(--quick) var(--ease); }
.tab:hover, .tab:focus-visible { background: var(--bg-hover); outline: none; }
.tab img, .tab .blank { width: 16px; height: 16px; flex: none; border-radius: 3px; }
.tab .blank { background: var(--fill); }
.lines { flex: 1; min-width: 0; }
.title, .sub { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.title { font-weight: 500; }
.sub { color: var(--text-faint); }
.chip { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 2px 42px; padding: 2px 4px 2px 8px; border-radius: 6px; background: var(--fill); color: var(--text-dim); font-size: 11px; }
.chip button { border: 0; border-radius: 4px; padding: 1px 6px; background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
.chip button:hover { background: var(--bg-hover); }
.mark { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.log li { display: flex; gap: 10px; padding: 4px 16px; }
.log time { flex: none; min-width: 40px; white-space: nowrap; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.log .what { flex: 1; min-width: 0; }
.log .where { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text-faint); }
.log .error { display: block; color: var(--danger); }
.empty { padding: 4px 16px 6px; color: var(--text-faint); }
footer { border-top: 1px solid var(--separator); padding: 10px 16px 12px; }
.allow { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.allow > span { flex: 1; }
.allow strong { display: block; font-weight: 500; }
.switch { appearance: none; flex: none; position: relative; width: 32px; height: 19px; border-radius: 10px; background: var(--fill); cursor: pointer; transition: background var(--quick) var(--ease); }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--on-solid); box-shadow: 0 1px 2px rgb(0 0 0 / 25%); transition: transform var(--quick) var(--ease); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(13px); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <img src="icons/32.png" width="28" height="28" alt="">
  <div class="head">
    <h1>GeckIt Browser</h1>
    <p id="status" class="status"><span class="dot"></span><span id="status-text">Not connected</span></p>
  </div>
  <span id="version" class="faint"></span>
</header>
<p id="hint" class="hint" hidden></p>
<button id="now" class="now" hidden><span class="spin"></span><span class="lines"><span id="now-what" class="title"></span><span id="now-tab" class="sub"></span></span></button>
<main>
  <section>
    <h2>Tabs</h2>
    <ul id="tabs"></ul>
    <p id="tabs-empty" class="empty">No tabs yet. Tabs GeckIt opens go into the green GeckIt group.</p>
  </section>
  <section>
    <h2>Activity</h2>
    <ol id="log" class="log"></ol>
    <p id="log-empty" class="empty">Nothing yet.</p>
  </section>
</main>
<footer>
  <label class="allow">
    <span><strong>Let GeckIt use Chrome</strong><span id="allow-note" class="faint">Conversations in GeckIt can read and use your tabs.</span></span>
    <input id="allow" class="switch" type="checkbox" role="switch">
  </label>
</footer>
<script src="popup.js"></script>
</body>
</html>
